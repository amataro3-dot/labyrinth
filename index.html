<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>軍人将棋風 迷路ゲーム</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a1a; color: #fff; display: flex; flex-direction: column;
      align-items: center; justify-content: center; min-height: 100vh; padding: 6px;
      overflow: hidden;
    }
    .container { width: 100%; max-width: 360px; display: flex; flex-direction: column; gap: 6px; }
    h1 { text-align: center; font-size: 1rem; color: #4dabf7; }
    .card { background: #2a2a2a; border-radius: 8px; padding: 8px; border: 1px solid #333; }
    input, select, button {
      width: 100%; padding: 8px; border-radius: 6px; border: none; font-size: 0.9rem; margin-top: 4px;
    }
    input, select { background: #333; color: #fff; border: 1px solid #444; }
    button { background: #228be6; color: white; font-weight: bold; cursor: pointer; }
    button:active { opacity: 0.8; }
    .board-title { font-size: 0.75rem; font-weight: bold; margin-bottom: 2px; color: #ffe066; text-align: center; }
    .board {
      display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px;
      background: #111; padding: 2px; border-radius: 6px; aspect-ratio: 1;
      max-height: 220px;
    }
    .cell {
      background: #343a40; border-radius: 3px; display: flex;
      align-items: center; justify-content: center; font-weight: bold;
      font-size: 0.75rem; cursor: pointer; user-select: none;
    }
    .cell.start { background: #2b8a3e; color: white; }
    .cell.goal { background: #e03131; color: white; }
    .log-box {
      background: #111; height: 50px; border-radius: 4px; padding: 4px 8px;
      font-size: 0.7rem; overflow-y: auto; display: flex; flex-direction: column; justify-content: flex-end;
    }
    .log-line { margin: 1px 0; color: #ced4da; line-height: 1.1; }
    .log-sys { color: #74c0fc; }
    
    /* スタンプオーバーレイ表示 */
    #dame-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.75); display: none; justify-content: center;
      align-items: center; z-index: 9999;
    }
    #dame-overlay img { max-width: 80%; max-height: 60%; animation: popIn 0.2s ease-out; }
    @keyframes popIn { 0% { transform: scale(0.3); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <h1>軍人将棋風 迷路ゲーム</h1>

  <!-- 1. ロビー -->
  <div id="screen-lobby" class="card">
    <label style="font-size:0.8rem;">名前</label>
    <input type="text" id="input-name" placeholder="名前を入力" value="プレイヤー">
    
    <div style="margin-top: 8px;">
      <button id="btn-cpu">🤖 1人で遊ぶ (CPU対戦)</button>
    </div>

    <hr style="margin: 10px 0; border: 0; border-top: 1px solid #444;">

    <div>
      <label style="font-size:0.8rem;">2人で遊ぶ (部屋を作成/参加)</label>
      <input type="text" id="input-room" placeholder="部屋IDを入力">
      <div style="display:flex; gap:4px; margin-top:4px;">
        <button id="btn-create" style="background:#12b886;">部屋を作る</button>
        <button id="btn-join" style="background:#ff922b;">部屋に入る</button>
      </div>
    </div>
  </div>

  <!-- 2. ゲーム画面 -->
  <div id="screen-game" class="card hidden">
    <div id="status-bar" style="font-size:0.75rem; color:#aaa; margin-bottom:4px; text-align:center;"></div>

    <div class="board-title" id="title-opponent">相手の陣地 (タップして進む)</div>
    <div id="board-opponent" class="board"></div>

    <div class="board-title" id="title-self" style="margin-top:4px;">自分の陣地 (赤＝あなたの壁)</div>
    <div id="board-self" class="board"></div>

    <button id="btn-ready" class="hidden" style="margin-top:6px; background:#2b8a3e;">壁の配置完了！</button>

    <div style="margin-top:4px;">
      <div class="log-box" id="log-box"></div>
    </div>
  </div>
</div>

<!-- 壁衝突時に表示されるスタンプ画面 -->
<div id="dame-overlay">
  <img id="dame-img" src="" alt="だめ。">
</div>

<script>
  const DAME_IMAGE_BASE64 = "data:image/png;base64,iVBORw0KGgoAAAANSU_dame_stamp_data";

  let mode = "cpu"; // 'cpu' or 'online'
  let peer = null;
  let conn = null;
  let myWalls = [];
  let oppWalls = [];
  let discoveredWalls = [];
  let myPos = { x: 0, y: 5 };
  let oppPos = { x: 0, y: 5 };
  let phase = "setup";
  let isMyTurn = false;
  let movesLeft = 2; // 1ターン2マス移動

  const $ = id => document.getElementById(id);

  window.onload = () => {
    $('dame-img').src = DAME_IMAGE_BASE64;
    $('btn-cpu').onclick = startCpuMode;
    $('btn-create').onclick = createRoom;
    $('btn-join').onclick = joinRoom;
  };

  function showLog(msg, isSys = false) {
    const box = $('log-box');
    const div = document.createElement('div');
    div.className = 'log-line' + (isSys ? ' log-sys' : '');
    div.textContent = msg;
    box.appendChild(div);
    if (box.children.length > 4) box.removeChild(box.firstChild);
    box.scrollTop = box.scrollHeight;
  }

  function triggerDame() {
    const el = $('dame-overlay');
    el.style.display = 'flex';
    setTimeout(() => { el.style.display = 'none'; }, 1200);
  }

  function startCpuMode() {
    mode = 'cpu';
    initGameUI("自分の陣地に壁（赤）を配置してください");
  }

  function createRoom() {
    const roomId = $('input-room').value.trim();
    if (!roomId) return alert("部屋IDを入力してください");
    mode = 'online';
    peer = new Peer(roomId);
    peer.on('open', id => {
      showLog(`部屋作成: ${id} (対戦相手を待っています...)`, true);
      initGameUI("相手の接続を待っています...");
    });
    peer.on('connection', c => {
      conn = c;
      setupConnection();
    });
  }

  function joinRoom() {
    const roomId = $('input-room').value.trim();
    if (!roomId) return alert("部屋IDを入力してください");
    mode = 'online';
    peer = new Peer();
    peer.on('open', () => {
      conn = peer.connect(roomId);
      setupConnection();
    });
  }

  function setupConnection() {
    conn.on('open', () => {
      initGameUI("接続成功！自分の陣地に壁を配置してください");
    });
    conn.on('data', data => handleNetworkData(data));
  }

  function initGameUI(statusText) {
    $('screen-lobby').classList.add('hidden');
    $('screen-game').classList.remove('hidden');$('status-bar').textContent = statusText;
    initBoards();
  }

  function initBoards() {
    const bSelf = $('board-self');
    const bOpp = $('board-opponent');
    bSelf.innerHTML = ''; bOpp.innerHTML = '';

    for (let y = 0; y < 6; y++) {
      for (let x = 0; x < 6; x++) {
        const cS = document.createElement('div');
        cS.className = 'cell';
        cS.dataset.x = x; cS.dataset.y = y;
        if (x === 0 && y === 5) { cS.classList.add('start'); cS.textContent = 'S'; }
        if (x === 5 && y === 0) { cS.classList.add('goal'); cS.textContent = 'G'; }
        cS.onclick = () => onSelfCellClick(x, y);
        bSelf.appendChild(cS);

        const cO = document.createElement('div');
        cO.className = 'cell';
        cO.dataset.x = x; cO.dataset.y = y;
        if (x === 0 && y === 5) { cO.classList.add('start'); cO.textContent = 'S'; }
        if (x === 5 && y === 0) { cO.classList.add('goal'); cO.textContent = 'G'; }
        cO.onclick = () => onOppCellClick(x, y);
        bOpp.appendChild(cO);
      }
    }
    $('btn-ready').classList.remove('hidden');$('btn-ready').onclick = finishSetup;
  }

  function onSelfCellClick(x, y) {
    if (phase !== 'setup') return;
    if ((x === 0 && y === 5) || (x === 5 && y === 0)) return;
    const idx = myWalls.findIndex(w => w.x === x && w.y === y);
    if (idx >= 0) {
      myWalls.splice(idx, 1);
    } else {
      if (myWalls.length < 10) myWalls.push({ x, y });
    }
    renderSelfBoard();
  }

  function renderSelfBoard() {
    const cells = $('board-self').children;
    for (let c of cells) {
      const x = parseInt(c.dataset.x);
      const y = parseInt(c.dataset.y);
      c.style.background = '';
      if (x === 0 && y === 5) continue;
      if (x === 5 && y === 0) continue;
      if (myWalls.some(w => w.x === x && w.y === y)) {
        c.style.background = '#e03131';
      }
    }
  }

  function finishSetup() {
    $('btn-ready').classList.add('hidden');
    if (mode === 'cpu') {
      phase = 'playing';
      isMyTurn = true;
      movesLeft = 2;
      oppWalls = [];
      while (oppWalls.length < 8) {
        let rx = Math.floor(Math.random() * 6);
        let ry = Math.floor(Math.random() * 6);
        if ((rx === 0 && ry === 5) || (rx === 5 && ry === 0)) continue;
        if (!oppWalls.some(w => w.x === rx && w.y === ry)) oppWalls.push({ x: rx, y: ry });
      }
      updateTurnStatus();
    } else {
      conn.send({ type: 'ready', walls: myWalls });
      $('status-bar').textContent = "相手の壁配置完了を待っています...";
    }
  }

  function handleNetworkData(data) {
    if (data.type === 'ready') {
      oppWalls = data.walls;
      phase = 'playing';
      isMyTurn = true; // ホスト先攻設定（調整可能）
      movesLeft = 2;
      updateTurnStatus();
    } else if (data.type === 'move_check') {
      // 相手からの移動判定要求
      const hit = myWalls.some(w => w.x === data.x && w.y === data.y);
      conn.send({ type: 'move_result', x: data.x, y: data.y, hit });
      if (!hit) oppPos = { x: data.x, y: data.y };
    } else if (data.type === 'move_result') {
      handleMoveResult(data.x, data.y, data.hit);
    }
  }

  function updateTurnStatus() {
    if (isMyTurn) {
      $('status-bar').textContent = `あなたのターン (残り ${movesLeft} マス移動可)`;
    } else {
      $('status-bar').textContent = "相手のターンです...";
    }
  }

  function onOppCellClick(x, y) {
    if (phase !== 'playing' || !isMyTurn) return;
    const dx = Math.abs(x - myPos.x);
    const dy = Math.abs(y - myPos.y);

    // 縦横1マス（隣接）の場所のみ進める（元の位置に戻る動作も1マス消費）
    if ((dx === 1 && dy === 0) || (dx === 0 && dy === 1)) {
      if (mode === 'cpu') {
        const hit = oppWalls.some(w => w.x === x && w.y === y);
        handleMoveResult(x, y, hit);
      } else {
        conn.send({ type: 'move_check', x, y });
      }
    }
  }

  function handleMoveResult(x, y, hit) {
    if (hit) {
      // 壁に衝突！スタンプを表示して即ターンエンド
      triggerDame();
      if (!discoveredWalls.some(w => w.x === x && w.y === y)) {
        discoveredWalls.push({ x, y });
      }
      showLog(`(${x},${y}) は壁！「だ め。」`, true);
      renderOppBoard();
      endTurn();
    } else {
      myPos = { x, y };
      movesLeft--;
      showLog(`(${x},${y}) に移動 (残り${movesLeft}歩)`);
      renderOppBoard();

      if (x === 5 && y === 0) {
        phase = 'ended';
        $('status-bar').textContent = "🎉 あなたの勝利です！";
        showLog("ゴールに到達！あなたの勝ちです！", true);
        return;
      }

      if (movesLeft <= 0) {
        endTurn();
      } else {
        updateTurnStatus();
      }
    }
  }

  function endTurn() {
    isMyTurn = false;
    updateTurnStatus();
    if (mode === 'cpu') {
      setTimeout(cpuTurn, 1000);
    }
  }

  function renderOppBoard() {
    const cells = $('board-opponent').children;
    for (let c of cells) {
      const x = parseInt(c.dataset.x);
      const y = parseInt(c.dataset.y);
      c.style.background = '';
      
      if (x === myPos.x && y === myPos.y) {
        c.textContent = '👤';
      } else if (x === 0 && y === 5) {
        c.textContent = 'S';
      } else if (x === 5 && y === 0) {
        c.textContent = 'G';
      } else {
        c.textContent = '';
      }

      if (discoveredWalls.some(w => w.x === x && w.y === y)) {
        c.style.background = '#e03131';
        c.textContent = '✕';
      }
    }
  }

  function cpuTurn() {
    if (phase !== 'playing') return;
    let cpuMoves = 2;

    function executeCpuStep() {
      if (cpuMoves <= 0 || phase !== 'playing') {
        isMyTurn = true;
        movesLeft = 2;
        updateTurnStatus();
        return;
      }

      let dirs = [{x:0,y:1},{x:0,y:-1},{x:1,y:0},{x:-1,y:0}];
      let valid = dirs.map(d => ({ x: oppPos.x + d.x, y: oppPos.y + d.y }))
                      .filter(p => p.x >= 0 && p.x < 6 && p.y >= 0 && p.y < 6);
      let target = valid[Math.floor(Math.random() * valid.length)];

      if (myWalls.some(w => w.x === target.x && w.y === target.y)) {
        showLog(`CPUが(${target.x},${target.y})の壁に衝突！`, true);
        // 壁にぶつかったら残りの移動権は消滅
        isMyTurn = true;
        movesLeft = 2;
        updateTurnStatus();
      } else {
        oppPos = target;
        cpuMoves--;
        showLog(`CPUが(${target.x},${target.y})に移動`);
        if (oppPos.x === 5 && oppPos.y === 0) {
          phase = 'ended';
          $('status-bar').textContent = "💀 CPUの勝利です...";
          showLog("CPUがゴールしました！あなたの負けです", true);
        } else {
          setTimeout(executeCpuStep, 800);
        }
      }
    }

    executeCpuStep();
  }
</script>
</body>
</html>
