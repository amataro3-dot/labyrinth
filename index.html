<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Labyrinth</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css?v=6">
<h1>Labyrinth</h1>
<section id="title">
 <input id="nm" maxlength="10" placeholder="なまえ">
 <button id="mk">ルームを作成</button>
 <div class="row"><input id="rid" maxlength="4" inputmode="numeric" placeholder="ルームID(4桁)"><button id="jn">入室</button></div>
 <div class="row"><select id="lv"><option value="1">よわい</option><option value="2" selected>ふつう</option><option value="3">つよい</option></select><button id="cp">コンピューター戦</button></div>
</section>
<section id="lobby" hidden>
 <p>ルームID：<b id="lid"></b></p>
 <ul id="plist"></ul><p id="pst"></p>
 <div class="row"><button id="bp">対戦する</button><button id="bx" hidden>対戦をやめる</button></div>
 <div id="adm" hidden>壁の枚数 <select id="wn"></select>
  <label><input type="checkbox" id="sp"> 観覧者に壁を見せる</label>
  <button id="st">ゲームスタート</button></div>
 <p id="aset"></p>
 <div class="chat"><div class="msgs"></div><div class="cin"><input maxlength="60"><button>送信</button></div></div>
</section>
<section id="setup" hidden>
 <p id="sinfo"></p>
 <div id="sed"><div class="row"><button id="tS">S</button><button id="tG">G</button><button id="tW">壁</button></div>
 <svg id="sb" viewBox="0 0 354 354"></svg><button id="rd">準備完了</button></div>
</section>
<section id="game" hidden>
 <h3 id="t1"></h3><svg id="b1" viewBox="0 0 354 354"></svg>
  <div class="lgrow"><div id="lg"></div><button id="al">全ログ</button></div>
 <button id="back" hidden>ロビーに戻る</button>
 <h3 id="t2"></h3><svg id="b2" viewBox="0 0 354 354"></svg>
 <div class="chat"><div class="msgs"></div><div class="cin"><input maxlength="60"><button>送信</button></div></div>
</section>
 <button id="out">ルームを出る</button>
 <img id="stamp" src="stamp.png" hidden alt="">
<div id="ov" hidden></div><div id="tn" hidden></div><div id="fx" hidden></div>
<script>onerror=(m,s,l)=>alert(m+" L"+l);addEventListener("unhandledrejection",e=>alert(e.reason))</script>
<script type="module" src="main.js?v=6"></script>
</body></html>
