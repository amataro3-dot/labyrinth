<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><title>Labyrinth .VS｜Muddy's Games</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="style.css?v=17"></head><body>
<h1>Labyrinth .VS</h1>
<section id="title">
 <input id="nm" maxlength="10" placeholder="なまえ">
 <button id="mk">ルームを作成</button>
 <div class="row"><input id="rid" maxlength="4" inputmode="numeric" placeholder="ルームID(4桁)"><button id="jn">入室</button></div>
 <div class="row"><select id="lv"><option value="1">よわい</option><option value="2" selected>ふつう</option><option value="3">つよい</option></select><select id="cw"></select><button id="cp">コンピューター戦</button></div>
 <p style="font-size:13px"><a href="/">Muddy's Games トップ</a>・<a href="/privacy.html">プライバシーポリシー</a></p>
</section>
<section id="lobby" hidden>
 <p>ルームID：<b id="lid"></b></p>
 <ul id="plist"></ul><p id="pst"></p>
 <div class="row" id="sr"><button id="bp">対戦する</button><button id="bx" hidden>対戦をやめる</button></div>
 <div id="mul" hidden>
  <div class="row"><button id="mq">出題者になる</button><button id="mj">参加する</button><button id="mx" hidden>やめる</button></div>
  <p id="mls"></p>
 </div>
 <div id="dbl" hidden>
  <div class="row"><button id="d_a">A1</button><span id="n_a"></span></div>
  <div class="row"><button id="d_a2">A2</button><span id="n_a2"></span></div>
  <div class="row"><button id="d_b">B1</button><span id="n_b"></span></div>
  <div class="row"><button id="d_b2">B2</button><span id="n_b2"></span></div>
 </div>
 <div id="tlob" hidden>
  <p id="tpl"></p>
  <div id="tcfg" class="row" hidden><span>試合数</span><select id="tnn"></select></div>
  <div class="row"><button id="tobs">観戦にする</button><button id="tgo" hidden>大会を始める</button></div>
 </div>
 <div id="adm" hidden>大会 <select id="tt"><option value="">通常対戦</option><option value="tour">トーナメント</option><option value="ls">リーグ戦(シングル)</option><option value="ld">リーグ戦(ダブルス)</option><option value="off">公式戦</option></select><br>壁の枚数 <select id="wn"></select>
  <label><input type="checkbox" id="sp"> 観戦者に壁を見せる</label>
  <label><input type="checkbox" id="cb"> コインバトル</label>
  <label><input type="checkbox" id="bw"> ボーナスウォール</label>
  <div class="row" id="md"><button id="m1" class="on">シングル</button><button id="m2">ダブルス</button><button id="m3">マルチ</button></div>
  <span id="tw" hidden>周の上限 <select id="tl"></select></span>
  <button id="st">ゲームスタート</button></div>
 <p id="aset"></p>
 <div class="chat"><div class="msgs"></div><div class="cin"><input maxlength="60"><button>送信</button></div></div>
</section>
<section id="setup" hidden>
 <p id="sinfo"></p>
 <div id="sed"><div class="row"><button id="tS">S</button><button id="tG">G</button><button id="tW">壁</button></div>
 <svg id="sb" viewBox="0 0 354 354"></svg><button id="rd">準備完了</button></div>
 <div id="ded" hidden>
  <svg id="db" viewBox="0 0 354 354"></svg>
  <div class="row"><button id="dok">決定</button><button id="drd" hidden>準備完了</button></div>
 </div>
 <div id="wt" hidden>
  <div id="stat"></div>
  <div id="vw" hidden>
   <div class="tabs"><button id="v0"></button><button id="v1"></button></div>
   <svg id="vb" viewBox="0 0 354 354"></svg>
   <p id="vc"></p>
  </div>
  <div id="bet" hidden><h3>どちらに賭けますか?</h3><p id="mc" class="bs"></p><div id="bo"></div><p class="bs" id="bhint"></p></div>
  <div id="rkw" hidden><h3>🪙 コインランキング</h3><table id="rk"></table></div>
 </div>
</section>
<section id="bonus" hidden>
 <div id="bsel" hidden>
  <p id="bmsg"></p>
  <h3 id="bt1"></h3><svg id="bb1" viewBox="0 0 354 354"></svg>
  <h3 id="bt2"></h3><svg id="bb2" viewBox="0 0 354 354"></svg>
 </div>
 <div id="bwait" hidden>
  <p id="bw1"></p>
  <div id="bpl" hidden><h3>🪙 コインランキング</h3><table id="brk"></table><div id="bwho"></div></div>
 </div>
</section>
<section id="tour" hidden>
 <h3 id="tmsg2"></h3>
 <div id="tbrd"></div>
 <p id="twait"></p>
 <div id="tfmt" hidden><p>次の試合の形式を選んでください</p><div class="row"><button id="tf1">シングル</button><button id="tf2">ダブルス</button><button id="tf3">マルチ</button></div></div>
 <div class="row"><button id="tstart" hidden>開始</button><button id="tend" hidden>大会を終了(ロビーへ)</button></div>
</section>
<section id="game" hidden>
 <h3 id="t1"></h3><svg id="b1" viewBox="0 0 354 354"></svg>
 <p id="mst" hidden></p>
 <div class="lgrow"><div id="lg"></div><button id="al">全ログ</button></div>
 <p id="bs" class="bs" hidden></p>
 <button id="back" hidden>ロビーに戻る</button>
 <div id="tpick" hidden><p id="tmsg"></p><div class="row"><button id="tnx">次へ</button><button id="tw1"></button><button id="tw2"></button><button id="twr">ランダム</button></div></div>
 <h3 id="t2"></h3><svg id="b2" viewBox="0 0 354 354"></svg>
 <div class="chat"><div class="msgs"></div><div class="cin"><input maxlength="60"><button>送信</button></div></div>
</section>
<button id="out">ルームを出る</button>
<img id="stamp" src="stamp.png?v=2" hidden alt=""><img id="stamp2" src="stamp_ok.png?v=1" hidden alt="">
<div id="ov" hidden></div><div id="tn" hidden></div><div id="fx" hidden></div>
<button id="tb" hidden>大会表</button><div id="tp" hidden><div id="tpc"></div><button id="tpx">閉じる</button></div>
<script>onerror=(m,s,l)=>alert(m+" L"+l);addEventListener("unhandledrejection",e=>alert(e.reason))</script>
<script type="module" src="main.js?v=17"></script>
</body></html>
