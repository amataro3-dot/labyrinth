<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crack a Grid & Design a Grid</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #e0e0e0;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .game-wrapper {
            max-width: 650px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .panel {
            background: #1e1e1e;
            border: 1px solid #333;
            border-radius: 8px;
            padding: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .panel-title {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #4da6ff;
            letter-spacing: 0.05em;
        }
        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 4px;
            background: #2a2a2a;
            padding: 6px;
            border-radius: 6px;
        }
        .cell {
            background: #252525;
            aspect-ratio: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            font-weight: bold;
            color: #888;
            border-radius: 4px;
            user-select: none;
            transition: background 0.15s;
        }
        .cell.wall {
            background: #444;
            color: #555;
        }
        .cell.player-p1 {
            background: #1b4d3e;
            color: #66ffcc;
            border: 1px solid #2ecc71;
        }
        .cell.player-p2 {
            background: #4d1b1b;
            color: #ff6666;
            border: 1px solid #e74c3c;
        }
        .controls-area {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }
        button {
            padding: 12px;
            background: #2c2c2c;
            color: #fff;
            border: 1px solid #444;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
        }
        button:hover {
            background: #3c3c3c;
        }
        .log-box {
            background: #0a0a0a;
            border: 1px solid #222;
            border-radius: 6px;
            padding: 12px;
            height: 140px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            color: #00ff66;
            line-height: 1.4;
        }
    </style>
</head>
<body>
    <div class="game-wrapper">
        <!-- Crack a Grid -->
        <div class="panel">
            <div class="panel-title">Crack a Grid</div>
            <div class="grid-container" id="grid-crack">
                <!-- JSでセル生成 -->
            </div>
        </div>

        <!-- Design a Grid -->
        <div class="panel">
            <div class="panel-title">Design a Grid</div>
            <div class="grid-container" id="grid-design">
                <!-- JSでセル生成 -->
            </div>
        </div>

        <!-- 操作パネル -->
        <div class="panel">
            <div class="panel-title">Controls</div>
            <div class="controls-area">
                <button id="btn-up">UP</button>
                <button id="btn-down">DOWN</button>
                <button id="btn-left">LEFT</button>
                <button id="btn-right">RIGHT</button>
            </div>
        </div>

        <!-- アクションログ -->
        <div class="panel">
            <div class="panel-title">Action Log</div>
            <div class="log-box" id="log-box"></div>
        </div>
    </div>
    <script>
        const COLS = 6;
        const ROWS = 2;
        const rowNames = ['A', 'B'];

        // ゲーム状態の管理
        let gameState = {
            crack: {
                pos: { r: 0, c: 0 },
                walls: [{ r: 0, c: 2 }, { r: 1, c: 3 }]
            },
            design: {
                pos: { r: 1, c: 5 },
                walls: [{ r: 0, c: 3 }, { r: 1, c: 1 }]
            },
            logs: []
        };

        function addLog(text) {
            gameState.logs.push(text);
            const box = document.getElementById('log-box');
            box.innerHTML = gameState.logs.map(l => `<div>${l}</div>`).join('');
            box.scrollTop = box.scrollHeight;
        }

        function coordToString(r, c) {
            return `${rowNames[r]}${c + 1}`;
        }

        function isWall(boardType, r, c) {
            return gameState[boardType].walls.some(w => w.r === r && w.c === c);
        }

        function renderBoards() {
            // Crack a Grid 描画
            const crackGrid = document.getElementById('grid-crack');
            crackGrid.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const coord = coordToString(r, c);

                    if (gameState.crack.pos.r === r && gameState.crack.pos.c === c) {
                        cell.classList.add('player-p1');
                        cell.textContent = 'P1';
                    } else if (isWall('crack', r, c)) {
                        cell.classList.add('wall');
                        cell.textContent = coord;
                    } else {
                        cell.textContent = coord;
                    }
                    crackGrid.appendChild(cell);
                }
            }

            // Design a Grid 描画
            const designGrid = document.getElementById('grid-design');
            designGrid.innerHTML = '';
            for (let r = 0; r < ROWS; r++) {
                for (let c = 0; c < COLS; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    const coord = coordToString(r, c);

                    if (gameState.design.pos.r === r && gameState.design.pos.c === c) {
                        cell.classList.add('player-p2');
                        cell.textContent = 'CPU';
                    } else if (isWall('design', r, c)) {
                        cell.classList.add('wall');
                        cell.textContent = coord;
                    } else {
                        cell.textContent = coord;
                    }
                    designGrid.appendChild(cell);
                }
            }
        }
        function handlePlayerMove(dr, dc) {
            const curR = gameState.crack.pos.r;
            const curC = gameState.crack.pos.c;
            const nextR = curR + dr;
            const nextC = curC + dc;

            const fromStr = coordToString(curR, curC);

            // グリッド範囲外チェック
            if (nextR < 0 || nextR >= ROWS || nextC < 0 || nextC >= COLS) {
                const toStr = `${rowNames[curR]}${nextC < 0 ? 0 : nextC + 1}`;
                addLog(`${fromStr} to ${toStr}: MISS`);
                return;
            }

            const toStr = coordToString(nextR, nextC);

            // 壁チェック
            if (isWall('crack', nextR, nextC)) {
                addLog(`${fromStr} to ${toStr}: MISS`);
                return;
            }

            // 移動成功
            gameState.crack.pos.r = nextR;
            gameState.crack.pos.c = nextC;
            addLog(`${fromStr} to ${toStr}: OK`);

            renderBoards();
            triggerCpuTurn();
        }

        function triggerCpuTurn() {
            const curR = gameState.design.pos.r;
            const curC = gameState.design.pos.c;
            const fromStr = coordToString(curR, curC);

            // CPUのランダム移動方向決定
            const dirs = [{r: 0, c: 1}, {r: 0, c: -1}, {r: 1, c: 0}, {r: -1, c: 0}];
            const dir = dirs[Math.floor(Math.random() * dirs.length)];
            const nextR = curR + dir.r;
            const nextC = curC + dir.c;

            if (nextR >= 0 && nextR < ROWS && nextC >= 0 && nextC < COLS && !isWall('design', nextR, nextC)) {
                const toStr = coordToString(nextR, nextC);
                gameState.design.pos.r = nextR;
                gameState.design.pos.c = nextC;
                addLog(`CPU ${fromStr} to ${toStr}: OK`);
            } else {
                const toStr = `${rowNames[Math.max(0, Math.min(ROWS-1, nextR))]}${Math.max(1, Math.min(COLS, nextC + 1))}`;
                addLog(`CPU ${fromStr} to ${toStr}: MISS`);
            }
            renderBoards();
        }

        // イベント登録
        document.getElementById('btn-up').addEventListener('click', () => handlePlayerMove(-1, 0));
        document.getElementById('btn-down').addEventListener('click', () => handlePlayerMove(1, 0));
        document.getElementById('btn-left').addEventListener('click', () => handlePlayerMove(0, -1));
        document.getElementById('btn-right').addEventListener('click', () => handlePlayerMove(0, 1));

        // 初期化実行
        renderBoards();
        addLog("System Initialized: Crack a Grid & Design a Grid ready.");
    </script>
</body>
</html>
