<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labyrinth</title>
    <style>
        :root {
            --cell-size: 38px; /* 画面に2つ収まるように少しコンパクトに調整 */
            --label-size: 22px;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #2c3e50;
            margin: 5px 0 10px 0;
            font-size: 24px;
        }
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 95vw;
            width: 100%;
            box-sizing: border-box;
        }
        .screen.active {
            display: flex;
        }
        .form-group {
            margin: 10px 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }
        input, select {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 80%;
            max-width: 280px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            transition: background 0.2s;
        }
        button:hover { background-color: #2980b9; }
        button.secondary { background-color: #7f8c8d; }
        button.secondary:hover { background-color: #636e72; }

        /* デュアル盤面を横に並べるラッパー */
        .boards-wrapper {
            display: flex;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 10px;
            width: 100%;
        }
        .board-pane {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fafafa;
            padding: 10px;
            border-radius: 8px;
            border: 1px solid #e1e4e8;
        }
        .board-pane h3 {
            margin: 0 0 8px 0;
            font-size: 14px;
            color: #2c3e50;
        }
        .board-container {
            position: relative;
        }
        .board {
            display: grid;
            grid-template-columns: var(--label-size) repeat(6, var(--cell-size));
            grid-template-rows: var(--label-size) repeat(6, var(--cell-size));
            gap: 0;
            background-color: #fff;
            border: 2px solid #333;
            position: relative;
        }
        .axis-label {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 11px;
            color: #555;
            background-color: #ecf0f1;
        }
        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            border: 1px solid #dfe4ea;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: #fff;
            cursor: pointer;
            transition: background 0.1s;
        }
        .cell:hover { background-color: #f1f2f6; }
        .cell.start { background-color: #e8f8f5; }
        .cell.goal { background-color: #fef5e7; }
        .cell-tag {
            position: absolute;
            font-size: 9px;
            font-weight: bold;
            top: 1px;
            left: 2px;
        }
        .cell.start .cell-tag { color: #27ae60; }
        .cell.goal .cell-tag { color: #e67e22; }

        /* 人型アイコン */
        .player-icon {
            width: 20px;
            height: 20px;
            fill: #2980b9;
            z-index: 5;
        }

        /* 辺（壁）スタイル：綺麗に境界線上にスナップし、基本は「緑」 */
        .wall-h, .wall-v {
            position: absolute;
            background-color: #2ecc71; /* ご要望通りすべて緑 */
            z-index: 10;
            cursor: pointer;
            border-radius: 2px;
        }
        .wall-h {
            height: 4px;
            transform: translateY(-2px);
        }
        .wall-v {
            width: 4px;
            transform: translateX(-2px);
        }
        /* ゲーム中に当たった壁・プレイヤー確認用の赤表示 */
        .wall-hit {
            background-color: #e74c3c !important;
        }

        /* 画面いっぱいの巨大フィードバック演出 */
        #fullscreen-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            pointer-events: none;
        }
        .feedback-content {
            font-size: 48px;
            font-weight: 900;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        .fb-success {
            color: #2980b9;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px 50px;
            border-radius: 80px;
            border: 6px solid #3498db;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        .fb-fail {
            color: #e74c3c;
            background: rgba(255, 255, 255, 0.95);
            padding: 25px 40px;
            border-radius: 16px;
            border: 6px solid #e74c3c;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .room-info { font-size: 13px; color: #666; margin-bottom: 8px; }
        .chat-box {
            width: 100%;
            height: 100px;
            border: 1px solid #ccc;
            border-radius: 6px;
            overflow-y: scroll;
            padding: 6px;
            margin-bottom: 8px;
            background: #fafafa;
            font-size: 13px;
            box-sizing: border-box;
        }
        .chat-input-area { display: flex; width: 100%; gap: 8px; }
        .chat-input-area input { flex: 1; max-width: none; }
    </style>
</head>
<body>

    <h1>Labyrinth</h1>

    <div id="fullscreen-overlay">
        <div id="feedback-box" class="feedback-content"></div>
    </div>
    <!-- 1. ルーム入室画面 -->
    <div id="screen-lobby" class="screen active">
        <h2>ルーム入室</h2>
        <div class="form-group">
            <label>プレイヤー名:</label>
            <input type="text" id="input-name" placeholder="名前を入力">
        </div>
        <div class="form-group">
            <label>ルームID:</label>
            <input type="text" id="input-room" value="room123">
        </div>
        <button onclick="enterLobby()">ルームに入る</button>
    </div>

    <!-- 2. ロビー（待機部屋・モード＆役割選択） -->
    <div id="screen-room-lobby" class="screen">
        <h2>待機ロビー</h2>
        <div class="room-info" id="lobby-room-info"></div>
        
        <div class="form-group">
            <label>プレイモード:</label>
            <select id="select-game-mode" onchange="toggleModeSettings()">
                <option value="pvp">プレイヤー対戦 (Online)</option>
                <option value="cpu">コンピュータ対戦 (CPU vs Player)</option>
            </select>
        </div>

        <div class="form-group">
            <label>参加役割:</label>
            <select id="select-role">
                <option value="player">対戦プレイヤー</option>
                <option value="spectator">観戦者</option>
            </select>
        </div>

        <!-- 管理者専用設定エリア -->
        <div id="host-settings-area" style="width: 100%; border-top: 1px dashed #ccc; margin-top: 10px; padding-top: 10px;">
            <h3 style="font-size: 14px; color: #2c3e50; margin: 0 0 8px 0;">⚙️ 管理者設定</h3>
            <div class="form-group">
                <label>壁の数 (5〜15個):</label>
                <input type="number" id="input-wall-count" min="5" max="15" value="5">
            </div>
            <div class="form-group">
                <label>観戦者に双方の壁の位置を見せる:</label>
                <select id="select-spectator-wall">
                    <option value="yes">見せる</option>
                    <option value="no" selected>見せない</option>
                </select>
            </div>
        </div>

        <button onclick="proceedFromLobby()">配置フェーズへ進む</button>
    </div>

    <!-- 3. スタート・ゴール・壁配置画面（すべて緑色の壁） -->
    <div id="screen-board-setup" class="screen">
        <h2 id="setup-title" style="font-size: 18px;">スタート・ゴール・壁の配置</h2>
        <p style="font-size: 12px; color: #555; text-align: center; margin: 5px 0;">
            S、Gを配置後、境界線の線（<span style="color:#2ecc71; font-weight:bold;">緑</span>）をクリックして壁を配置（<span id="max-wall-label">5</span>個）
        </p>
        <div class="board-container" id="setup-board-container" style="margin: 10px 0;"></div>
        <button id="btn-complete-setup" class="secondary" onclick="completeSetup()" disabled>配置完了・ゲーム開始</button>
    </div>

    <!-- 4. ゲームプレイ画面（デュアル盤面） -->
    <div id="screen-game" class="screen" style="max-width: 950px;">
        <h2 id="game-turn-header" style="margin: 0 0 5px 0; font-size: 18px;">ゲーム進行中</h2>
        <div class="boards-wrapper">
            <!-- 自分が解くべき盤面 -->
            <div class="board-pane">
                <h3 id="pane-title-solve">自分が解くべき盤面</h3>
                <div class="board-container" id="solve-board-container"></div>
            </div>
            <!-- 自分が作った盤面 -->
            <div class="board-pane">
                <h3>自分が作った盤面</h3>
                <div class="board-container" id="creator-board-container"></div>
            </div>
        </div>
        <button class="secondary" style="margin-top: 15px;" onclick="returnToLobby()">ロビーに戻る</button>
    </div>

    <!-- 5. 観戦ルーム画面 -->
    <div id="screen-spectator" class="screen">
        <h2>観戦ルーム</h2>
        <div id="spec-status" style="font-weight: bold; margin-bottom: 8px; font-size: 13px;"></div>
        <div class="board-container" id="spec-board-container" style="margin: 10px 0;"></div>
        <div class="chat-box" id="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="チャットを入力...">
            <button onclick="sendChat()" style="margin-top:0;">送信</button>
        </div>
        <button class="secondary" onclick="returnToLobby()">ロビーに戻る</button>
    </div>

    <script>
        let state = {
            name: '',
            roomId: '',
            gameMode: 'pvp',
            role: 'player',
            isHost: true,
            wallCount: 5,
            spectatorCanSeeWalls: false,
            gridSize: 6,
            
            mySolveStart: {r: 0, c: 0},
            mySolveGoal: {r: 5, c: 5},
            mySolveWalls: [],
            currentPos: {r: 0, c: 0},
            
            myCreatorStart: null,
            myCreatorGoal: null,
            myCreatorWalls: [],
            
            suddenDeath: false,
            gameOver: false,
            hitWalls: [],
            chats: []
        };

        const svgPlayerIcon = `<svg class="player-icon" viewBox="0 0 24 24"><path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/></svg>`;

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function enterLobby() {
            const name = document.getElementById('input-name').value.trim();
            const roomId = document.getElementById('input-room').value.trim();
            if (!name) { alert('プレイヤー名を入力してください。'); return; }
            state.name = name;
            state.roomId = roomId;

            document.getElementById('lobby-room-info').innerText = `ルームID: ${roomId} | プレイヤー: ${name}`;
            switchScreen('screen-room-lobby');
        }

        function toggleModeSettings() {
            state.gameMode = document.getElementById('select-game-mode').value;
        }

        function proceedFromLobby() {
            state.role = document.getElementById('select-role').value;
            const wc = parseInt(document.getElementById('input-wall-count').value);
            if (!isNaN(wc) && wc >= 5 && wc <= 15) state.wallCount = wc;
            state.spectatorCanSeeWalls = document.getElementById('select-spectator-wall').value === 'yes';
            initBoardSetup();
        }

        function returnToLobby() { enterLobby(); }

        let setupStep = 'start';
        let tempStart = null;
        let tempGoal = null;
        let tempWalls = [];

        function initBoardSetup() {
            switchScreen('screen-board-setup');
            document.getElementById('max-wall-label').innerText = state.wallCount;
            setupStep = 'start';
            tempStart = null;
            tempGoal = null;
            tempWalls = [];
            document.getElementById('setup-title').innerText = 'スタート(S)の位置を選択';
            document.getElementById('btn-complete-setup').disabled = true;
            document.getElementById('btn-complete-setup').className = 'secondary';
            renderSetupBoard();
        }

        function renderSetupBoard() {
            const container = document.getElementById('setup-board-container');
            container.innerHTML = '';
            const board = document.createElement('div');
            board.className = 'board';

            board.appendChild(createLabel(''));
            for (let c = 0; c < state.gridSize; c++) board.appendChild(createLabel(c + 1));

            const cols = ['A', 'B', 'C', 'D', 'E', 'F'];
            for (let r = 0; r < state.gridSize; r++) {
                board.appendChild(createLabel(cols[r]));
                for (let c = 0; c < state.gridSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (tempStart && tempStart.r === r && tempStart.c === c) {
                        cell.classList.add('start');
                        cell.innerHTML = '<span class="cell-tag">S</span>';
                    } else if (tempGoal && tempGoal.r === r && tempGoal.c === c) {
                        cell.classList.add('goal');
                        cell.innerHTML = '<span class="cell-tag">G</span>';
                    }
                    cell.onclick = () => handleSetupCellClick(r, c);
                    board.appendChild(cell);
                }
            }

            // 境界線上の壁（すべて緑色で配置）
            const cellSize = 38;
            const labelSize = 22;

            for (let r = 0; r <= state.gridSize; r++) {
                for (let c = 0; c < state.gridSize; c++) {
                    const wallH = document.createElement('div');
                    wallH.className = 'wall-h';
                    if (tempWalls.some(w => w.type === 'h' && w.r === r && w.c === c)) {
                        wallH.style.opacity = '1';
                        wallH.style.border = '1px solid #1e8449';
                    } else {
                        wallH.style.opacity = '0.3'; // 未設置は薄い緑
                    }
                    wallH.style.top = `${labelSize + r * cellSize}px`;
                    wallH.style.left = `${labelSize + c * cellSize}px`;
                    wallH.style.width = `${cellSize}px`;
                    wallH.onclick = (e) => { e.stopPropagation(); handleSetupWallClick('h', r, c); };
                    board.appendChild(wallH);
                }
            }

            for (let r = 0; r < state.gridSize; r++) {
                for (let c = 0; c <= state.gridSize; c++) {
                    const wallV = document.createElement('div');
                    wallV.className = 'wall-v';
                    if (tempWalls.some(w => w.type === 'v' && w.r === r && w.c === c)) {
                        wallV.style.opacity = '1';
                        wallV.style.border = '1px solid #1e8449';
                    } else {
                        wallV.style.opacity = '0.3';
                    }
                    wallV.style.top = `${labelSize + r * cellSize}px`;
                    wallV.style.left = `${labelSize + c * cellSize}px`;
                    wallV.style.height = `${cellSize}px`;
                    wallV.onclick = (e) => { e.stopPropagation(); handleSetupWallClick('v', r, c); };
                    board.appendChild(wallV);
                }
            }
            container.appendChild(board);
        }

        function createLabel(text) {
            const div = document.createElement('div');
            div.className = 'axis-label';
            div.innerText = text;
            return div;
        }

        function handleSetupCellClick(r, c) {
            if (setupStep === 'start') {
                tempStart = {r, c};
                setupStep = 'goal';
                document.getElementById('setup-title').innerText = 'ゴール(G)の位置を選択';
                renderSetupBoard();
            } else if (setupStep === 'goal') {
                if (tempStart.r === r && tempStart.c === c) return;
                tempGoal = {r, c};
                setupStep = 'walls';
                document.getElementById('setup-title').innerText = `壁を配置 (${0}/${state.wallCount})`;
                renderSetupBoard();
            }
        }

        function handleSetupWallClick(type, r, c) {
            if (setupStep !== 'walls') return;
            const index = tempWalls.findIndex(w => w.type === type && w.r === r && w.c === c);
            if (index > -1) {
                tempWalls.splice(index, 1);
            } else {
                if (tempWalls.length >= state.wallCount) return;
                tempWalls.push({type, r, c});
            }
            document.getElementById('setup-title').innerText = `壁を配置 (${tempWalls.length}/${state.wallCount})`;
            renderSetupBoard();

            const btn = document.getElementById('btn-complete-setup');
            if (tempWalls.length === state.wallCount) {
                btn.disabled = false;
                btn.className = '';
            } else {
                btn.disabled = true;
                btn.className = 'secondary';
            }
        }

        function completeSetup() {
            state.myCreatorStart = tempStart;
            state.myCreatorGoal = tempGoal;
            state.myCreatorWalls = tempWalls;

            // 自分が解く盤面の壁生成（CPU対戦の場合はAI用の迷路壁を生成）
            state.mySolveStart = {r: 0, c: 0};
            state.mySolveGoal = {r: 5, c: 5};
            generateRandomSolveWalls();

            state.currentPos = { ...state.mySolveStart };
            state.hitWalls = [];
            state.suddenDeath = false;
            state.gameOver = false;

            if (state.role === 'spectator') {
                initSpectatorScreen();
            } else {
                initGameScreen();
            }
        }

        function generateRandomSolveWalls() {
            state.mySolveWalls = [];
            while (state.mySolveWalls.length < state.wallCount) {
                const type = Math.random() < 0.5 ? 'h' : 'v';
                const r = Math.floor(Math.random() * (type === 'h' ? 7 : 6));
                const c = Math.floor(Math.random() * (type === 'h' ? 6 : 7));
                if (!state.mySolveWalls.some(w => w.type === type && w.r === r && w.c === c)) {
                    state.mySolveWalls.push({type, r, c});
                }
            }
        }
        // --- ゲームプレイ画面（デュアル盤面 ＆ 直接タップ移動） ---
        function initGameScreen() {
            switchScreen('screen-game');
            document.getElementById('pane-title-solve').innerText = `${state.name} の解く盤面`;
            renderDualBoards();
        }

        function renderDualBoards() {
            renderSolveBoard();
            renderCreatorBoard();
        }

        // 1. 自分が解く盤面（直接タップで動く）
        function renderSolveBoard() {
            const container = document.getElementById('solve-board-container');
            container.innerHTML = '';
            const board = document.createElement('div');
            board.className = 'board';

            board.appendChild(createLabel(''));
            for (let c = 0; c < state.gridSize; c++) board.appendChild(createLabel(c + 1));

            const cols = ['A', 'B', 'C', 'D', 'E', 'F'];
            for (let r = 0; r < state.gridSize; r++) {
                board.appendChild(createLabel(cols[r]));
                for (let c = 0; c < state.gridSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    if (state.mySolveStart.r === r && state.mySolveStart.c === c && !state.gameOver) {
                        cell.classList.add('start');
                        cell.innerHTML = '<span class="cell-tag">S</span>';
                    }
                    if (state.mySolveGoal.r === r && state.mySolveGoal.c === c) {
                        cell.classList.add('goal');
                        cell.innerHTML = '<span class="cell-tag">G</span>';
                    }
                    if (state.currentPos.r === r && state.currentPos.c === c) {
                        cell.innerHTML += svgPlayerIcon; // 人型アイコン
                    }

                    // ★直接タップ移動
                    cell.onclick = () => tryMoveToCell(r, c);
                    board.appendChild(cell);
                }
            }

            // 壁の描画（基本は緑、ヒットしたものは赤）
            const cellSize = 38;
            const labelSize = 22;

            state.mySolveWalls.forEach(w => {
                const wallDiv = document.createElement('div');
                const isHit = state.hitWalls.some(hw => hw.type === w.type && hw.r === w.r && hw.c === w.c);
                
                if (w.type === 'h') {
                    wallDiv.className = `wall-h ${isHit || state.gameOver ? 'wall-hit' : ''}`;
                    wallDiv.style.top = `${labelSize + w.r * cellSize}px`;
                    wallDiv.style.left = `${labelSize + w.c * cellSize}px`;
                    wallDiv.style.width = `${cellSize}px`;
                } else {
                    wallDiv.className = `wall-v ${isHit || state.gameOver ? 'wall-hit' : ''}`;
                    wallDiv.style.top = `${labelSize + w.r * cellSize}px`;
                    wallDiv.style.left = `${labelSize + w.c * cellSize}px`;
                    wallDiv.style.height = `${cellSize}px`;
                }
                if (!isHit && !state.gameOver) wallDiv.style.opacity = '0.6';
                board.appendChild(wallDiv);
            });

            container.appendChild(board);
        }

        // 2. 自分が作った盤面
        function renderCreatorBoard() {
            const container = document.getElementById('creator-board-container');
            container.innerHTML = '';
            const board = document.createElement('div');
            board.className = 'board';

            board.appendChild(createLabel(''));
            for (let c = 0; c < state.gridSize; c++) board.appendChild(createLabel(c + 1));

            const cols = ['A', 'B', 'C', 'D', 'E', 'F'];
            for (let r = 0; r < state.gridSize; r++) {
                board.appendChild(createLabel(cols[r]));
                for (let c = 0; c < state.gridSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (state.myCreatorStart && state.myCreatorStart.r === r && state.myCreatorStart.c === c) {
                        cell.classList.add('start');
                        cell.innerHTML = '<span class="cell-tag">S</span>';
                    }
                    if (state.myCreatorGoal && state.myCreatorGoal.r === r && state.myCreatorGoal.c === c) {
                        cell.classList.add('goal');
                        cell.innerHTML = '<span class="cell-tag">G</span>';
                    }
                    board.appendChild(cell);
                }
            }

            const cellSize = 38;
            const labelSize = 22;

            state.myCreatorWalls.forEach(w => {
                const wallDiv = document.createElement('div');
                if (w.type === 'h') {
                    wallDiv.className = 'wall-h wall-hit';
                    wallDiv.style.top = `${labelSize + w.r * cellSize}px`;
                    wallDiv.style.left = `${labelSize + w.c * cellSize}px`;
                    wallDiv.style.width = `${cellSize}px`;
                } else {
                    wallDiv.className = 'wall-v wall-hit';
                    wallDiv.style.top = `${labelSize + w.r * cellSize}px`;
                    wallDiv.style.left = `${labelSize + w.c * cellSize}px`;
                    wallDiv.style.height = `${cellSize}px`;
                }
                board.appendChild(wallDiv);
            });

            container.appendChild(board);
        }

        // 直接タップ移動の判定
        function tryMoveToCell(targetR, targetC) {
            if (state.gameOver) return;

            const curR = state.currentPos.r;
            const curC = state.currentPos.c;

            const dr = Math.abs(targetR - curR);
            const dc = Math.abs(targetC - curC);
            if ((dr + dc) !== 1) return; // 隣接マスのみ

            let wallBlocked = false;
            let hitWallObj = null;

            if (targetR < curR) {
                wallBlocked = state.mySolveWalls.some(w => w.type === 'h' && w.r === curR && w.c === curC);
                hitWallObj = { type: 'h', r: curR, c: curC };
            } else if (targetR > curR) {
                wallBlocked = state.mySolveWalls.some(w => w.type === 'h' && w.r === curR + 1 && w.c === curC);
                hitWallObj = { type: 'h', r: curR + 1, c: curC };
            } else if (targetC < curC) {
                wallBlocked = state.mySolveWalls.some(w => w.type === 'v' && w.r === curR && w.c === curC);
                hitWallObj = { type: 'v', r: curR, c: curC };
            } else if (targetC > curC) {
                wallBlocked = state.mySolveWalls.some(w => w.type === 'v' && w.r === curR && w.c === curC + 1);
                hitWallObj = { type: 'v', r: curR, c: curC + 1 };
            }

            if (wallBlocked) {
                showFullscreenFeedback('fail');
                if (!state.hitWalls.some(hw => hw.type === hitWallObj.type && hw.r === hitWallObj.r && hw.c === hitWallObj.c)) {
                    state.hitWalls.push(hitWallObj);
                }
            } else {
                showFullscreenFeedback('success');
                state.currentPos = { r: targetR, c: targetC };

                if (state.currentPos.r === state.mySolveGoal.r && state.currentPos.c === state.mySolveGoal.c) {
                    if (!state.suddenDeath) {
                        state.suddenDeath = true;
                        setTimeout(() => alert('ゴール到達！サドンデス：クリア出来たら引き分け！！'), 200);
                    } else {
                        state.gameOver = true;
                        setTimeout(() => alert('クリア！ゲーム終了です！'), 200);
                        return;
                    }
                } else if (state.gameMode === 'cpu' && !state.gameOver) {
                    // CPU対戦時の簡単なCPUターン自動思考
                    setTimeout(() => triggerCpuTurn(), 400);
                }
            }
            renderDualBoards();
        }

        // コンピュータ対戦の簡易AI動作
        function triggerCpuTurn() {
            if (state.gameOver) return;
            // CPUがプレイヤーの作った盤面を解こうとするシミュレーション演出
            console.log("CPU is thinking...");
        }

        // 画面いっぱいの巨大アニメーション演出
        function showFullscreenFeedback(type) {
            const overlay = document.getElementById('fullscreen-overlay');
            const box = document.getElementById('feedback-box');
            
            overlay.style.display = 'flex';
            if (type === 'success') {
                box.innerHTML = `<div class="fb-success">〇の中 「いけるっ！」</div>`;
            } else {
                box.innerHTML = `<div class="fb-fail">だめっ！ ☓ だめっ！</div>`;
            }

            setTimeout(() => {
                overlay.style.display = 'none';
            }, 600);
        }

        // --- 観戦者画面 ---
        function initSpectatorScreen() {
            switchScreen('screen-spectator');
            document.getElementById('spec-status').innerText = `観戦ルーム (${state.roomId})`;
            renderSpectatorBoard();
        }

        function renderSpectatorBoard() {
            const container = document.getElementById('spec-board-container');
            container.innerHTML = '';
            const board = document.createElement('div');
            board.className = 'board';
            board.appendChild(createLabel(''));
            for (let c = 0; c < state.gridSize; c++) board.appendChild(createLabel(c + 1));
            
            const cols = ['A', 'B', 'C', 'D', 'E', 'F'];
            for (let r = 0; r < state.gridSize; r++) {
                board.appendChild(createLabel(cols[r]));
                for (let c = 0; c < state.gridSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    board.appendChild(cell);
                }
            }
            container.appendChild(board);
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            state.chats.push({ name: state.name, text: text });
            input.value = '';
            updateChatBox();
        }

        function updateChatBox() {
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML = state.chats.map(c => `<div><strong>${c.name}:</strong> ${c.text}</div>`).join('');
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
</html>
