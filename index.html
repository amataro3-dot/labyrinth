<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>迷路ゲーム - Firebase対応</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #2c3e50;
            color: #ecf0f1;
            text-align: center;
            margin: 0;
            padding: 20px;
        }
        h1 { margin-bottom: 10px; }
        .screen { display: none; }
        .screen.active { display: block; }
        button {
            padding: 12px 24px;
            font-size: 16px;
            background: #3498db;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            margin: 10px;
        }
        button:hover { background: #2980b9; }
        input {
            padding: 10px;
            font-size: 16px;
            border-radius: 4px;
            border: 1px solid #ccc;
            margin: 5px;
        }
        #labyrinthCanvas {
            background: #000;
            border: 4px solid #34495e;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            max-width: 100%;
            height: auto;
        }
    </style>

    <!-- Firebase v9 Compat SDK -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
</head>
<body>
    <!-- ロビー画面 -->
    <div id="lobbyScreen" class="screen active">
        <h1>迷路ゲーム ロビー</h1>
        <p>ルーム名を入力して参加または作成してください</p>
        <div>
            <input type="text" id="roomNameInput" placeholder="ルーム名を入力">
            <button onclick="enterLobby()">ルームに入る</button>
        </div>
    </div>

    <!-- ゲーム画面 -->
    <div id="gameScreen" class="screen">
        <h2 id="roomTitle">ルーム名</h2>
        <canvas id="labyrinthCanvas" width="400" height="400"></canvas>
        <div>
            <button onclick="leaveRoom()">ロビーに戻る</button>
        </div>
    </div>

    <script>
        // Firebase設定
        const firebaseConfig = {
            databaseURL: "https://labyrinth-game-bc5aa-default-rtdb.firebaseio.com"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // 画面切り替え用関数
        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(screen => {
                screen.classList.remove('active');
            });
            document.getElementById(screenId).classList.add('active');
        }

        // ロビーに入る処理
        function enterLobby() {
            const roomName = document.getElementById('roomNameInput').value.trim();
            if (!roomName) {
                alert('ルーム名を入力してください！');
                return;
            }
            
            // 画面をゲーム画面に切り替え
            document.getElementById('roomTitle').innerText = 'ルーム: ' + roomName;
            showScreen('gameScreen');
            
            // ゲーム開始の初期化処理をここに呼ぶ
            initGame();
        }

        function leaveRoom() {
            showScreen('lobbyScreen');
        }
        function initGame() {
            const canvas = document.getElementById('labyrinthCanvas');
            const ctx = canvas.getContext('2d');
            
            // 簡易的な迷路の描画テスト
            ctx.fillStyle = '#e74c3c';
            ctx.fillRect(50, 50, 30, 30); // プレイヤーのつもり
            
            ctx.fillStyle = '#2ecc71';
            ctx.fillRect(300, 300, 30, 30); // ゴールのつもり
        }
    </script>
</body>
</html>
