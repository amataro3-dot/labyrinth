<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labyrinth Online</title>
    <!-- Firebase SDK (Compat) -->
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
    <style>
        :root {
            --cell-size: 36px;
            --label-size: 20px;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #2c3e50;
            margin: 4px 0 8px 0;
            font-size: 22px;
        }
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 95vw;
            width: 100%;
            box-sizing: border-box;
        }
        .screen.active {
            display: flex;
        }
        .form-group {
            margin: 8px 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        label {
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 13px;
        }
        input, select {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 80%;
            max-width: 280px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 9px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        button:hover { background-color: #2980b9; }
        button.secondary { background-color: #7f8c8d; }
        button.secondary:hover { background-color: #636e72; }

        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        .boards-wrapper {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        .board-pane {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fafafa;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #e1e4e8;
        }
        .board-pane h3 {
            margin: 0 0 4px 0;
            font-size: 13px;
            color: #2c3e50;
        }
        .board-container {
            position: relative;
        }
        .board {
            display: grid;
            grid-template-columns: var(--label-size) repeat(6, var(--cell-size));
            grid-template-rows: var(--label-size) repeat(6, var(--cell-size));
            gap: 0;
            background-color: #fff;
            border: 2px solid #333;
            position: relative;
        }
        .axis-label {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 10px;
            color: #555;
            background-color: #ecf0f1;
        }
        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            border: 1px solid #dfe4ea;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: #fff;
            cursor: pointer;
            transition: background 0.1s;
        }
        .cell:hover { background-color: #f1f2f6; }
        .cell.start { background-color: #e8f8f5; }
        .cell.goal { background-color: #fef5e7; }
        
        .cell-tag-large {
            font-size: 16px;
            font-weight: 900;
            z-index: 2;
        }
        .cell.start .cell-tag-large { color: #27ae60; }
        .cell.goal .cell-tag-large { color: #e67e22; }

        .player-icon { width: 18px; height: 18px; fill: #2980b9; z-index: 5; }
        .opponent-icon { width: 18px; height: 18px; fill: #e74c3c; z-index: 5; }

        .wall-h, .wall-v {
            position: absolute;
            background-color: #2ecc71;
            z-index: 10;
            border-radius: 2px;
        }
        .wall-h { height: 4px; transform: translateY(-2px); }
        .wall-v { width: 4px; transform: translateX(-2px); }
        .wall-hit { background-color: #e74c3c !important; }
        #fullscreen-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            cursor: pointer;
        }
        .feedback-symbol {
            font-size: 120px; font-weight: 900; line-height: 1;
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            text-shadow: 0 8px 25px rgba(0,0,0,0.3); text-align: center; padding: 20px;
        }
        .fb-circle { color: #2980b9; }
        .fb-cross { color: #e74c3c; }
        .fb-sudden { color: #f1c40f; font-size: 50px; background: rgba(0,0,0,0.7); border-radius: 12px; pointer-events: none; }
        .fb-win { color: #2ecc71; font-size: 36px; background: rgba(0,0,0,0.85); border-radius: 12px; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1.4; }

        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .log-chat-wrapper {
            display: flex; width: 100%; max-width: 450px; gap: 6px; align-items: stretch; margin-top: 6px;
        }
        .log-box {
            flex: 1; height: 75px; background: #222; color: #00ff66;
            font-family: monospace; font-size: 11px; padding: 6px; border-radius: 6px;
            overflow-y: auto; box-sizing: border-box; white-space: pre-wrap;
        }
        .history-btn-container { display: flex; flex-direction: column; justify-content: center; }
        .history-btn-container button { height: 100%; margin-top: 0; padding: 0 10px; font-size: 12px; background-color: #6c5ce7; }
        .history-btn-container button:hover { background-color: #5b4bc4; }

        #history-modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); display: none; align-items: center; justify-content: center; z-index: 2000;
        }
        .modal-content {
            background: #fff; width: 90%; max-width: 400px; height: 70vh;
            border-radius: 8px; display: flex; flex-direction: column; padding: 12px; box-sizing: border-box;
        }
        .modal-header { font-weight: bold; font-size: 14px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .modal-body { flex: 1; background: #111; color: #00ff66; font-family: monospace; font-size: 12px; padding: 8px; overflow-y: auto; border-radius: 4px; white-space: pre-wrap; margin-bottom: 8px; }

        .chat-input-row { display: flex; gap: 6px; width: 100%; max-width: 450px; margin-top: 4px; }
        .chat-input-row input { flex: 1; max-width: none; padding: 6px; font-size: 12px; }
        .chat-input-row button { padding: 6px 12px; margin-top: 0; font-size: 12px; }
        .room-info { font-size: 12px; color: #666; margin-bottom: 6px; }
        .participant-list { font-size: 12px; background: #f8f9fa; padding: 8px; border-radius: 6px; width: 100%; max-width: 280px; margin: 6px 0; box-sizing: border-box; text-align: left; }
    </style>
</head>
<body>
    <h1>Labyrinth</h1>
    <div id="fullscreen-overlay" onclick="handleOverlayClick()"><div id="feedback-symbol-box" class="feedback-symbol"></div></div>
    <div id="history-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>📜 全行動・チャット履歴</span>
                <button class="secondary" style="margin-top:0; padding:2px 8px; font-size:11px;" onclick="closeHistoryModal()">閉じる</button>
            </div>
            <div class="modal-body" id="modal-history-box"></div>
        </div>
    </div>

    <!-- 1. ルーム入室画面 -->
    <div id="screen-lobby" class="screen active">
        <h2>ルーム入室 (最大8人)</h2>
        <div class="form-group"><label>プレイヤー名:</label><input type="text" id="input-name" placeholder="名前を入力"></div>
        <div class="form-group"><label>ルームID (合言葉):</label><input type="text" id="input-room" value="room123"></div>
        <button onclick="enterLobby()">ルームに入る</button>
    </div>

    <!-- 2. 待機ロビー -->
    <div id="screen-room-lobby" class="screen">
        <h2>待機ロビー</h2>
        <div class="room-info" id="lobby-room-info"></div>
        <div class="participant-list" id="participant-list-box">参加者一覧: 読み込み中...</div>

        <div class="form-group"><label>希望する役割:</label>
            <select id="select-role">
                <option value="player">対戦プレイヤー (P1/P2)</option>
                <option value="spectator">観戦者</option>
            </select>
        </div>

        <div id="host-settings-area" style="width: 100%; border-top: 1px dashed #ccc; margin-top: 8px; padding-top: 8px;">
            <h3 style="font-size: 13px; color: #2c3e50; margin: 0 0 6px 0;">⚙️ ホスト設定 (P1のみ有効)</h3>
            <div class="form-group"><label>壁の数 (5〜15個):</label><input type="number" id="input-wall-count" min="5" max="15" value="5"></div>
        </div>

        <button onclick="proceedFromLobby()">配置フェーズへ進む</button>
    </div>

    <!-- 3. スタート・ゴール・壁配置画面 -->
    <div id="screen-board-setup" class="screen">
        <h2 id="setup-title" style="font-size: 16px;">スタート・ゴール・壁の配置</h2>
        <p style="font-size: 11px; color: #555; text-align: center; margin: 4px 0;">
            S、Gを配置後、境界線の線（<span style="color:#2ecc71; font-weight:bold;">緑</span>）をクリックして壁を配置（<span id="max-wall-label">5</span>個）
        </p>
        <div class="board-container" id="setup-board-container" style="margin: 6px 0;"></div>
        <button id="btn-complete-setup" class="secondary" onclick="completeSetup()" disabled>配置完了・ゲーム開始待ち</button>
    </div>

    <!-- 4. ゲームプレイ画面 -->
    <div id="screen-game" class="screen" style="max-width: 900px;">
        <h2 id="game-turn-header" style="margin: 0 0 4px 0; font-size: 16px;">ゲーム進行中</h2>
        <div class="game-layout">
            <div class="boards-wrapper">
                <div class="board-pane">
                    <h3 id="pane-title-solve">Crack a Grid</h3>
                    <div class="board-container" id="solve-board-container"></div>
                </div>
                <div class="board-pane">
                    <h3>Design a Grid</h3>
                    <div class="board-container" id="creator-board-container"></div>
                </div>
            </div>
            <div class="log-chat-wrapper">
                <div class="log-box" id="game-log-box"></div>
                <div class="history-btn-container"><button onclick="openHistoryModal()">全履歴</button></div>
            </div>
            <div class="chat-input-row">
                <input type="text" id="game-chat-input" placeholder="チャットを入力...">
                <button onclick="sendChat()" style="margin-top:0;">送信</button>
            </div>
        </div>
        <button class="secondary" style="margin-top: 8px;" onclick="returnToLobby()">ロビーに戻る</button>
    </div>
    <script>
        // ==========================================
        // 1. Firebase 設定
        // ==========================================
        const firebaseConfig = {
            apiKey: "AIzaSyBxf-38qXL-cUFIdJFd_x0JCJyXlHOKZHE",
            authDomain: "labyrinth-game-bc5aa.firebaseapp.com",
            databaseURL: "https://labyrinth-game-bc5aa-default-rtdb.firebaseio.com",
            projectId: "labyrinth-game-bc5aa",
            storageBucket: "labyrinth-game-bc5aa.firebasestorage.app",
            messagingSenderId: "534431752677",
            appId: "1:534431752677:web:8e4a3264841f2d4fe50f0c",
            measurementId: "G-9RCH8Y8LKM"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const db = firebase.database();

        let myId = 'user_' + Math.random().toString(36).substring(2, 9);
        let roomRef = null;
        let gameStateRef = null;

        let state = {
            name: '', roomId: '', role: 'player', playerSlot: null,
            wallCount: 5, gridSize: 6,
            p1Name: '', p2Name: '',
            
            p1Start: {r: 0, c: 0}, p1Goal: {r: 5, c: 5}, p1Walls: [], p1Pos: {r: 0, c: 0},
            p2Start: {r: 0, c: 0}, p2Goal: {r: 5, c: 5}, p2Walls: [], p2Pos: {r: 0, c: 0},
            
            turn: 'p1',
            turnOrder: 'p1',
            suddenDeath: false,
            suddenDeathPlayer: null,
            gameOver: false,
            p1HitWalls: [], p2HitWalls: [],
            logs: [],
            participants: {},
            setupCompleted: { p1: false, p2: false }
        };

        const svgPlayerIcon = `<svg class="player-icon" viewBox="0 0 24 24"><path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/></svg>`;
        const svgOpponentIcon = `<svg class="opponent-icon" viewBox="0 0 24 24"><path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/></svg>`;

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function enterLobby() {
    try {
        // --- ① ここからボタンを押したときの処理です ---
        const nameInput = document.getElementById('player-name-input'); // ※お使いのIDに合わせてください
        const roomIdInput = document.getElementById('room-id-input'); // ※お使いのIDに合わせてください
        
        const name = nameInput ? nameInput.value.trim() : '';
        const roomId = roomIdInput ? roomIdInput.value.trim() : '';

        if (!name) {
            alert('プレイヤー名を入力してください');
            return;
        }
        if (!roomId) {
            alert('ルームIDを入力してください');
            return;
        }

        // 変数に保存
        state.name = name;
        state.roomId = roomId;

        // Firebaseへの接続テスト
        if (typeof db === 'undefined' || !db) {
            throw new Error('Firebaseのデータベース(db)が正しく初期化されていません！');
        }

        roomRef = db.ref('rooms/' + roomId);
        
        roomRef.once('value', snapshot => {
            const roomData = snapshot.val() || {};
            const participants = roomData.participants || {};
            const count = Object.keys(participants).length;

            if (count >= 8 && !participants[myId]) {
                alert('⚠️ このルームは満員です（最大8人）');
                return;
            }

            // ここから下は元の処理をそのまま続けます
            const reqRole = document.getElementById('select-role').value;
            let assignedSlot = 'spectator';
            let p1 = participants.p1;
            let p2 = participants.p2;

            if (reqRole === 'player') {
                if (!p1 || p1.id === myId) {
                    assignedSlot = 'p1';
                } else if (!p2 || p2.id === myId) {
                    assignedSlot = 'p2';
                } else {
                    alert('⚠️ 対戦プレイヤー枠（2人）はすでに埋まっています。観戦者として参加します。');
                    assignedSlot = 'spectator';
                }
            }
            
            // 成功したらログに出す
            console.log('部屋に入れました！ スロット:', assignedSlot);
        });

    } catch (error) {
        // ★万が一エラーが起きたら、スマホの画面にポップアップでエラー内容を出します
        alert('【エラー発生】: ' + error.message);
        console.error(error);
    }

        function listenRoomData() {
            gameStateRef = db.ref(`rooms/${state.roomId}`);
            gameStateRef.on('value', snapshot => {
                const data = snapshot.val();
                if (!data) return;

                state.participants = data.participants || {};
                updateParticipantList();

                if (data.gameStarted) {
                    state.wallCount = data.wallCount || 5;
                    state.p1Name = data.p1Info ? data.p1Info.name : 'P1';
                    state.p2Name = data.p2Info ? data.p2Info.name : 'P2';
                    state.p1Start = data.p1Start; state.p1Goal = data.p1Goal; state.p1Walls = data.p1Walls || []; state.p1Pos = data.p1Pos;
                    state.p2Start = data.p2Start; state.p2Goal = data.p2Goal; state.p2Walls = data.p2Walls || []; state.p2Pos = data.p2Pos;
                    state.turn = data.turn || 'p1';
                    state.turnOrder = data.turnOrder || 'p1';
                    state.suddenDeath = data.suddenDeath || false;
                    state.suddenDeathPlayer = data.suddenDeathPlayer || null;
                    state.gameOver = data.gameOver || false;
                    state.p1HitWalls = data.p1HitWalls || [];
                    state.p2HitWalls = data.p2HitWalls || [];
                    state.logs = data.logs || [];

                    if (document.getElementById('screen-game').classList.contains('active') === false && 
                        document.getElementById('screen-board-setup').classList.contains('active') === false) {
                        initGameScreen();
                    } else if (document.getElementById('screen-game').classList.contains('active')) {
                        updateGameUI();
                    }
                }
            });
        }

        function updateParticipantList() {
            const listEl = document.getElementById('participant-list-box');
            const parts = Object.values(state.participants);
            let html = `<b>参加者一覧 (${parts.length}/8人):</b><br>`;
            parts.forEach(p => {
                html += `- ${p.name} [${p.slot.toUpperCase()}]<br>`;
            });
            listEl.innerHTML = html;
        }

        function proceedFromLobby() {
            const wc = parseInt(document.getElementById('input-wall-count').value);
            if (state.playerSlot === 'p1' && !isNaN(wc)) {
                db.ref(`rooms/${state.roomId}/wallCount`).set(wc);
            }
            initBoardSetup();
        }
        let setupStep = 'start';
        let tempStart = null;
        let tempGoal = null;
        let tempWalls = [];

        function initBoardSetup() {
            switchScreen('screen-board-setup');
            document.getElementById('max-wall-label').innerText = state.wallCount;
            setupStep = 'start'; tempStart = null; tempGoal = null; tempWalls = [];
            document.getElementById('setup-title').innerText = 'スタート(S)の位置を選択';
            document.getElementById('btn-complete-setup').disabled = true;
            document.getElementById('btn-complete-setup').className = 'secondary';
            renderSetupBoard();
        }

        function checkSolvability(start, goal, walls, gridSize = 6) {
            if (!start || !goal) return false;
            const queue = [start];
            const visited = Array.from({ length: gridSize }, () => Array(gridSize).fill(false));
            visited[start.r][start.c] = true;

            while (queue.length > 0) {
                const curr = queue.shift();
                if (curr.r === goal.r && curr.c === goal.c) return true;
                const neighbors = [{r:curr.r-1,c:curr.c},{r:curr.r+1,c:curr.c},{r:curr.r,c:curr.c-1},{r:curr.r,c:curr.c+1}];
                for (let next of neighbors) {
                    if (next.r < 0 || next.r >= gridSize || next.c < 0 || next.c >= gridSize) continue;
                    if (visited[next.r][next.c]) continue;
                    let blocked = false;
                    if (next.r < curr.r) blocked = walls.some(w => w.type === 'h' && w.r === curr.r && w.c === curr.c);
                    else if (next.r > curr.r) blocked = walls.some(w => w.type === 'h' && w.r === curr.r + 1 && w.c === curr.c);
                    else if (next.c < curr.c) blocked = walls.some(w => w.type === 'v' && w.r === curr.r && w.c === curr.c);
                    else if (next.c > curr.c) blocked = walls.some(w => w.type === 'v' && w.r === curr.r && w.c === curr.c + 1);
                    if (!blocked) { visited[next.r][next.c] = true; queue.push(next); }
                }
            }
            return false;
        }

        function renderSetupBoard() {
            const container = document.getElementById('setup-board-container');
            container.innerHTML = '';
            const board = document.createElement('div');
            board.className = 'board';
            board.appendChild(createLabel(''));
            for (let c = 0; c < state.gridSize; c++) board.appendChild(createLabel(c + 1));
            const cols = ['A', 'B', 'C', 'D', 'E', 'F'];
            for (let r = 0; r < state.gridSize; r++) {
                board.appendChild(createLabel(cols[r]));
                for (let c = 0; c < state.gridSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (tempStart && tempStart.r === r && tempStart.c === c) { cell.classList.add('start'); cell.innerHTML = '<span class="cell-tag-large">S</span>'; }
                    else if (tempGoal && tempGoal.r === r && tempGoal.c === c) { cell.classList.add('goal'); cell.innerHTML = '<span class="cell-tag-large">G</span>'; }
                    cell.onclick = () => handleSetupCellClick(r, c);
                    board.appendChild(cell);
                }
            }
            const cellSize = 36; const labelSize = 20;
            for (let r = 0; r <= state.gridSize; r++) {
                for (let c = 0; c < state.gridSize; c++) {
                    const wallH = document.createElement('div');
                    wallH.className = 'wall-h';
                    wallH.style.opacity = tempWalls.some(w => w.type === 'h' && w.r === r && w.c === c) ? '1' : '0.3';
                    wallH.style.top = `${labelSize + r * cellSize}px`; wallH.style.left = `${labelSize + c * cellSize}px`; wallH.style.width = `${cellSize}px`;
                    wallH.onclick = (e) => { e.stopPropagation(); handleSetupWallClick('h', r, c); };
                    board.appendChild(wallH);
                }
            }
            for (let r = 0; r < state.gridSize; r++) {
                for (let c = 0; c <= state.gridSize; c++) {
                    const wallV = document.createElement('div');
                    wallV.className = 'wall-v';
                    wallV.style.opacity = tempWalls.some(w => w.type === 'v' && w.r === r && w.c === c) ? '1' : '0.3';
                    wallV.style.top = `${labelSize + r * cellSize}px`; wallV.style.left = `${labelSize + c * cellSize}px`; wallV.style.height = `${cellSize}px`;
                    wallV.onclick = (e) => { e.stopPropagation(); handleSetupWallClick('v', r, c); };
                    board.appendChild(wallV);
                }
            }
            container.appendChild(board);
        }

        function createLabel(text) {
            const div = document.createElement('div'); div.className = 'axis-label'; div.innerText = text; return div;
        }

        function handleSetupCellClick(r, c) {
            if (setupStep === 'start') {
                tempStart = {r, c}; setupStep = 'goal';
                document.getElementById('setup-title').innerText = 'ゴール(G)の位置を選択';
                renderSetupBoard();
            } else if (setupStep === 'goal') {
                if (tempStart.r === r && tempStart.c === c) return;
                tempGoal = {r, c}; setupStep = 'walls';
                document.getElementById('setup-title').innerText = `壁を配置 (${0}/${state.wallCount})`;
                renderSetupBoard();
            }
        }

        function handleSetupWallClick(type, r, c) {
            if (setupStep !== 'walls') return;
            const index = tempWalls.findIndex(w => w.type === type && w.r === r && w.c === c);
            if (index > -1) { tempWalls.splice(index, 1); }
            else {
                if (tempWalls.length >= state.wallCount) return;
                tempWalls.push({type, r, c});
            }
            document.getElementById('setup-title').innerText = `壁を配置 (${tempWalls.length}/${state.wallCount})`;
            renderSetupBoard();

            const btn = document.getElementById('btn-complete-setup');
            if (tempWalls.length === state.wallCount) {
                if (!checkSolvability(tempStart, tempGoal, tempWalls)) {
                    alert('⚠️ 注意: ゴールへ到達できません！壁を調整してください。');
                    btn.disabled = true; btn.className = 'secondary';
                } else {
                    btn.disabled = false; btn.className = '';
                }
            } else {
                btn.disabled = true; btn.className = 'secondary';
            }
        }

        function completeSetup() {
            if (state.playerSlot === 'p1') {
                db.ref(`rooms/${state.roomId}/p1Setup`).set({ start: tempStart, goal: tempGoal, walls: tempWalls });
                db.ref(`rooms/${state.roomId}/p1Pos`).set(tempStart);
            } else if (state.playerSlot === 'p2') {
                db.ref(`rooms/${state.roomId}/p2Setup`).set({ start: tempStart, goal: tempGoal, walls: tempWalls });
                db.ref(`rooms/${state.roomId}/p2Pos`).set(tempStart);
            }

            document.getElementById('btn-complete-setup').innerText = '相手の配置完了を待っています...';
            document.getElementById('btn-complete-setup').disabled = true;

            db.ref(`rooms/${state.roomId}`).once('value', snapshot => {
                const data = snapshot.val();
                const p1Setup = data.p1Setup;
                const p2Setup = data.p2Setup;

                if (p1Setup && p2Setup && !data.gameStarted) {
                    const firstTurn = Math.random() < 0.5 ? 'p1' : 'p2';
                    db.ref(`rooms/${state.roomId}`).update({
                        gameStarted: true,
                        turn: firstTurn,
                        turnOrder: firstTurn,
                        p1Start: p1Setup.start, p1Goal: p1Setup.goal, p1Walls: p1Setup.walls, p1Pos: p1Setup.start,
                        p2Start: p2Setup.start, p2Goal: p2Setup.goal, p2Walls: p2Setup.walls, p2Pos: p2Setup.start,
                        logs: [`[System] Game Started! First turn: ${firstTurn.toUpperCase()}`]
                    });
                }
            });
        }

        function initGameScreen() {
            switchScreen('screen-game');
            updateGameUI();
        }

        function updateGameUI() {
            const header = document.getElementById('game-turn-header');
            const isMyTurn = (state.playerSlot === state.turn);
            const currentTurnName = (state.turn === 'p1') ? state.p1Name : state.p2Name;
            const turnType = (state.turn === state.turnOrder) ? '先攻' : '后攻';

            if (state.gameOver) {
                header.innerText = 'ゲーム終了';
            } else {
                header.innerText = `${turnType}: ${currentTurnName}のターン`;
                header.style.color = isMyTurn ? '#27ae60' : '#e74c3c';
            }
            renderDualBoards();
            updateLogDisplay();
        }

        function renderDualBoards() {
            const isP1 = (state.playerSlot === 'p1');
            const mySolveWalls = isP1 ? state.p1Walls : state.p2Walls;
            const mySolveStart = isP1 ? state.p1Start : state.p2Start;
            const mySolveGoal = isP1 ? state.p1Goal : state.p2Goal;
            const myPos = isP1 ? state.p1Pos : state.p2Pos;

            const oppPos = isP1 ? state.p2Pos : state.p1Pos;
            const oppStart = isP1 ? state.p2Start : state.p1Start;
            const oppGoal = isP1 ? state.p2Goal : state.p1Goal;
            const oppWalls = isP1 ? state.p2Walls : state.p1Walls;

            renderBoard('solve-board-container', mySolveStart, mySolveGoal, mySolveWalls, myPos, (r, c) => {
                if (state.playerSlot === state.turn && !state.gameOver) tryMove(r, c);
            }, isP1 ? state.p1HitWalls : state.p2HitWalls);

            renderBoard('creator-board-container', oppStart, oppGoal, oppWalls, oppPos, null, []);
        }

        function renderBoard(containerId, start, goal, walls, playerPos, clickCallback, hitWalls) {
            const container = document.getElementById(containerId);
            container.innerHTML = '';
            const board = document.createElement('div');
            board.className = 'board';
            board.appendChild(createLabel(''));
            for (let c = 0; c < state.gridSize; c++) board.appendChild(createLabel(c + 1));

            const cols = ['A', 'B', 'C', 'D', 'E', 'F'];
            for (let r = 0; r < state.gridSize; r++) {
                board.appendChild(createLabel(cols[r]));
                for (let c = 0; c < state.gridSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (start && start.r === r && start.c === c && !state.gameOver) {
                        cell.classList.add('start'); cell.innerHTML = '<span class="cell-tag-large">S</span>';
                    }
                    if (goal && goal.r === r && goal.c === c) {
                        cell.classList.add('goal'); cell.innerHTML = '<span class="cell-tag-large">G</span>';
                    }
                    if (playerPos && playerPos.r === r && playerPos.c === c) {
                        cell.innerHTML += svgPlayerIcon;
                    }
                    if (clickCallback) cell.onclick = () => clickCallback(r, c);
                    board.appendChild(cell);
                }
            }

            const cellSize = 36; const labelSize = 20;
            walls.forEach(w => {
                const isHit = hitWalls.some(hw => hw.type === w.type && hw.r === w.r && hw.c === w.c);
                if (isHit || state.gameOver) {
                    const wallDiv = document.createElement('div');
                    wallDiv.className = `wall-${w.type} wall-hit`;
                    if (w.type === 'h') {
                        wallDiv.style.top = `${labelSize + w.r * cellSize}px`;
                        wallDiv.style.left = `${labelSize + w.c * cellSize}px`;
                        wallDiv.style.width = `${cellSize}px`;
                    } else {
                        wallDiv.style.top = `${labelSize + w.r * cellSize}px`;
                        wallDiv.style.left = `${labelSize + w.c * cellSize}px`;
                        wallDiv.style.height = `${cellSize}px`;
                    }
                    board.appendChild(wallDiv);
                }
            });
            container.appendChild(board);
        }

        function tryMove(targetR, targetC) {
            if (state.gameOver || state.playerSlot !== state.turn) return;
            const isP1 = (state.playerSlot === 'p1');
            const curPos = isP1 ? state.p1Pos : state.p2Pos;
            const walls = isP1 ? state.p1Walls : state.p2Walls;
            const goal = isP1 ? state.p1Goal : state.p2Goal;

            if ((Math.abs(targetR - curPos.r) + Math.abs(targetC - curPos.c)) !== 1) return;

            const cols = ['A', 'B', 'C', 'D', 'E', 'F'];
            const fromCoord = `${cols[curPos.r]}${curPos.c + 1}`;
            const targetCoord = `${cols[targetR]}${targetC + 1}`;

            let wallBlocked = false; let hitWallObj = null;
            if (targetR < curPos.r) { wallBlocked = walls.some(w => w.type === 'h' && w.r === curPos.r && w.c === curPos.c); hitWallObj = {type:'h', r:curPos.r, c:curPos.c}; }
            else if (targetR > curPos.r) { wallBlocked = walls.some(w => w.type === 'h' && w.r === curPos.r + 1 && w.c === curPos.c); hitWallObj = {type:'h', r:curPos.r+1, c:curPos.c}; }
            else if (targetC < curPos.c) { wallBlocked = walls.some(w => w.type === 'v' && w.r === curPos.r && w.c === curPos.c); hitWallObj = {type:'v', r:curPos.r, c:curPos.c}; }
            else if (targetC > curPos.c) { wallBlocked = walls.some(w => w.type === 'v' && w.r === curPos.r && w.c === curPos.c + 1); hitWallObj = {type:'v', r:curPos.r, c:curPos.c+1}; }

            let updates = {};
            let newLogs = [...state.logs];

            if (wallBlocked) {
                showFullscreenSymbol('cross');
                let hitList = isP1 ? [...state.p1HitWalls] : [...state.p2HitWalls];
                if (!hitList.some(hw => hw.type === hitWallObj.type && hw.r === hitWallObj.r && hw.c === hitWallObj.c)) {
                    hitList.push(hitWallObj);
                }
                if (isP1) updates.p1HitWalls = hitList; else updates.p2HitWalls = hitList;

                newLogs.push(`${fromCoord} to ${targetCoord}: MISS`);
                const nextTurn = isP1 ? 'p2' : 'p1';
                updates.turn = nextTurn;
            } else {
                showFullscreenSymbol('circle');
                const newPos = {r: targetR, c: targetC};
                if (isP1) updates.p1Pos = newPos; else updates.p2Pos = newPos;
                newLogs.push(`${fromCoord} to ${targetCoord}: OK`);

                if (newPos.r === goal.r && newPos.c === goal.c) {
                    updates.gameOver = true;
                    newLogs.push(`[System] ${state.name} reached the goal and WON!`);
                    showWinOverlay(`${state.name} の勝ち！`);
                }
            }

            updates.logs = newLogs;
            db.ref(`rooms/${state.roomId}`).update(updates);
        }

        function showFullscreenSymbol(type) {
            const overlay = document.getElementById('fullscreen-overlay');
            const box = document.getElementById('feedback-symbol-box');
            overlay.style.display = 'flex';
            box.className = `feedback-symbol ${type === 'circle' ? 'fb-circle' : 'fb-cross'}`;
            box.innerHTML = type === 'circle' ? '〇' : '☓';
            setTimeout(() => { overlay.style.display = 'none'; }, 550);
        }

        function showWinOverlay(winnerText) {
            const overlay = document.getElementById('fullscreen-overlay');
            const box = document.getElementById('feedback-symbol-box');
            overlay.style.display = 'flex';
            box.className = 'feedback-symbol fb-win';
            box.innerHTML = `${winnerText}<br><span style="font-size:16px; font-weight:normal; display:block; margin-top:10px;">タップして戻る</span>`;
        }

        function handleOverlayClick() {
            document.getElementById('fullscreen-overlay').style.display = 'none';
        }

        function updateLogDisplay() {
            const box = document.getElementById('game-log-box');
            if (box) { box.innerText = state.logs.slice(-5).join('\n'); box.scrollTop = box.scrollHeight; }
        }

        function sendChat() {
            const input = document.getElementById('game-chat-input');
            const text = input.value.trim();
            if (!text) return;
            const newLogs = [...state.logs, `[Chat] ${state.name}: ${text}`];
            db.ref(`rooms/${state.roomId}`).update({ logs: newLogs });
            input.value = '';
        }

        function openHistoryModal() {
            const modal = document.getElementById('history-modal');
            const historyBox = document.getElementById('modal-history-box');
            historyBox.innerText = state.logs.join('\n');
            modal.style.display = 'flex'; historyBox.scrollTop = historyBox.scrollHeight;
        }

        function closeHistoryModal() { document.getElementById('history-modal').style.display = 'none'; }
        function returnToLobby() { switchScreen('screen-lobby'); }
    </script>
</body>
</html>
