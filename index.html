<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>動作テスト</title>
    <style>
        body { font-family: sans-serif; text-align: center; margin-top: 50px; }
        button { padding: 15px 30px; font-size: 18px; background: #3498db; color: white; border: none; border-radius: 8px; cursor: pointer; }
    </style>
</head>
<body>
    <h1>ボタン動作テスト</h1>
    <p>下のボタンを押して、ポップアップが出るか確認してください。</p>
    <button onclick="testClick()">ルームに入る（テスト）</button>

    <script>
        function testClick() {
            alert('ボタンはちゃんと動いています！');
        }
    </script>
</body>
</html>
