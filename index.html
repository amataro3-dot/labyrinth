<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labyrinth</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f7f7f7;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin: 10px 0;
            font-size: 1.5rem;
        }
        .container {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }
        .instructions {
            color: #d32f2f;
            font-size: 0.85rem;
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .setting-group {
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 0.9rem;
            background: #f1f8e9;
            padding: 8px;
            border-radius: 5px;
        }
        .setting-group select {
            padding: 4px;
            font-size: 0.9rem;
        }
        .btn {
            background-color: #388e3c;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .btn:active {
            background-color: #2e7d32;
        }
        .section-title {
            text-align: center;
            color: #1976d2;
            font-weight: bold;
            margin: 15px 0 5px 0;
            font-size: 0.95rem;
        }
        .board-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }
        .cols-label {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            width: 240px;
            text-align: center;
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 2px;
        }
        .board-row-wrapper {
            display: flex;
            align-items: center;
        }
        .rows-label {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            height: 240px;
            font-size: 0.85rem;
            color: #555;
            width: 20px;
            text-align: center;
        }
        .grid-wrapper {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            width: 240px;
            height: 240px;
            border: 2px solid #333;
            background-color: #fff;
        }
        .cell {
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
            box-sizing: border-box;
            user-select: none;
            cursor: pointer;
        }
        .cell.goal {
            background-color: #ffe082;
            color: #f57f17;
        }
        .cell.start {
            background-color: #c8e6c9;
            color: #2e7d32;
        }
        .cell.wall {
            background-color: #555;
            color: white;
        }
        .log-box {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            height: 60px;
            overflow-y: auto;
            font-size: 0.85rem;
            color: #333;
            background: #fafafa;
        }
    </style>
</head>
<body>

    <h1>Labyrinth</h1>

    <div class="container">
        <div class="setting-group">
            <label for="wall-count-select">🧱 配置する壁の数:</label>
            <select id="wall-count-select">
                <option value="1">1個</option>
                <option value="2">2個</option>
                <option value="3" selected>3個</option>
                <option value="4">4個</option>
                <option value="5">5個</option>
            </select>
        </div>

        <div class="instructions" id="instructions-text">
            【初期設定】スタート(S)とゴール(G)をタップ指定してください
        </div>

        <button class="btn" id="action-btn">配置完了 (0/3)</button>

        <div class="section-title">【上】 相手の盤面（あなたが解く）</div>
        <div class="board-container">
            <div class="cols-label">
                <div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div>
            </div>
            <div class="board-row-wrapper">
                <div class="rows-label">
                    <div>A</div><div>B</div><div>C</div><div>D</div><div>E</div><div>F</div>
                </div>
                <div class="grid-wrapper" id="board-top"></div>
            </div>
        </div>

        <div class="section-title">【下】 自分の盤面（相手が解く）</div>
        <div class="board-container">
            <div class="cols-label">
                <div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div>
            </div>
            <div class="board-row-wrapper">
                <div class="rows-label">
                    <div>A</div><div>B</div><div>C</div><div>D</div><div>E</div><div>F</div>
                </div>
                <div class="grid-wrapper" id="board-bottom"></div>
            </div>
        </div>

        <div class="log-box" id="log">
            ゲームを開始しました。壁の数を選んでスタート・ゴールを配置してください。
        </div>
    </div>

    <script>
        const rows = ['A', 'B', 'C', 'D', 'E', 'F'];
        const cols = [1, 2, 3, 4, 5, 6];
        
        let maxWalls = 3;
        let gameState = 'SETUP_SG'; // SETUP_SG -> SETUP_WALLS -> PLAYING
        let startPos = null;
        let goalPos = null;
        let walls = [];

        const wallSelect = document.getElementById('wall-count-select');
        const actionBtn = document.getElementById('action-btn');
        const instructionsText = document.getElementById('instructions-text');
        const logBox = document.getElementById('log');

        wallSelect.addEventListener('change', (e) => {
            if (gameState === 'SETUP_SG' || gameState === 'SETUP_WALLS') {
                maxWalls = parseInt(e.target.value);
                updateUI();
            }
        });

        function log(message) {
            logBox.innerHTML += `<br>${message}`;
            logBox.scrollTop = logBox.scrollHeight;
        }

        function createBoards() {
            ['board-top', 'board-bottom'].forEach(id => {
                const board = document.getElementById(id);
                board.innerHTML = '';
                for (let r = 0; r < 6; r++) {
                    for (let c = 0; c < 6; c++) {
                        const cell = document.createElement('div');
                        cell.className = 'cell';
                        cell.dataset.r = r;
                        cell.dataset.c = c;
                        cell.addEventListener('click', () => handleCellClick(r, c));
                        board.appendChild(cell);
                    }
                }
            });
            renderBoards();
        }

        function renderBoards() {
            // ここでは簡易的に下ボードを操作対象として描画
            const bottomBoard = document.getElementById('board-bottom');
            Array.from(bottomBoard.children).forEach(cell => {
                const r = parseInt(cell.dataset.r);
                const c = parseInt(cell.dataset.c);
                
                cell.className = 'cell';
                cell.textContent = '';

                if (startPos && startPos.r === r && startPos.c === c) {
                    cell.classList.add('start');
                    cell.textContent = 'S';
                } else if (goalPos && goalPos.r === r && goalPos.c === c) {
                    cell.classList.add('goal');
                    cell.textContent = 'G';
                } else if (walls.some(w => w.r === r && w.c === c)) {
                    cell.classList.add('wall');
                    cell.textContent = '■';
                }
            });
        }

        function handleCellClick(r, c) {
            if (gameState === 'SETUP_SG') {
                if (!startPos) {
                    startPos = {r, c};
                    log(`スタート(S)を (${rows[r]}, ${cols[c]}) に設定しました。`);
                } else if (!goalPos) {
                    if (startPos.r === r && startPos.c === c) return;
                    goalPos = {r, c};
                    log(`ゴール(G)を (${rows[r]}, ${cols[c]}) に設定しました。`);
                    gameState = 'SETUP_WALLS';
                    instructionsText.innerHTML = `【壁配置】配置する壁を選んでください（最大${maxWalls}個）`;
                }
                renderBoards();
                updateUI();
            } else if (gameState === 'SETUP_WALLS') {
                if ((startPos && startPos.r === r && startPos.c === c) ||
                    (goalPos && goalPos.r === r && goalPos.c === c)) return;

                const existingIndex = walls.findIndex(w => w.r === r && w.c === c);
                if (existingIndex >= 0) {
                    walls.splice(existingIndex, 1);
                } else {
                    if (walls.length < maxWalls) {
                        walls.push({r, c});
                    } else {
                        log(`壁は最大${maxWalls}個までです。`);
                    }
                }
                renderBoards();
                updateUI();
            }
        }

        actionBtn.addEventListener('click', () => {
            if (gameState === 'SETUP_SG') {
                log('先にスタートとゴールをタップしてください。');
            } else if (gameState === 'SETUP_WALLS') {
                if (walls.length === 0) {
                    log('壁を1つ以上配置してください。');
                    return;
                }
                gameState = 'PLAYING';
                wallSelect.disabled = true;
                actionBtn.textContent = 'ゲーム進行中';
                actionBtn.style.backgroundColor = '#1976d2';
                instructionsText.innerHTML = '【対戦中】相手の迷路を解き進めてください！';
                log('初期配置が完了しました。ゲーム開始！');
            }
        });

        function updateUI() {
            if (gameState === 'SETUP_SG') {
                if (!startPos) {
                    actionBtn.textContent = 'スタートを配置してください';
                } else if (!goalPos) {
                    actionBtn.textContent = 'ゴールを配置してください';
                }
            } else if (gameState === 'SETUP_WALLS') {
                actionBtn.textContent = `配置完了 (${walls.length}/${maxWalls})`;
            }
        }

        createBoards();
    </script>
</body>
</html>
