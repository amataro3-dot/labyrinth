<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labyrinth</title>
    <style>
        body {
            font-family: sans-serif;
            margin: 0;
            padding: 10px;
            background-color: #f7f7f7;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            margin: 10px 0;
            font-size: 1.5rem;
        }
        .container {
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            max-width: 400px;
            width: 100%;
            box-sizing: border-box;
        }
        .instructions {
            color: #d32f2f;
            font-size: 0.9rem;
            text-align: center;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .btn {
            background-color: #388e3c;
            color: white;
            border: none;
            padding: 10px;
            width: 100%;
            border-radius: 5px;
            font-size: 1rem;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .section-title {
            text-align: center;
            color: #1976d2;
            font-weight: bold;
            margin: 15px 0 5px 0;
            font-size: 0.95rem;
        }
        .board-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 15px;
        }
        .cols-label {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            width: 240px;
            text-align: center;
            font-size: 0.85rem;
            color: #555;
            margin-bottom: 2px;
        }
        .board-row-wrapper {
            display: flex;
            align-items: center;
        }
        .rows-label {
            display: flex;
            flex-direction: column;
            justify-content: space-around;
            height: 240px;
            font-size: 0.85rem;
            color: #555;
            width: 20px;
            text-align: center;
        }
        .grid-wrapper {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            width: 240px;
            height: 240px;
            border: 2px solid #333;
            background-color: #fff;
        }
        .cell {
            border: 1px solid #ccc;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 1rem;
            box-sizing: border-box;
            user-select: none;
        }
        .cell.goal {
            background-color: #ffe082;
            color: #f57f17;
        }
        .cell.start {
            background-color: #c8e6c9;
            color: #2e7d32;
        }
        .log-box {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            height: 60px;
            overflow-y: auto;
            font-size: 0.85rem;
            color: #333;
            background: #fafafa;
        }
    </style>
</head>
<body>

    <h1>Labyrinth</h1>

    <div class="container">
        <div class="instructions">
            【初期設定】スタート(S)とゴール(G)をタップ指定してください<br>
            <span style="font-size: 0.8rem; font-weight: normal; color: #666;">
                ① スタート(S)とゴール(G)をタップ<br>
                ② 辺をタップして壁を配置（最大3個）
            </span>
        </div>

        <button class="btn" id="action-btn">配置完了 (0/3)</button>

        <div class="section-title">【上】 相手の盤面（あなたが解く）</div>
        <div class="board-container">
            <div class="cols-label">
                <div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div>
            </div>
            <div class="board-row-wrapper">
                <div class="rows-label">
                    <div>A</div><div>B</div><div>C</div><div>D</div><div>E</div><div>F</div>
                </div>
                <div class="grid-wrapper" id="board-top">
                    <!-- マス目動的生成 -->
                </div>
            </div>
        </div>

        <div class="section-title">【下】 自分の盤面（相手が解く）</div>
        <div class="board-container">
            <div class="cols-label">
                <div>1</div><div>2</div><div>3</div><div>4</div><div>5</div><div>6</div>
            </div>
            <div class="board-row-wrapper">
                <div class="rows-label">
                    <div>A</div><div>B</div><div>C</div><div>D</div><div>E</div><div>F</div>
                </div>
                <div class="grid-wrapper" id="board-bottom">
                    <!-- マス目動的生成 -->
                </div>
            </div>
        </div>

        <div class="log-box" id="log">
            CPU対戦を開始しました。
        </div>
    </div>

    <script>
        // サンプルとして6x6のセルを生成する簡易スクリプト
        function createGrid(elementId) {
            const grid = document.getElementById(elementId);
            for (let i = 0; i < 36; i++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                if (i === 0) {
                    cell.classList.add('goal');
                    cell.textContent = 'G';
                } else if (i === 35) {
                    cell.classList.add('start');
                    cell.textContent = 'S';
                }
                grid.appendChild(cell);
            }
        }
        createGrid('board-top');
        createGrid('board-bottom');
    </script>
</body>
</html>
