<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Labyrinth</title>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #111; color: #fff; display: flex; flex-direction: column;
      align-items: center; justify-content: center; min-height: 100vh; padding: 8px;
      user-select: none; -webkit-user-select: none;
    }
    .container { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 8px; }
    h1 { text-align: center; font-size: 1.2rem; color: #4dabf7; letter-spacing: 2px; }
    .card { background: #1e1e1e; border-radius: 12px; padding: 12px; border: 1px solid #333; }
    input, button {
      width: 100%; padding: 10px; border-radius: 8px; border: none; font-size: 0.9rem; margin-top: 6px;
    }
    input { background: #2a2a2a; color: #fff; border: 1px solid #444; }
    button { background: #228be6; color: white; font-weight: bold; cursor: pointer; }
    button:active { opacity: 0.8; }

    .board-container { display: flex; flex-direction: column; align-items: center; margin: 4px 0; }
    .board-label { font-size: 0.8rem; font-weight: bold; margin-bottom: 4px; color: #ffe066; }

    /* 将棋盤風：マス目を直に枠線でつなげた 6x6 盤面 */
    .grid-wrapper { display: grid; grid-template-columns: 20px repeat(6, 1fr); width: 100%; }
    .header-col { text-align: center; font-size: 0.75rem; color: #aaa; font-weight: bold; height: 20px; line-height: 20px; }
    .header-row { display: flex; align-items: center; justify-content: center; font-size: 0.75rem; color: #aaa; font-weight: bold; }

    .board {
      display: grid; grid-template-columns: repeat(6, 1fr);
      background: #2b2b2b; border: 2px solid #555; aspect-ratio: 1; width: 100%;
    }
    .cell {
      border: 1px solid #444; display: flex; align-items: center; justify-content: center;
      font-weight: bold; font-size: 0.85rem; cursor: pointer; position: relative; background: #222;
    }
    .cell.start { background: #1b4332 !important; color: #2ec4b6; }
    .cell.goal { background: #4a0e17 !important; color: #ff4d6d; }

    /* マスの「辺（境界線）」に付く壁の見た目 */
    .wall-top { border-top: 5px solid #40c057 !important; z-index: 2; }       /* 未検知の壁（緑） */
    .wall-bottom { border-bottom: 5px solid #40c057 !important; z-index: 2; }
    .wall-left { border-left: 5px solid #40c057 !important; z-index: 2; }
    .wall-right { border-right: 5px solid #40c057 !important; z-index: 2; }

    .wall-hit-top { border-top: 5px solid #fa5252 !important; z-index: 2; }   /* 衝突した壁（赤） */
    .wall-hit-bottom { border-bottom: 5px solid #fa5252 !important; z-index: 2; }
    .wall-hit-left { border-left: 5px solid #fa5252 !important; z-index: 2; }
    .wall-hit-right { border-right: 5px solid #fa5252 !important; z-index: 2; }

    .log-box {
      background: #000; height: 60px; border-radius: 6px; padding: 6px 10px;
      font-size: 0.75rem; overflow-y: auto; display: flex; flex-direction: column; justify-content: flex-end;
      border: 1px solid #333;
    }
    .log-line { margin: 1px 0; color: #ced4da; }
    .log-sys { color: #74c0fc; font-weight: bold; }

    /* 壁衝突時の「❌ だめ！」ポップアップ */
    #dame-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0,0,0,0.85); display: none; flex-direction: column;
      justify-content: center; align-items: center; z-index: 9999;
    }
    .dame-text {
      font-size: 4rem; font-weight: 900; color: #ff3b30; text-shadow: 0 0 20px #ff0000;
      animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    @keyframes popIn { 0% { transform: scale(0.2); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
    .hidden { display: none !important; }
  </style>
</head>
<body>

<div class="container">
  <h1>Labyrinth</h1>

  <!-- ロビー画面 -->
  <div id="screen-lobby" class="card">
    <label style="font-size:0.8rem; color:#aaa;">プレイヤー名</label>
    <input type="text" id="input-name" value="プレイヤー">
    
    <div style="margin-top: 10px;">
      <button id="btn-cpu">🤖 CPU対戦（1人プレイ）</button>
    </div>

    <hr style="margin: 12px 0; border: 0; border-top: 1px solid #333;">

    <div>
      <label style="font-size:0.8rem; color:#aaa;">オンライン対戦 (部屋ID)</label>
      <input type="text" id="input-room" placeholder="部屋IDを入力">
      <div style="display:flex; gap:6px; margin-top:6px;">
        <button id="btn-create" style="background:#12b886;">部屋を作る</button>
        <button id="btn-join" style="background:#ff922b;">部屋に入る</button>
      </div>
    </div>
  </div>

  <!-- ゲーム画面 -->
  <div id="screen-game" class="card hidden">
    <div id="status-bar" style="font-size:0.8rem; color:#4dabf7; text-align:center; font-weight:bold; margin-bottom:6px;"></div>

    <!-- セットアップモード説明 -->
    <div id="setup-controls" class="hidden" style="text-align:center; margin-bottom:6px;">
      <p style="font-size:0.75rem; color:#ccc;">① スタート(S)とゴール(G)を指定<br>② マスの端（辺）をタップして壁(緑)を配置</p>
      <button id="btn-finish-setup" style="margin-top:6px; background:#2b8a3e;">配置完了！</button>
    </div>

    <div class="board-container">
      <div class="board-label" id="title-opponent">相手の陣地</div>
      <div class="grid-wrapper">
        <div></div>
        <div class="header-col">1</div><div class="header-col">2</div><div class="header-col">3</div>
        <div class="header-col">4</div><div class="header-col">5</div><div class="header-col">6</div>
        <div class="header-row">A</div><div id="board-opp" class="board"></div>
      </div>
    </div>

    <div class="board-container" style="margin-top:8px;">
      <div class="board-label" id="title-self">自分の陣地</div>
      <div class="grid-wrapper">
        <div></div>
        <div class="header-col">1</div><div class="header-col">2</div><div class="header-col">3</div>
        <div class="header-col">4</div><div class="header-col">5</div><div class="header-col">6</div>
        <div class="header-row">A</div><div id="board-self" class="board"></div>
      </div>
    </div>

    <div style="margin-top:6px;">
      <div class="log-box" id="log-box"></div>
    </div>
  </div>
</div>

<!-- 衝突時オーバーレイ（❌ だめ！） -->
<div id="dame-overlay">
  <div class="dame-text">❌ だめ！</div>
</div>

<script>
  const ROWS = ['A','B','C','D','E','F'];
  let mode = 'cpu';
  let peer = null, conn = null;

  let startPos = { r: 5, c: 0 }; // F1
  let goalPos = { r: 0, c: 5 };  // A6
  let myEdgeWalls = [];          // {r1, c1, r2, c2, hit: false}
  let oppEdgeWalls = [];
  let myCurrentPos = null;
  let oppCurrentPos = null;

  let phase = 'lobby';
  let isMyTurn = false;
  let setupStep = 'start'; // 'start' -> 'goal' -> 'walls'

  const $ = id => document.getElementById(id);

  window.onload = () => {
    $('btn-cpu').onclick = () => startMode('cpu');$('btn-create').onclick = createRoom;
    $('btn-join').onclick = joinRoom;
    $('btn-finish-setup').onclick = finishSetup;
  };

  function showLog(msg, isSys = false) {
    const box = $('log-box');
    const div = document.createElement('div');
    div.className = 'log-line' + (isSys ? ' log-sys' : '');
    div.textContent = msg;
    box.appendChild(div);
    if (box.children.length > 5) box.removeChild(box.firstChild);
    box.scrollTop = box.scrollHeight;
  }

  function triggerDame() {
    const el = $('dame-overlay');
    el.style.display = 'flex';
    setTimeout(() => { el.style.display = 'none'; }, 1000);
  }

  function startMode(m) {
    mode = m;
    $('screen-lobby').classList.add('hidden');
    $('screen-game').classList.remove('hidden');$('setup-controls').classList.remove('hidden');
    phase = 'setup';
    setupStep = 'start';
    updateStatus("【初期設定】スタート(S)の位置をタップしてください");
    initGridUI();
  }

  function createRoom() {
    const roomId = $('input-room').value.trim();
    if (!roomId) return alert("部屋IDを入力してください");
    peer = new Peer(roomId);
    peer.on('open', id => {
      showLog(`部屋作成完了: ${id}`, true);
      startMode('online');
    });
    peer.on('connection', c => {
      conn = c;
      setupConnection();
    });
  }

  function joinRoom() {
    const roomId = $('input-room').value.trim();
    if (!roomId) return alert("部屋IDを入力してください");
    peer = new Peer();
    peer.on('open', () => {
      conn = peer.connect(roomId);
      setupConnection();
    });
  }

  function setupConnection() {
    conn.on('open', () => {
      showLog("対戦相手と接続しました！", true);
      startMode('online');
    });
    conn.on('data', data => handleNetData(data));
  }

  function updateStatus(text) {
    $('status-bar').textContent = text;
  }

  function initGridUI() {
    buildBoard($('board-self'), 'self');
    buildBoard($('board-opp'), 'opp');
  }

  function buildBoard(container, type) {
    container.innerHTML = '';
    for (let r = 0; r < 6; r++) {
      for (let c = 0; c < 6; c++) {
        const cell = document.createElement('div');
        cell.className = 'cell';
        cell.dataset.r = r; cell.dataset.c = c;
        cell.onclick = (e) => onCellClick(r, c, type, e);
        container.appendChild(cell);
      }
    }
    renderBoards();
  }

  function onCellClick(r, c, boardType, event) {
    if (phase === 'setup' && boardType === 'self') {
      if (setupStep === 'start') {
        startPos = { r, c };
        setupStep = 'goal';
        updateStatus("【初期設定】ゴール(G)の位置をタップしてください");
      } else if (setupStep === 'goal') {
        if (r === startPos.r && c === startPos.c) return;
        goalPos = { r, c };
        setupStep = 'walls';
        updateStatus("【初期設定】マスの境界線（辺）をタップして壁を配置してください");
      } else if (setupStep === 'walls') {
        // マスの境界線（上下左右の辺）タップ判定
        const rect = event.target.getBoundingClientRect();
        const x = event.clientX - rect.left;
        const y = event.clientY - rect.top;
        const w = rect.width; const h = rect.height;

        let r2 = r, c2 = c;
        if (y < h * 0.3 && r > 0) r2 = r - 1;
        else if (y > h * 0.7 && r < 5) r2 = r + 1;
        else if (x < w * 0.3 && c > 0) c2 = c - 1;
        else if (x > w * 0.7 && c < 5) c2 = c + 1;

        if (r !== r2 || c !== c2) toggleEdgeWall(r, c, r2, c2);
      }
      renderBoards();
    } else if (phase === 'playing' && boardType === 'opp' && isMyTurn) {
      const dr = Math.abs(r - myCurrentPos.r);
      const dc = Math.abs(c - myCurrentPos.c);
      if ((dr === 1 && dc === 0) || (dr === 0 && dc === 1)) {
        attemptMove(myCurrentPos, { r, c });
      }
    }
  }

  function toggleEdgeWall(r1, c1, r2, c2) {
    const idx = myEdgeWalls.findIndex(w => isSameEdge(w, r1, c1, r2, c2));
    if (idx >= 0) {
      myEdgeWalls.splice(idx, 1);
    } else {
      myEdgeWalls.push({ r1, c1, r2, c2, hit: false });
    }
  }

  function isSameEdge(w, r1, c1, r2, c2) {
    return (w.r1 === r1 && w.c1 === c1 && w.r2 === r2 && w.c2 === c2) ||
           (w.r1 === r2 && w.c1 === c2 && w.r2 === r1 && w.c2 === c1);
  }

  function finishSetup() {
    $('setup-controls').classList.add('hidden');
    myCurrentPos = { ...startPos };
    oppCurrentPos = { ...startPos };

    if (mode === 'cpu') {
      oppEdgeWalls = [];
      for (let i = 0; i < 10; i++) {
        let r1 = Math.floor(Math.random() * 6);
        let c1 = Math.floor(Math.random() * 6);
        let isVert = Math.random() > 0.5;
        let r2 = isVert ? r1 : Math.min(5, r1 + 1);
        let c2 = isVert ? Math.min(5, c1 + 1) : c1;
        if (r1 !== r2 || c1 !== c2) oppEdgeWalls.push({ r1, c1, r2, c2, hit: false });
      }
      phase = 'playing';
      isMyTurn = true;
      updateStatus("あなたのターン：ぶつかるまで進めます");
    } else {
      conn.send({ type: 'ready', start: startPos, goal: goalPos, walls: myEdgeWalls });
      updateStatus("相手の配置完了を待っています...");
    }
    renderBoards();
  }

  function attemptMove(from, to) {
    if (mode === 'cpu') {
      const wall = oppEdgeWalls.find(w => isSameEdge(w, from.r, from.c, to.r, to.c));
      if (wall) {
        wall.hit = true;
        triggerDame();
        showLog(`【壁衝突】${ROWS[to.r]}${to.c + 1} の手前で「❌ だめ！」`, true);
        endTurn();
      } else {
        myCurrentPos = { ...to };
        showLog(`移動: ${ROWS[to.r]}${to.c + 1}`);
        renderBoards();
        if (to.r === goalPos.r && to.c === goalPos.c) {
          phase = 'ended';
          updateStatus("🎉 あなたの勝利です！ゴール到達！");
          showLog("ゴール到達！あなたの勝ち！", true);
        }
      }
    } else {
      conn.send({ type: 'move', from, to });
    }
  }

  function endTurn() {
    isMyTurn = false;
    updateStatus("相手のターンです...");
    renderBoards();
    if (mode === 'cpu') setTimeout(cpuTurnStep, 1000);
  }

  function cpuTurnStep() {
    if (phase !== 'playing') return;
    let dirs = [{r:1,c:0},{r:-1,c:0},{r:0,c:1},{r:0,c:-1}];
    let valid = dirs.map(d => ({ r: oppCurrentPos.r + d.r, c: oppCurrentPos.c + d.c }))
                    .filter(p => p.r >= 0 && p.r < 6 && p.c >= 0 && p.c < 6);
    let target = valid[Math.floor(Math.random() * valid.length)];

    const hitWall = myEdgeWalls.find(w => isSameEdge(w, oppCurrentPos.r, oppCurrentPos.c, target.r, target.c));
    if (hitWall) {
      hitWall.hit = true;
      showLog(`CPUが ${ROWS[target.r]}${target.c + 1} の壁に衝突！`, true);
      isMyTurn = true;
      updateStatus("あなたのターン：ぶつかるまで進めます");
      renderBoards();
    } else {
      oppCurrentPos = target;
      showLog(`CPUが ${ROWS[target.r]}${target.c + 1} に移動`);
      renderBoards();
      if (oppCurrentPos.r === goalPos.r && oppCurrentPos.c === goalPos.c) {
        phase = 'ended';
        updateStatus("💀 CPUの勝利です...");
      } else {
        setTimeout(cpuTurnStep, 800);
      }
    }
  }

  function handleNetData(data) {
    if (data.type === 'ready') {
      oppEdgeWalls = data.walls;
      phase = 'playing';
      isMyTurn = true;
      updateStatus("あなたのターンです");
    } else if (data.type === 'move') {
      const wall = myEdgeWalls.find(w => isSameEdge(w, data.from.r, data.from.c, data.to.r, data.to.c));
      if (wall) {
        wall.hit = true;
        conn.send({ type: 'move_reply', hit: true, from: data.from, to: data.to });
        isMyTurn = true;
        updateStatus("あなたのターンです");
      } else {
        oppCurrentPos = data.to;
        conn.send({ type: 'move_reply', hit: false, from: data.from, to: data.to });
      }
      renderBoards();
    } else if (data.type === 'move_reply') {
      if (data.hit) {
        triggerDame();
        showLog(`【壁衝突】「❌ だめ！」`, true);
        endTurn();
      } else {
        myCurrentPos = data.to;
        renderBoards();
      }
    }
  }

  function renderBoards() {
    renderSingleBoard($('board-self'), 'self');
    renderSingleBoard($('board-opp'), 'opp');
  }

  function renderSingleBoard(boardEl, type) {
    const cells = boardEl.children;
    for (let c of cells) {
      const r = parseInt(c.dataset.r);
      const col = parseInt(c.dataset.c);
      c.className = 'cell';
      c.textContent = '';

      if (r === startPos.r && col === startPos.c) { c.classList.add('start'); c.textContent = 'S'; }
      if (r === goalPos.r && col === goalPos.c) { c.classList.add('goal'); c.textContent = 'G'; }

      if (type === 'self') {
        if (myCurrentPos && r === myCurrentPos.r && col === myCurrentPos.c) c.textContent = '👤';
        myEdgeWalls.forEach(w => {
          if (w.r1 === r && w.c1 === col) applyWallClass(c, w.r2, w.c2, r, col, w.hit);
          if (w.r2 === r && w.c2 === col) applyWallClass(c, w.r1, w.c1, r, col, w.hit);
        });
      } else {
        if (myCurrentPos && r === myCurrentPos.r && col === myCurrentPos.c) c.textContent = '👤';
        oppEdgeWalls.filter(w => w.hit).forEach(w => {
          if (w.r1 === r && w.c1 === col) applyWallClass(c, w.r2, w.c2, r, col, true);
          if (w.r2 === r && w.c2 === col) applyWallClass(c, w.r1, w.c1, r, col, true);
        });
      }
    }
  }

  function applyWallClass(cell, r2, c2, r1, c1, isHit) {
    const prefix = isHit ? 'wall-hit-' : 'wall-';
    if (r2 < r1) cell.classList.add(prefix + 'top');
    if (r2 > r1) cell.classList.add(prefix + 'bottom');
    if (c2 < c1) cell.classList.add(prefix + 'left');
    if (c2 > c1) cell.classList.add(prefix + 'right');
  }
</script>
</body>
</html>
