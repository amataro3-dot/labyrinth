<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labyrinth</title>
    <style>
        :root {
            --cell-size: 36px;
            --label-size: 20px;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #2c3e50;
            margin: 4px 0 8px 0;
            font-size: 22px;
        }
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 95vw;
            width: 100%;
            box-sizing: border-box;
        }
        .screen.active {
            display: flex;
        }
        .form-group {
            margin: 8px 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        label {
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 13px;
        }
        input, select {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 80%;
            max-width: 280px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 9px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        button:hover { background-color: #2980b9; }
        button.secondary { background-color: #7f8c8d; }
        button.secondary:hover { background-color: #636e72; }

        /* デュアル盤面をスマホでも縦に美しく、あるいは横に並べるラッパー */
        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        .boards-wrapper {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        .board-pane {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fafafa;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #e1e4e8;
        }
        .board-pane h3 {
            margin: 0 0 4px 0;
            font-size: 13px;
            color: #2c3e50;
        }
        .board-container {
            position: relative;
        }
        .board {
            display: grid;
            grid-template-columns: var(--label-size) repeat(6, var(--cell-size));
            grid-template-rows: var(--label-size) repeat(6, var(--cell-size));
            gap: 0;
            background-color: #fff;
            border: 2px solid #333;
            position: relative;
        }
        .axis-label {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 10px;
            color: #555;
            background-color: #ecf0f1;
        }
        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            border: 1px solid #dfe4ea;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: #fff;
            cursor: pointer;
            transition: background 0.1s;
        }
        .cell:hover { background-color: #f1f2f6; }
        .cell.start { background-color: #e8f8f5; }
        .cell.goal { background-color: #fef5e7; }
        
        /* マス目の中に大きくドーンと表示するSとG */
        .cell-tag-large {
            font-size: 16px;
            font-weight: 900;
            z-index: 2;
        }
        .cell.start .cell-tag-large { color: #27ae60; }
        .cell.goal .cell-tag-large { color: #e67e22; }

        /* 人型アイコン */
        .player-icon {
            width: 18px;
            height: 18px;
            fill: #2980b9;
            z-index: 5;
        }

        /* 辺（壁）スタイル：基本は緑。解く盤面では非表示（見えない） */
        .wall-h, .wall-v {
            position: absolute;
            background-color: #2ecc71;
            z-index: 10;
            border-radius: 2px;
        }
        .wall-h {
            height: 4px;
            transform: translateY(-2px);
        }
        .wall-v {
            width: 4px;
            transform: translateX(-2px);
        }
        /* 当たった壁・またはクリエイター側・ゲームオーバー時の赤表示 */
        .wall-hit {
            background-color: #e74c3c !important;
        }

        /* 画面いっぱいの巨大シンボル演出（〇と☓のみ） */
        #fullscreen-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.3);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            pointer-events: none;
        }
        .feedback-symbol {
            font-size: 130px;
            font-weight: 900;
            line-height: 1;
            animation: popIn 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            text-shadow: 0 8px 25px rgba(0,0,0,0.3);
        }
        .fb-circle { color: #2980b9; }
        .fb-cross { color: #e74c3c; }

        @keyframes popIn {
            0% { transform: scale(0.3); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        /* 4〜5行表示のコンパクトなログ画面 */
        .log-box {
            width: 100%;
            max-width: 450px;
            height: 75px; /* 約4〜5行分 */
            background: #222;
            color: #00ff66;
            font-family: monospace;
            font-size: 11px;
            padding: 6px;
            border-radius: 6px;
            overflow-y: auto;
            box-sizing: border-box;
            margin-top: 6px;
        }

        /* チャットエリア（対戦者は閲覧のみ、観戦者は送信可能） */
        .chat-container {
            width: 100%;
            max-width: 450px;
            margin-top: 6px;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 6px;
            background: #fafafa;
            box-sizing: border-box;
        }
        .chat-box {
            height: 60px;
            overflow-y: scroll;
            font-size: 12px;
            background: #fff;
            border: 1px solid #eee;
            padding: 4px;
            margin-bottom: 4px;
        }
        .chat-input-area { display: flex; gap: 6px; }
        .chat-input-area input { flex: 1; max-width: none; padding: 5px; font-size: 12px; }
        .chat-input-area button { padding: 5px 10px; margin-top: 0; font-size: 12px; }

        .room-info { font-size: 12px; color: #666; margin-bottom: 6px; }
    </style>
</head>
<body>

    <h1>Labyrinth</h1>

    <div id="fullscreen-overlay">
        <div id="feedback-symbol-box" class="feedback-symbol"></div>
    </div>
    <!-- 1. ルーム入室画面 -->
    <div id="screen-lobby" class="screen active">
        <h2>ルーム入室</h2>
        <div class="form-group">
            <label>プレイヤー名:</label>
            <input type="text" id="input-name" placeholder="名前を入力">
        </div>
        <div class="form-group">
            <label>ルームID:</label>
            <input type="text" id="input-room" value="room123">
        </div>
        <button onclick="enterLobby()">ルームに入る</button>
    </div>

    <!-- 2. 待機ロビー -->
    <div id="screen-room-lobby" class="screen">
        <h2>待機ロビー</h2>
        <div class="room-info" id="lobby-room-info"></div>
        
        <div class="form-group">
            <label>プレイモード:</label>
            <select id="select-game-mode">
                <option value="pvp">プレイヤー対戦 (Online)</option>
                <option value="cpu">コンピュータ対戦 (CPU vs Player)</option>
            </select>
        </div>

        <div class="form-group">
            <label>参加役割:</label>
            <select id="select-role">
                <option value="player">対戦プレイヤー</option>
                <option value="spectator">観戦者</option>
            </select>
        </div>

        <div id="host-settings-area" style="width: 100%; border-top: 1px dashed #ccc; margin-top: 8px; padding-top: 8px;">
            <h3 style="font-size: 13px; color: #2c3e50; margin: 0 0 6px 0;">⚙️ 管理者設定</h3>
            <div class="form-group">
                <label>壁の数 (5〜15個):</label>
                <input type="number" id="input-wall-count" min="5" max="15" value="5">
            </div>
            <div class="form-group">
                <label>観戦者に双方の壁の位置を見せる:</label>
                <select id="select-spectator-wall">
                    <option value="yes">見せる</option>
                    <option value="no" selected>見せない</option>
                </select>
            </div>
        </div>

        <button onclick="proceedFromLobby()">配置フェーズへ進む</button>
    </div>

    <!-- 3. スタート・ゴール・壁配置画面 -->
    <div id="screen-board-setup" class="screen">
        <h2 id="setup-title" style="font-size: 16px;">スタート・ゴール・壁の配置</h2>
        <p style="font-size: 11px; color: #555; text-align: center; margin: 4px 0;">
            S、Gを配置後、境界線の線（<span style="color:#2ecc71; font-weight:bold;">緑</span>）をクリックして壁を配置（<span id="max-wall-label">5</span>個）
        </p>
        <div class="board-container" id="setup-board-container" style="margin: 6px 0;"></div>
        <button id="btn-complete-setup" class="secondary" onclick="completeSetup()" disabled>配置完了・ゲーム開始</button>
    </div>

    <!-- 4. ゲームプレイ画面（デュアル盤面 ＋ ログ ＋ チャット閲覧） -->
    <div id="screen-game" class="screen" style="max-width: 900px;">
        <h2 id="game-turn-header" style="margin: 0 0 4px 0; font-size: 16px;">ゲーム進行中 (あなたのターン)</h2>
        
        <div class="game-layout">
            <div class="boards-wrapper">
                <!-- 自分が解く盤面（相手の壁は非表示） -->
                <div class="board-pane">
                    <h3 id="pane-title-solve">自分が解く盤面</h3>
                    <div class="board-container" id="solve-board-container"></div>
                </div>
                <!-- 自分が作った盤面 -->
                <div class="board-pane">
                    <h3>自分が作った盤面</h3>
                    <div class="board-container" id="creator-board-container"></div>
                </div>
            </div>

            <!-- 4〜5行のコンパクトなログ画面 -->
            <div class="log-box" id="game-log-box"></div>

            <!-- チャット閲覧エリア（対戦者は入力不可・閲覧のみ） -->
            <div class="chat-container">
                <div style="font-size: 11px; font-weight: bold; margin-bottom: 2px; color: #555;">💬 観戦チャット (閲覧のみ)</div>
                <div class="chat-box" id="game-chat-messages"></div>
            </div>
        </div>

        <button class="secondary" style="margin-top: 8px;" onclick="returnToLobby()">ロビーに戻る</button>
    </div>

    <!-- 5. 観戦ルーム画面（観戦者はチャット送信可能） -->
    <div id="screen-spectator" class="screen">
        <h2>観戦ルーム</h2>
        <div id="spec-status" style="font-weight: bold; margin-bottom: 6px; font-size: 12px;"></div>
        <div class="board-container" id="spec-board-container" style="margin: 6px 0;"></div>
        <div class="log-box" id="spec-log-box"></div>
        <div class="chat-container">
            <div style="font-size: 11px; font-weight: bold; margin-bottom: 2px; color: #27ae60;">💬 チャット送信 (観戦者専用)</div>
            <div class="chat-box" id="spec-chat-messages"></div>
            <div class="chat-input-area">
                <input type="text" id="spec-chat-input" placeholder="チャットを入力...">
                <button onclick="sendSpecChat()" style="margin-top:0;">送信</button>
            </div>
        </div>
        <button class="secondary" style="margin-top: 8px;" onclick="returnToLobby()">ロビーに戻る</button>
    </div>

    <script>
        let state = {
            name: '',
            roomId: '',
            gameMode: 'pvp',
            role: 'player',
            wallCount: 5,
            spectatorCanSeeWalls: false,
            gridSize: 6,
            
            mySolveStart: {r: 0, c: 0},
            mySolveGoal: {r: 5, c: 5},
            mySolveWalls: [],
            currentPos: {r: 0, c: 0},
            
            myCreatorStart: null,
            myCreatorGoal: null,
            myCreatorWalls: [],
            
            isMyTurn: true,
            suddenDeath: false,
            gameOver: false,
            hitWalls: [],
            logs: [],
            chats: []
        };

        const svgPlayerIcon = `<svg class="player-icon" viewBox="0 0 24 24"><path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/></svg>`;

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function enterLobby() {
            const name = document.getElementById('input-name').value.trim();
            const roomId = document.getElementById('input-room').value.trim();
            if (!name) { alert('プレイヤー名を入力してください。'); return; }
            state.name = name;
            state.roomId = roomId;
            document.getElementById('lobby-room-info').innerText = `ルームID: ${roomId} | プレイヤー: ${name}`;
            switchScreen('screen-room-lobby');
        }

        function proceedFromLobby() {
            state.gameMode = document.getElementById('select-game-mode').value;
            state.role = document.getElementById('select-role').value;
            const wc = parseInt(document.getElementById('input-wall-count').value);
            if (!isNaN(wc) && wc >= 5 && wc <= 15) state.wallCount = wc;
            state.spectatorCanSeeWalls = document.getElementById('select-spectator-wall').value === 'yes';
            initBoardSetup();
        }

        function returnToLobby() { enterLobby(); }

        let setupStep = 'start';
        let tempStart = null;
        let tempGoal = null;
        let tempWalls = [];

        function initBoardSetup() {
            switchScreen('screen-board-setup');
            document.getElementById('max-wall-label').innerText = state.wallCount;
            setupStep = 'start';
            tempStart = null;
            tempGoal = null;
            tempWalls = [];
            document.getElementById('setup-title').innerText = 'スタート(S)の位置を選択';
            document.getElementById('btn-complete-setup').disabled = true;
            document.getElementById('btn-complete-setup').className = 'secondary';
            renderSetupBoard();
        }

        function renderSetupBoard() {
            const container = document.getElementById('setup-board-container');
            container.innerHTML = '';
            const board = document.createElement('div');
            board.className = 'board';

            board.appendChild(createLabel(''));
            for (let c = 0; c < state.gridSize; c++) board.appendChild(createLabel(c + 1));

            const cols = ['A', 'B', 'C', 'D', 'E', 'F'];
            for (let r = 0; r < state.gridSize; r++) {
                board.appendChild(createLabel(cols[r]));
                for (let c = 0; c < state.gridSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (tempStart && tempStart.r === r && tempStart.c === c) {
                        cell.classList.add('start');
                        cell.innerHTML = '<span class="cell-tag-large">S</span>';
                    } else if (tempGoal && tempGoal.r === r && tempGoal.c === c) {
                        cell.classList.add('goal');
                        cell.innerHTML = '<span class="cell-tag-large">G</span>';
                    }
                    cell.onclick = () => handleSetupCellClick(r, c);
                    board.appendChild(cell);
                }
            }

            const cellSize = 36;
            const labelSize = 20;

            for (let r = 0; r <= state.gridSize; r++) {
                for (let c = 0; c < state.gridSize; c++) {
                    const wallH = document.createElement('div');
                    wallH.className = 'wall-h';
                    wallH.style.opacity = tempWalls.some(w => w.type === 'h' && w.r === r && w.c === c) ? '1' : '0.3';
                    wallH.style.top = `${labelSize + r * cellSize}px`;
                    wallH.style.left = `${labelSize + c * cellSize}px`;
                    wallH.style.width = `${cellSize}px`;
                    wallH.onclick = (e) => { e.stopPropagation(); handleSetupWallClick('h', r, c); };
                    board.appendChild(wallH);
                }
            }

            for (let r = 0; r < state.gridSize; r++) {
                for (let c = 0; c <= state.gridSize; c++) {
                    const wallV = document.createElement('div');
                    wallV.className = 'wall-v';
                    wallV.style.opacity = tempWalls.some(w => w.type === 'v' && w.r === r && w.c === c) ? '1' : '0.3';
                    wallV.style.top = `${labelSize + r * cellSize}px`;
                    wallV.style.left = `${labelSize + c * cellSize}px`;
                    wallV.style.height = `${cellSize}px`;
                    wallV.onclick = (e) => { e.stopPropagation(); handleSetupWallClick('v', r, c); };
                    board.appendChild(wallV);
                }
            }
            container.appendChild(board);
        }

        function createLabel(text) {
            const div = document.createElement('div');
            div.className = 'axis-label';
            div.innerText = text;
            return div;
        }

        function handleSetupCellClick(r, c) {
            if (setupStep === 'start') {
                tempStart = {r, c};
                setupStep = 'goal';
                document.getElementById('setup-title').innerText = 'ゴール(G)の位置を選択';
                renderSetupBoard();
            } else if (setupStep === 'goal') {
                if (tempStart.r === r && tempStart.c === c) return;
                tempGoal = {r, c};
                setupStep = 'walls';
                document.getElementById('setup-title').innerText = `壁を配置 (${0}/${state.wallCount})`;
                renderSetupBoard();
            }
        }

        function handleSetupWallClick(type, r, c) {
            if (setupStep !== 'walls') return;
            const index = tempWalls.findIndex(w => w.type === type && w.r === r && w.c === c);
            if (index > -1) {
                tempWalls.splice(index, 1);
            } else {
                if (tempWalls.length >= state.wallCount) return;
                tempWalls.push({type, r, c});
            }
            document.getElementById('setup-title').innerText = `壁を配置 (${tempWalls.length}/${state.wallCount})`;
            renderSetupBoard();

            const btn = document.getElementById('btn-complete-setup');
            if (tempWalls.length === state.wallCount) {
                btn.disabled = false;
                btn.className = '';
            } else {
                btn.disabled = true;
                btn.className = 'secondary';
            }
        }

        function completeSetup() {
            state.myCreatorStart = tempStart;
            state.myCreatorGoal = tempGoal;
            state.myCreatorWalls = tempWalls;

            state.mySolveStart = {r: 0, c: 0};
            state.mySolveGoal = {r: 5, c: 5};
            generateRandomSolveWalls();

            state.currentPos = { ...state.mySolveStart };
            state.hitWalls = [];
            state.suddenDeath = false;
            state.gameOver = false;
            state.isMyTurn = true;
            state.logs = [`ゲーム開始！壁の数は ${state.wallCount} 個です。`];

            if (state.role === 'spectator') {
                initSpectatorScreen();
            } else {
                initGameScreen();
            }
        }

        function generateRandomSolveWalls() {
            state.mySolveWalls = [];
            while (state.mySolveWalls.length < state.wallCount) {
                const type = Math.random() < 0.5 ? 'h' : 'v';
                const r = Math.floor(Math.random() * (type === 'h' ? 7 : 6));
                const c = Math.floor(Math.random() * (type === 'h' ? 6 : 7));
                if (!state.mySolveWalls.some(w => w.type === type && w.r === r && w.c === c)) {
                    state.mySolveWalls.push({type, r, c});
                }
            }
        }
        function initGameScreen() {
            switchScreen('screen-game');
            document.getElementById('pane-title-solve').innerText = `${state.name} の解く盤面`;
            updateGameUI();
        }

        function updateGameUI() {
            const header = document.getElementById('game-turn-header');
            if (state.gameOver) {
                header.innerText = 'ゲーム終了';
            } else if (state.isMyTurn) {
                header.innerText = 'あなたのターン (移動先をタップ)';
                header.style.color = '#27ae60';
            } else {
                header.innerText = '相手(CPU)のターン...';
                header.style.color = '#e74c3c';
            }
            renderDualBoards();
            updateLogBoxes();
            updateChatBoxes();
        }

        function renderDualBoards() {
            renderSolveBoard();
            renderCreatorBoard();
        }

        // 1. 自分が解く盤面（相手の壁は初期状態では非表示！ぶつかった壁のみ赤く表示）
        function renderSolveBoard() {
            const container = document.getElementById('solve-board-container');
            container.innerHTML = '';
            const board = document.createElement('div');
            board.className = 'board';

            board.appendChild(createLabel(''));
            for (let c = 0; c < state.gridSize; c++) board.appendChild(createLabel(c + 1));

            const cols = ['A', 'B', 'C', 'D', 'E', 'F'];
            for (let r = 0; r < state.gridSize; r++) {
                board.appendChild(createLabel(cols[r]));
                for (let c = 0; c < state.gridSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    if (state.mySolveStart.r === r && state.mySolveStart.c === c && !state.gameOver) {
                        cell.classList.add('start');
                        cell.innerHTML = '<span class="cell-tag-large">S</span>';
                    }
                    if (state.mySolveGoal.r === r && state.mySolveGoal.c === c) {
                        cell.classList.add('goal');
                        cell.innerHTML = '<span class="cell-tag-large">G</span>';
                    }
                    if (state.currentPos.r === r && state.currentPos.c === c) {
                        cell.innerHTML += svgPlayerIcon;
                    }

                    cell.onclick = () => {
                        if (state.isMyTurn) tryMoveToCell(r, c);
                    };
                    board.appendChild(cell);
                }
            }

            // 相手の壁：解く盤面では通常非表示。ゲームオーバーまたはヒットした壁のみ赤で表示
            const cellSize = 36;
            const labelSize = 20;

            state.mySolveWalls.forEach(w => {
                const isHit = state.hitWalls.some(hw => hw.type === w.type && hw.r === w.r && hw.c === w.c);
                if (isHit || state.gameOver) {
                    const wallDiv = document.createElement('div');
                    wallDiv.className = `wall-${w.type} wall-hit`;
                    if (w.type === 'h') {
                        wallDiv.style.top = `${labelSize + w.r * cellSize}px`;
                        wallDiv.style.left = `${labelSize + w.c * cellSize}px`;
                        wallDiv.style.width = `${cellSize}px`;
                    } else {
                        wallDiv.style.top = `${labelSize + w.r * cellSize}px`;
                        wallDiv.style.left = `${labelSize + w.c * cellSize}px`;
                        wallDiv.style.height = `${cellSize}px`;
                    }
                    board.appendChild(wallDiv);
                }
            });

            container.appendChild(board);
        }

        // 2. 自分が作った盤面
        function renderCreatorBoard() {
            const container = document.getElementById('creator-board-container');
            container.innerHTML = '';
            const board = document.createElement('div');
            board.className = 'board';

            board.appendChild(createLabel(''));
            for (let c = 0; c < state.gridSize; c++) board.appendChild(createLabel(c + 1));

            const cols = ['A', 'B', 'C', 'D', 'E', 'F'];
            for (let r = 0; r < state.gridSize; r++) {
                board.appendChild(createLabel(cols[r]));
                for (let c = 0; c < state.gridSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (state.myCreatorStart && state.myCreatorStart.r === r && state.myCreatorStart.c === c) {
                        cell.classList.add('start');
                        cell.innerHTML = '<span class="cell-tag-large">S</span>';
                    }
                    if (state.myCreatorGoal && state.myCreatorGoal.r === r && state.myCreatorGoal.c === c) {
                        cell.classList.add('goal');
                        cell.innerHTML = '<span class="cell-tag-large">G</span>';
                    }
                    board.appendChild(cell);
                }
            }

            const cellSize = 36;
            const labelSize = 20;

            state.myCreatorWalls.forEach(w => {
                const wallDiv = document.createElement('div');
                wallDiv.className = `wall-${w.type} wall-hit`;
                if (w.type === 'h') {
                    wallDiv.style.top = `${labelSize + w.r * cellSize}px`;
                    wallDiv.style.left = `${labelSize + w.c * cellSize}px`;
                    wallDiv.style.width = `${cellSize}px`;
                } else {
                    wallDiv.style.top = `${labelSize + w.r * cellSize}px`;
                    wallDiv.style.left = `${labelSize + w.c * cellSize}px`;
                    wallDiv.style.height = `${cellSize}px`;
                }
                board.appendChild(wallDiv);
            });

            container.appendChild(board);
        }

        // 移動・壁衝突・ターン交代のメインロジック
        function tryMoveToCell(targetR, targetC) {
            if (state.gameOver || !state.isMyTurn) return;

            const curR = state.currentPos.r;
            const curC = state.currentPos.c;
            const dr = Math.abs(targetR - curR);
            const dc = Math.abs(targetC - curC);
            if ((dr + dc) !== 1) return; // 隣接マスのみ

            let wallBlocked = false;
            let hitWallObj = null;

            if (targetR < curR) {
                wallBlocked = state.mySolveWalls.some(w => w.type === 'h' && w.r === curR && w.c === curC);
                hitWallObj = { type: 'h', r: curR, c: curC };
            } else if (targetR > curR) {
                wallBlocked = state.mySolveWalls.some(w => w.type === 'h' && w.r === curR + 1 && w.c === curC);
                hitWallObj = { type: 'h', r: curR + 1, c: curC };
            } else if (targetC < curC) {
                wallBlocked = state.mySolveWalls.some(w => w.type === 'v' && w.r === curR && w.c === curC);
                hitWallObj = { type: 'v', r: curR, c: curC };
            } else if (targetC > curC) {
                wallBlocked = state.mySolveWalls.some(w => w.type === 'v' && w.r === curR && w.c === curC + 1);
                hitWallObj = { type: 'v', r: curR, c: curC + 1 };
            }

            const cols = ['A', 'B', 'C', 'D', 'E', 'F'];
            const targetCoord = `${cols[targetR]}${targetC + 1}`;

            if (wallBlocked) {
                // 壁にぶつかった！演出 ＆ ターン交代
                showFullscreenSymbol('cross');
                if (!state.hitWalls.some(hw => hw.type === hitWallObj.type && hw.r === hitWallObj.r && hw.c === hitWallObj.c)) {
                    state.hitWalls.push(hitWallObj);
                }
                state.logs.push(`${targetCoord} で壁に衝突！ターン交代`);
                state.isMyTurn = false;
                updateGameUI();

                if (state.gameMode === 'cpu') {
                    setTimeout(() => triggerCpuTurn(), 1000);
                }
            } else {
                // 成功：移動継続（自分のターン継続）
                showFullscreenSymbol('circle');
                state.currentPos = { r: targetR, c: targetC };
                state.logs.push(`${targetCoord} へ移動成功！`);

                if (state.currentPos.r === state.mySolveGoal.r && state.currentPos.c === state.mySolveGoal.c) {
                    if (!state.suddenDeath) {
                        state.suddenDeath = true;
                        state.logs.push('ゴール到達！サドンデス開始');
                        alert('ゴール到達！サドンデス：クリア出来たら引き分け！');
                    } else {
                        state.gameOver = true;
                        state.logs.push('ゲームクリア！');
                        alert('クリア！ゲーム終了です！');
                    }
                }
                updateGameUI();
            }
        }

        // CPUのターン処理
        function triggerCpuTurn() {
            if (state.gameOver) return;
            state.logs.push('CPUが迷路を探索中...');
            updateLogBoxes();

            setTimeout(() => {
                const hit = Math.random() < 0.5;
                if (hit) {
                    state.logs.push('CPUが壁に衝突！あなたのターンへ');
                } else {
                    state.logs.push('CPUが1歩前進しました');
                }
                state.isMyTurn = true;
                updateGameUI();
            }, 1200);
        }

        // 画面いっぱいの巨大シンボル演出（〇 と ☓ のみ）
        function showFullscreenSymbol(type) {
            const overlay = document.getElementById('fullscreen-overlay');
            const box = document.getElementById('feedback-symbol-box');
            
            overlay.style.display = 'flex';
            if (type === 'circle') {
                box.className = 'feedback-symbol fb-circle';
                box.innerHTML = '〇';
            } else {
                box.className = 'feedback-symbol fb-cross';
                box.innerHTML = '☓';
            }

            setTimeout(() => {
                overlay.style.display = 'none';
            }, 550);
        }

        // 4〜5行のログ画面の更新
        function updateLogBoxes() {
            const logText = state.logs.slice(-5).join('\n');
            const gameLog = document.getElementById('game-log-box');
            if (gameLog) {
                gameLog.innerText = logText;
                gameLog.scrollTop = gameLog.scrollHeight;
            }
            const specLog = document.getElementById('spec-log-box');
            if (specLog) {
                specLog.innerText = logText;
                specLog.scrollTop = specLog.scrollHeight;
            }
        }

        // チャット更新（対戦者は閲覧のみ、観戦者は送信可能）
        function updateChatBoxes() {
            const chatHtml = state.chats.map(c => `<div><strong>${c.name}:</strong> ${c.text}</div>`).join('');
            const gameChat = document.getElementById('game-chat-messages');
            if (gameChat) gameChat.innerHTML = chatHtml;
            const specChat = document.getElementById('spec-chat-messages');
            if (specChat) specChat.innerHTML = chatHtml;
        }

        // --- 観戦者画面 ---
        function initSpectatorScreen() {
            switchScreen('screen-spectator');
            document.getElementById('spec-status').innerText = `観戦ルーム (${state.roomId})`;
            renderSpectatorBoard();
            updateLogBoxes();
            updateChatBoxes();
        }

        function renderSpectatorBoard() {
            const container = document.getElementById('spec-board-container');
            container.innerHTML = '';
            const board = document.createElement('div');
            board.className = 'board';
            board.appendChild(createLabel(''));
            for (let c = 0; c < state.gridSize; c++) board.appendChild(createLabel(c + 1));
            
            const cols = ['A', 'B', 'C', 'D', 'E', 'F'];
            for (let r = 0; r < state.gridSize; r++) {
                board.appendChild(createLabel(cols[r]));
                for (let c = 0; c < state.gridSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    board.appendChild(cell);
                }
            }
            container.appendChild(board);
        }

        function sendSpecChat() {
            const input = document.getElementById('spec-chat-input');
            const text = input.value.trim();
            if (!text) return;
            state.chats.push({ name: `${state.name}(観戦)`, text: text });
            input.value = '';
            updateChatBoxes();
        }
    </script>
</body>
</html>
