<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labyrinth</title>
    <style>
        :root {
            --cell-size: 50px;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #2c3e50;
            margin-bottom: 10px;
        }
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            background: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 800px;
            width: 100%;
            box-sizing: border-box;
        }
        .screen.active {
            display: flex;
        }
        .form-group {
            margin: 12px 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
        }
        input, select {
            padding: 10px;
            font-size: 16px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 80%;
            max-width: 300px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 15px;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #2980b9;
        }
        button.secondary {
            background-color: #7f8c8d;
        }
        button.secondary:hover {
            background-color: #636e72;
        }

        /* 盤面エリア（デュアル盤面用レイアウト） */
        .boards-wrapper {
            display: flex;
            gap: 30px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 15px;
        }
        .board-pane {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fafafa;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #e1e4e8;
        }
        .board-pane h3 {
            margin: 0 0 10px 0;
            font-size: 16px;
            color: #2c3e50;
        }
        .board-container {
            position: relative;
        }
        .board {
            display: grid;
            grid-template-columns: 25px repeat(6, var(--cell-size));
            grid-template-rows: 25px repeat(6, var(--cell-size));
            gap: 0;
            background-color: #fff;
            border: 2px solid #333;
        }
        .axis-label {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 12px;
            color: #555;
            background-color: #ecf0f1;
        }
        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            border: 1px solid #dfe4ea;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: #fff;
            cursor: pointer;
            transition: background 0.1s;
        }
        .cell:hover {
            background-color: #f1f2f6;
        }
        .cell.start {
            background-color: #e8f8f5;
        }
        .cell.goal {
            background-color: #fef5e7;
        }
        .cell-tag {
            position: absolute;
            font-size: 10px;
            font-weight: bold;
            top: 2px;
            left: 3px;
        }
        .cell.start .cell-tag { color: #27ae60; }
        .cell.goal .cell-tag { color: #e67e22; }

        /* 人型アイコン */
        .player-icon {
            width: 24px;
            height: 24px;
            fill: #2980b9;
            z-index: 5;
        }

        /* 辺（壁）スタイル：完全にマスの境界線上に配置 */
        .wall-h, .wall-v {
            position: absolute;
            background-color: #2ecc71; /* 未確認/初期は緑 */
            z-index: 10;
            transition: background 0.2s;
        }
        .wall-h {
            height: 6px;
            transform: translateY(-3px);
            border-radius: 3px;
        }
        .wall-v {
            width: 6px;
            transform: translateX(-3px);
            border-radius: 3px;
        }
        .wall-active {
            background-color: #e74c3c !important; /* 当たった壁・確定した壁は赤 */
        }

        /* 画面いっぱいの巨大フィードバック演出 */
        #fullscreen-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            pointer-events: none;
        }
        .feedback-content {
            font-size: 56px;
            font-weight: 900;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }
        /* 〇の中にいけるっ！ */
        .fb-success {
            position: relative;
            color: #2980b9;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 60px;
            border-radius: 100px;
            border: 8px solid #3498db;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        /* ☓の左右側にだめっ！ */
        .fb-fail {
            color: #e74c3c;
            background: rgba(255, 255, 255, 0.95);
            padding: 30px 50px;
            border-radius: 20px;
            border: 8px solid #e74c3c;
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }
        @keyframes popIn {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .room-info {
            font-size: 14px;
            color: #666;
            margin-bottom: 10px;
        }
        .chat-box {
            width: 100%;
            height: 120px;
            border: 1px solid #ccc;
            border-radius: 6px;
            overflow-y: scroll;
            padding: 8px;
            margin-bottom: 10px;
            background: #fafafa;
            font-size: 14px;
            box-sizing: border-box;
        }
        .chat-input-area {
            display: flex;
            width: 100%;
            gap: 10px;
        }
        .chat-input-area input {
            flex: 1;
            max-width: none;
        }
    </style>
</head>
<body>

    <h1>Labyrinth</h1>

    <!-- 巨大フィードバック用オーバーレイ -->
    <div id="fullscreen-overlay">
        <div id="feedback-box" class="feedback-content"></div>
    </div>
    <!-- 1. ルームID入力画面 -->
    <div id="screen-lobby" class="screen active">
        <h2>ルーム入室</h2>
        <div class="form-group">
            <label>プレイヤー名:</label>
            <input type="text" id="input-name" placeholder="名前を入力">
        </div>
        <div class="form-group">
            <label>ルームID:</label>
            <input type="text" id="input-room" value="room123">
        </div>
        <button onclick="enterLobby()">ルームに入る</button>
    </div>

    <!-- 2. ロビー（待機部屋・モード＆役割選択） -->
    <div id="screen-room-lobby" class="screen">
        <h2 id="lobby-title">待機ロビー</h2>
        <div class="room-info" id="lobby-room-info"></div>
        
        <div class="form-group">
            <label>プレイモード:</label>
            <select id="select-game-mode" onchange="toggleModeSettings()">
                <option value="pvp">プレイヤー対戦 (Online / Multi)</option>
                <option value="cpu">コンピュータ対戦 (CPU vs Player)</option>
            </select>
        </div>

        <div class="form-group">
            <label>参加役割:</label>
            <select id="select-role">
                <option value="player">対戦プレイヤー (Player)</option>
                <option value="spectator">観戦者 (Spectator)</option>
            </select>
        </div>

        <!-- 管理者専用設定エリア -->
        <div id="host-settings-area" style="width: 100%; border-top: 1px dashed #ccc; margin-top: 15px; padding-top: 15px; display: none;">
            <h3 style="font-size: 15px; color: #2c3e50; margin: 0 0 10px 0;">⚙️ 管理者設定</h3>
            <div class="form-group">
                <label>壁の数 (5〜15個):</label>
                <input type="number" id="input-wall-count" min="5" max="15" value="5">
            </div>
            <div class="form-group">
                <label>観戦者に双方の壁の位置を見せる:</label>
                <select id="select-spectator-wall">
                    <option value="yes">見せる</option>
                    <option value="no" selected>見せない</option>
                </select>
            </div>
        </div>

        <button onclick="proceedFromLobby()">ゲームの準備（配置）へ進む</button>
    </div>

    <!-- 3. 壁・S・G 配置画面 -->
    <div id="screen-board-setup" class="screen">
        <h2 id="setup-title">スタート・ゴール・壁の配置</h2>
        <p style="font-size: 13px; color: #555; text-align: center;">
            最初に「S（スタート）」、次に「G（ゴール）」のマスをクリックし、その後マスの「境界線（辺）」をクリックして相手が解くための壁（<span id="max-wall-label">5</span>個）を配置してください。
        </p>
        <div class="board-container" id="setup-board-container" style="margin: 15px 0;"></div>
        <button id="btn-complete-setup" class="secondary" onclick="completeSetup()" disabled>配置完了・ゲーム開始</button>
    </div>

    <!-- 4. ゲームプレイ画面（デュアル盤面） -->
    <div id="screen-game" class="screen" style="max-width: 900px;">
        <h2 id="game-turn-header" style="margin-bottom: 5px;">ゲーム画面</h2>
        <div class="boards-wrapper">
            <!-- 自分が解くべき盤面 -->
            <div class="board-pane">
                <h3 id="pane-title-solve">自分が解くべき盤面</h3>
                <div class="board-container" id="solve-board-container"></div>
            </div>
            <!-- 自分が作った盤面 -->
            <div class="board-pane">
                <h3>自分が作った盤面（相手用）</h3>
                <div class="board-container" id="creator-board-container"></div>
            </div>
        </div>
        <button class="secondary" style="margin-top: 20px;" onclick="returnToLobby()">ロビーに戻る</button>
    </div>

    <!-- 5. 観戦ルーム画面 -->
    <div id="screen-spectator" class="screen">
        <h2>観戦ルーム</h2>
        <div id="spec-status" style="font-weight: bold; margin-bottom: 10px;"></div>
        <div class="board-container" id="spec-board-container" style="margin: 15px 0;"></div>
        <div class="chat-box" id="chat-messages"></div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="チャットを入力...">
            <button onclick="sendChat()" style="margin-top:0;">送信</button>
        </div>
        <button class="secondary" onclick="returnToLobby()">ロビーに戻る</button>
    </div>

    <script>
        let state = {
            name: '',
            roomId: '',
            gameMode: 'pvp',
            role: 'player',
            isHost: true, // 最初に部屋に入った人を簡易的にホスト(管理者)とする
            wallCount: 5,
            spectatorCanSeeWalls: false,
            gridSize: 6,
            
            // プレイヤー自身が解く盤面の状態（相手が作った壁を配置される想定、ここではモックとして自己完結またはCPU対戦用に保持）
            mySolveStart: {r: 0, c: 0},
            mySolveGoal: {r: 5, c: 5},
            mySolveWalls: [],
            currentPos: {r: 0, c: 0},
            
            // プレイヤーが自分が作る盤面
            myCreatorStart: null,
            myCreatorGoal: null,
            myCreatorWalls: [],
            
            suddenDeath: false,
            gameOver: false,
            hitWalls: [],
            chats: []
        };

        const svgPlayerIcon = `<svg class="player-icon" viewBox="0 0 24 24"><path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/></svg>`;

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function enterLobby() {
            const name = document.getElementById('input-name').value.trim();
            const roomId = document.getElementById('input-room').value.trim();
            if (!name) {
                alert('プレイヤー名を入力してください。');
                return;
            }
            state.name = name;
            state.roomId = roomId;

            document.getElementById('lobby-room-info').innerText = `ルームID: ${roomId} | プレイヤー: ${name} (${state.isHost ? '管理者' : '参加者'})`;
            document.getElementById('host-settings-area').style.display = state.isHost ? 'block' : 'none';
            switchScreen('screen-room-lobby');
        }

        function toggleModeSettings() {
            state.gameMode = document.getElementById('select-game-mode').value;
        }

        function proceedFromLobby() {
            state.role = document.getElementById('select-role').value;
            if (state.isHost) {
                const wc = parseInt(document.getElementById('input-wall-count').value);
                if (isNaN(wc) || wc < 5 || wc > 15) {
                    alert('壁の数は5〜15個の間で指定してください。');
                    return;
                }
                state.wallCount = wc;
                state.spectatorCanSeeWalls = document.getElementById('select-spectator-wall').value === 'yes';
            }
            initBoardSetup();
        }

        function returnToLobby() {
            enterLobby();
        }

        // --- 配置フェーズロジック ---
        let setupStep = 'start';
        let tempStart = null;
        let tempGoal = null;
        let tempWalls = [];

        function initBoardSetup() {
            switchScreen('screen-board-setup');
            document.getElementById('max-wall-label').innerText = state.wallCount;
            setupStep = 'start';
            tempStart = null;
            tempGoal = null;
            tempWalls = [];
            document.getElementById('setup-title').innerText = 'スタート(S)の位置を選択してください';
            document.getElementById('btn-complete-setup').disabled = true;
            document.getElementById('btn-complete-setup').className = 'secondary';
            renderSetupBoard();
        }

        function renderSetupBoard() {
            const container = document.getElementById('setup-board-container');
            container.innerHTML = '';
            const board = document.createElement('div');
            board.className = 'board';

            board.appendChild(createLabel(''));
            for (let c = 0; c < state.gridSize; c++) board.appendChild(createLabel(c + 1));

            const cols = ['A', 'B', 'C', 'D', 'E', 'F'];
            for (let r = 0; r < state.gridSize; r++) {
                board.appendChild(createLabel(cols[r]));
                for (let c = 0; c < state.gridSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (tempStart && tempStart.r === r && tempStart.c === c) {
                        cell.classList.add('start');
                        cell.innerHTML = '<span class="cell-tag">S</span>';
                    } else if (tempGoal && tempGoal.r === r && tempGoal.c === c) {
                        cell.classList.add('goal');
                        cell.innerHTML = '<span class="cell-tag">G</span>';
                    }
                    cell.onclick = () => handleSetupCellClick(r, c);
                    board.appendChild(cell);
                }
            }

            // 辺（壁）の描画：マスの境界線上にぴったり配置
            for (let r = 0; r <= state.gridSize; r++) {
                for (let c = 0; c < state.gridSize; c++) {
                    const wallH = document.createElement('div');
                    wallH.className = 'wall-h';
                    if (tempWalls.some(w => w.type === 'h' && w.r === r && w.c === c)) {
                        wallH.classList.add('wall-active');
                    }
                    wallH.style.top = `${r * 50}px`;
                    wallH.style.left = `${25 + c * 50}px`;
                    wallH.style.width = '50px';
                    wallH.onclick = (e) => { e.stopPropagation(); handleSetupWallClick('h', r, c); };
                    board.appendChild(wallH);
                }
            }

            for (let r = 0; r < state.gridSize; r++) {
                for (let c = 0; c <= state.gridSize; c++) {
                    const wallV = document.createElement('div');
                    wallV.className = 'wall-v';
                    if (tempWalls.some(w => w.type === 'v' && w.r === r && w.c === c)) {
                        wallV.classList.add('wall-active');
                    }
                    wallV.style.top = `${25 + r * 50}px`;
                    wallV.style.left = `${c * 50}px`;
                    wallV.style.height = '50px';
                    wallV.onclick = (e) => { e.stopPropagation(); handleSetupWallClick('v', r, c); };
                    board.appendChild(wallV);
                }
            }
            container.appendChild(board);
        }

        function createLabel(text) {
            const div = document.createElement('div');
            div.className = 'axis-label';
            div.innerText = text;
            return div;
        }

        function handleSetupCellClick(r, c) {
            if (setupStep === 'start') {
                tempStart = {r, c};
                setupStep = 'goal';
                document.getElementById('setup-title').innerText = 'ゴール(G)の位置を選択してください';
                renderSetupBoard();
            } else if (setupStep === 'goal') {
                if (tempStart.r === r && tempStart.c === c) {
                    alert('スタートと同じ位置には置けません。');
                    return;
                }
                tempGoal = {r, c};
                setupStep = 'walls';
                document.getElementById('setup-title').innerText = `相手用の壁を配置してください (0 / ${state.wallCount}個)`;
                renderSetupBoard();
            }
        }

        function handleSetupWallClick(type, r, c) {
            if (setupStep !== 'walls') return;
            const index = tempWalls.findIndex(w => w.type === type && w.r === r && w.c === c);
            if (index > -1) {
                tempWalls.splice(index, 1);
            } else {
                if (tempWalls.length >= state.wallCount) {
                    alert(`壁の数は最大 ${state.wallCount} 個までです。`);
                    return;
                }
                tempWalls.push({type, r, c});
            }
            document.getElementById('setup-title').innerText = `相手用の壁を配置してください (${tempWalls.length} / ${state.wallCount}個)`;
            renderSetupBoard();
            
            const btn = document.getElementById('btn-complete-setup');
            if (tempWalls.length === state.wallCount) {
                btn.disabled = false;
                btn.className = '';
            } else {
                btn.disabled = true;
                btn.className = 'secondary';
            }
        }

        function completeSetup() {
            state.myCreatorStart = tempStart;
            state.myCreatorGoal = tempGoal;
            state.myCreatorWalls = tempWalls;

            // 自分が解く盤面の初期設定（CPU対戦や一人用デモの場合は自動生成またはミラー、ここではダミー壁を自動生成してセット）
            state.mySolveStart = {r: 0, c: 0};
            state.mySolveGoal = {r: 5, c: 5};
            generateRandomSolveWalls();

            state.currentPos = { ...state.mySolveStart };
            state.hitWalls = [];
            state.suddenDeath = false;
            state.gameOver = false;

            if (state.role === 'spectator') {
                initSpectatorScreen();
            } else {
                initGameScreen();
            }
        }

        function generateRandomSolveWalls() {
            // 自分が解くべき盤面用にランダムな壁を生成（プレイを即時試せるようにするため）
            state.mySolveWalls = [];
            while (state.mySolveWalls.length < state.wallCount) {
                const type = Math.random() < 0.5 ? 'h' : 'v';
                const r = Math.floor(Math.random() * (type === 'h' ? 7 : 6));
                const c = Math.floor(Math.random() * (type === 'h' ? 6 : 7));
                if (!state.mySolveWalls.some(w => w.type === type && w.r === r && w.c === c)) {
                    state.mySolveWalls.push({type, r, c});
                }
            }
        }
        // --- ゲームプレイ画面（デュアル盤面 ＆ 直接タップ移動） ---
        function initGameScreen() {
            switchScreen('screen-game');
            document.getElementById('pane-title-solve').innerText = `${state.name} が解くべき盤面`;
            renderDualBoards();
        }

        function renderDualBoards() {
            renderSolveBoard();
            renderCreatorBoard();
        }

        // 1. 自分が解くべき盤面（直接タップで移動可能）
        function renderSolveBoard() {
            const container = document.getElementById('solve-board-container');
            container.innerHTML = '';
            const board = document.createElement('div');
            board.className = 'board';

            board.appendChild(createLabel(''));
            for (let c = 0; c < state.gridSize; c++) board.appendChild(createLabel(c + 1));

            const cols = ['A', 'B', 'C', 'D', 'E', 'F'];
            for (let r = 0; r < state.gridSize; r++) {
                board.appendChild(createLabel(cols[r]));
                for (let c = 0; c < state.gridSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    if (state.mySolveStart.r === r && state.mySolveStart.c === c && !state.gameOver) {
                        cell.classList.add('start');
                        cell.innerHTML = '<span class="cell-tag">S</span>';
                    }
                    if (state.mySolveGoal.r === r && state.mySolveGoal.c === c) {
                        cell.classList.add('goal');
                        cell.innerHTML = '<span class="cell-tag">G</span>';
                    }
                    if (state.currentPos.r === r && state.currentPos.c === c) {
                        cell.innerHTML += svgPlayerIcon; // 人型アイコン
                    }

                    // マスを直接タップして移動を試みる
                    cell.onclick = () => tryMoveToCell(r, c);
                    board.appendChild(cell);
                }
            }

            // 壁の描画（未確認は緑、当たった壁は赤。ゲームオーバー時は全表示）
            state.mySolveWalls.forEach(w => {
                const wallDiv = document.createElement('div');
                if (w.type === 'h') {
                    wallDiv.className = 'wall-h';
                    wallDiv.style.top = `${w.r * 50}px`;
                    wallDiv.style.left = `${25 + w.c * 50}px`;
                    wallDiv.style.width = '50px';
                } else {
                    wallDiv.className = 'wall-v';
                    wallDiv.style.top = `${25 + r * 50}px`; // Fix offset
                    wallDiv.style.left = `${w.c * 50}px`;
                    wallDiv.style.height = '50px';
                }
                // 位置修正の調整用再適用
                if (w.type === 'v') {
                    wallDiv.style.top = `${w.r * 50}px`;
                }

                if (state.gameOver) {
                    const isHit = state.hitWalls.some(hw => hw.type === w.type && hw.r === w.r && hw.c === w.c);
                    if (isHit) wallDiv.classList.add('wall-active'); // 赤
                }
                board.appendChild(wallDiv);
            });

            container.appendChild(board);
        }

        // 2. 自分が作った盤面（相手用）
        function renderCreatorBoard() {
            const container = document.getElementById('creator-board-container');
            container.innerHTML = '';
            const board = document.createElement('div');
            board.className = 'board';

            board.appendChild(createLabel(''));
            for (let c = 0; c < state.gridSize; c++) board.appendChild(createLabel(c + 1));

            const cols = ['A', 'B', 'C', 'D', 'E', 'F'];
            for (let r = 0; r < state.gridSize; r++) {
                board.appendChild(createLabel(cols[r]));
                for (let c = 0; c < state.gridSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (state.myCreatorStart && state.myCreatorStart.r === r && state.myCreatorStart.c === c) {
                        cell.classList.add('start');
                        cell.innerHTML = '<span class="cell-tag">S</span>';
                    }
                    if (state.myCreatorGoal && state.myCreatorGoal.r === r && state.myCreatorGoal.c === c) {
                        cell.classList.add('goal');
                        cell.innerHTML = '<span class="cell-tag">G</span>';
                    }
                    board.appendChild(cell);
                }
            }

            state.myCreatorWalls.forEach(w => {
                const wallDiv = document.createElement('div');
                wallDiv.className = 'wall-h wall-active'; // 自分が作った壁は赤で固定表示
                if (w.type === 'h') {
                    wallDiv.style.top = `${w.r * 50}px`;
                    wallDiv.style.left = `${25 + w.c * 50}px`;
                    wallDiv.style.width = '50px';
                } else {
                    wallDiv.className = 'wall-v wall-active';
                    wallDiv.style.top = `${w.r * 50}px`;
                    wallDiv.style.left = `${w.c * 50}px`;
                    wallDiv.style.height = '50px';
                }
                board.appendChild(wallDiv);
            });

            container.appendChild(board);
        }

        // 直接タップ移動の判定（隣接する上下左右のマスのみ移動可能）
        function tryMoveToCell(targetR, targetC) {
            if (state.gameOver) return;

            const curR = state.currentPos.r;
            const curC = state.currentPos.c;

            // 隣接マス（上下左右 1マスのみ）かチェック
            const dr = Math.abs(targetR - curR);
            const dc = Math.abs(targetC - curC);
            if ((dr + dc) !== 1) {
                return; // 隣接していない場所は無視
            }

            // 壁の有無をチェック
            let wallBlocked = false;
            let hitWallObj = null;

            if (targetR < curR) {
                // 上へ移動
                wallBlocked = state.mySolveWalls.some(w => w.type === 'h' && w.r === curR && w.c === curC);
                hitWallObj = { type: 'h', r: curR, c: curC };
            } else if (targetR > curR) {
                // 下へ移動
                wallBlocked = state.mySolveWalls.some(w => w.type === 'h' && w.r === curR + 1 && w.c === curC);
                hitWallObj = { type: 'h', r: curR + 1, c: curC };
            } else if (targetC < curC) {
                // 左へ移動
                wallBlocked = state.mySolveWalls.some(w => w.type === 'v' && w.r === curR && w.c === curC);
                hitWallObj = { type: 'v', r: curR, c: curC };
            } else if (targetC > curC) {
                // 右へ移動
                wallBlocked = state.mySolveWalls.some(w => w.type === 'v' && w.r === curR && w.c === curC + 1);
                hitWallObj = { type: 'v', r: curR, c: curC + 1 };
            }

            if (wallBlocked) {
                showFullscreenFeedback('fail');
                if (!state.hitWalls.some(hw => hw.type === hitWallObj.type && hw.r === hitWallObj.r && hw.c === hitWallObj.c)) {
                    state.hitWalls.push(hitWallObj);
                }
            } else {
                showFullscreenFeedback('success');
                state.currentPos = { r: targetR, c: targetC };

                // ゴール判定
                if (state.currentPos.r === state.mySolveGoal.r && state.currentPos.c === state.mySolveGoal.c) {
                    if (!state.suddenDeath) {
                        state.suddenDeath = true;
                        setTimeout(() => {
                            alert('ゴール到達！サドンデス発生：クリア出来たら引き分け！！');
                        }, 300);
                    } else {
                        state.gameOver = true;
                        setTimeout(() => {
                            alert('後攻もクリアしました！引き分けです！');
                            renderDualBoards();
                        }, 300);
                        return;
                    }
                }
            }
            renderDualBoards();
        }

        // 画面いっぱいの巨大アニメーション演出
        function showFullscreenFeedback(type) {
            const overlay = document.getElementById('fullscreen-overlay');
            const box = document.getElementById('feedback-box');
            
            overlay.style.display = 'flex';
            if (type === 'success') {
                box.className = 'feedback-content';
                box.innerHTML = `<div class="fb-success">〇の中 「いけるっ！」</div>`;
            } else {
                box.className = 'feedback-content';
                box.innerHTML = `<div class="fb-fail">だめっ！ ☓ だめっ！</div>`;
            }

            setTimeout(() => {
                overlay.style.display = 'none';
            }, 700);
        }

        // --- 観戦者画面 ---
        function initSpectatorScreen() {
            switchScreen('screen-spectator');
            document.getElementById('spec-status').innerText = `観戦ルーム (${state.roomId})`;
            renderSpectatorBoard();
        }

        function renderSpectatorBoard() {
            const container = document.getElementById('spec-board-container');
            container.innerHTML = '';
            const board = document.createElement('div');
            board.className = 'board';
            board.appendChild(createLabel(''));
            for (let c = 0; c < state.gridSize; c++) board.appendChild(createLabel(c + 1));
            
            const cols = ['A', 'B', 'C', 'D', 'E', 'F'];
            for (let r = 0; r < state.gridSize; r++) {
                board.appendChild(createLabel(cols[r]));
                for (let c = 0; c < state.gridSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    board.appendChild(cell);
                }
            }

            if (state.spectatorCanSeeWalls) {
                state.myCreatorWalls.forEach(w => {
                    const wallDiv = document.createElement('div');
                    wallDiv.className = 'wall-h wall-active';
                    if (w.type === 'h') {
                        wallDiv.style.top = `${w.r * 50}px`;
                        wallDiv.style.left = `${25 + w.c * 50}px`;
                        wallDiv.style.width = '50px';
                    } else {
                        wallDiv.className = 'wall-v wall-active';
                        wallDiv.style.top = `${w.r * 50}px`;
                        wallDiv.style.left = `${w.c * 50}px`;
                        wallDiv.style.height = '50px';
                    }
                    board.appendChild(wallDiv);
                });
            }
            container.appendChild(board);
        }

        function sendChat() {
            const input = document.getElementById('chat-input');
            const text = input.value.trim();
            if (!text) return;
            state.chats.push({ name: state.name, text: text });
            input.value = '';
            updateChatBox();
        }

        function updateChatBox() {
            const chatBox = document.getElementById('chat-messages');
            chatBox.innerHTML = state.chats.map(c => `<div><strong>${c.name}:</strong> ${c.text}</div>`).join('');
            chatBox.scrollTop = chatBox.scrollHeight;
        }
    </script>
</body>
