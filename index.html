<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Labyrinth - Complete Edition</title>
    <style>
        :root {
            --cell-size: 36px;
            --label-size: 20px;
        }
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f0f2f5;
            color: #333;
            margin: 0;
            padding: 8px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h1 {
            color: #2c3e50;
            margin: 4px 0 8px 0;
            font-size: 22px;
        }
        .screen {
            display: none;
            flex-direction: column;
            align-items: center;
            background: #fff;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            max-width: 95vw;
            width: 100%;
            box-sizing: border-box;
        }
        .screen.active {
            display: flex;
        }
        .form-group {
            margin: 8px 0;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        label {
            font-weight: bold;
            margin-bottom: 4px;
            font-size: 13px;
        }
        input, select {
            padding: 8px;
            font-size: 14px;
            border: 1px solid #ccc;
            border-radius: 6px;
            width: 80%;
            max-width: 280px;
        }
        button {
            background-color: #3498db;
            color: white;
            border: none;
            padding: 9px 18px;
            font-size: 14px;
            font-weight: bold;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.2s;
        }
        button:hover { background-color: #2980b9; }
        button.secondary { background-color: #7f8c8d; }
        button.secondary:hover { background-color: #636e72; }

        .game-layout {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            width: 100%;
        }
        .boards-wrapper {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            width: 100%;
        }
        .board-pane {
            display: flex;
            flex-direction: column;
            align-items: center;
            background: #fafafa;
            padding: 8px;
            border-radius: 8px;
            border: 1px solid #e1e4e8;
        }
        .board-pane h3 {
            margin: 0 0 4px 0;
            font-size: 13px;
            color: #2c3e50;
        }
        .board-container {
            position: relative;
        }
        .board {
            display: grid;
            grid-template-columns: var(--label-size) repeat(6, var(--cell-size));
            grid-template-rows: var(--label-size) repeat(6, var(--cell-size));
            gap: 0;
            background-color: #fff;
            border: 2px solid #333;
            position: relative;
        }
        .axis-label {
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 10px;
            color: #555;
            background-color: #ecf0f1;
        }
        .cell {
            width: var(--cell-size);
            height: var(--cell-size);
            border: 1px solid #dfe4ea;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background-color: #fff;
        }
        .cell.start { background-color: #e8f8f5; }
        .cell.goal { background-color: #fef5e7; }
        
        .cell-tag-large {
            font-size: 16px;
            font-weight: 900;
            z-index: 2;
        }
        .cell.start .cell-tag-large { color: #27ae60; }
        .cell.goal .cell-tag-large { color: #e67e22; }

        .player-icon {
            width: 18px;
            height: 18px;
            fill: #2980b9;
            z-index: 5;
        }
        .opponent-icon {
            width: 18px;
            height: 18px;
            fill: #e74c3c;
            z-index: 5;
        }

        .wall-h, .wall-v {
            position: absolute;
            background-color: #2ecc71;
            z-index: 10;
            border-radius: 2px;
        }
        .wall-h {
            height: 4px;
            transform: translateY(-2px);
            cursor: pointer;
        }
        .wall-v {
            width: 4px;
            transform: translateX(-2px);
            cursor: pointer;
        }
        .wall-hit {
            background-color: #e74c3c !important;
        }

        /* 方向選択コントローラー（壁にぶつかるまで進むための操作パネル） */
        .dir-controls {
            display: grid;
            grid-template-columns: repeat(3, 44px);
            grid-template-rows: repeat(3, 44px);
            gap: 4px;
            margin: 6px 0;
        }
        .dir-btn {
            background-color: #34495e;
            color: white;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            margin-top: 0;
            padding: 0;
        }
        .dir-btn:hover { background-color: #2c3e50; }
        .dir-btn:disabled { background-color: #bdc3c7; cursor: not-allowed; }
        .dir-up { grid-column: 2; grid-row: 1; }
        .dir-left { grid-column: 1; grid-row: 2; }
        .dir-right { grid-column: 3; grid-row: 2; }
        .dir-down { grid-column: 2; grid-row: 3; }

        /* 全画面オーバーレイ（タップで消去可能） */
        #fullscreen-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            cursor: pointer;
        }
        .feedback-symbol {
            font-size: 120px;
            font-weight: 900;
            line-height: 1;
            text-shadow: 0 8px 25px rgba(0,0,0,0.3);
            text-align: center;
            padding: 20px;
        }
        .fb-circle { color: #2980b9; }
        .fb-cross { color: #e74c3c; } /* 鮮やかな赤字の☓ */
        .fb-sudden { color: #f1c40f; font-size: 45px; background: rgba(0,0,0,0.8); border-radius: 12px; padding: 30px; }
        .fb-win { color: #2ecc71; font-size: 40px; background: rgba(0,0,0,0.85); border-radius: 12px; padding: 30px; }

        /* ログとチャット統合エリア ＋ 横の全履歴ボタン */
        .log-chat-wrapper {
            display: flex;
            width: 100%;
            max-width: 450px;
            gap: 6px;
            align-items: stretch;
            margin-top: 6px;
        }
        .log-box {
            flex: 1;
            height: 75px;
            background: #222;
            color: #00ff66;
            font-family: monospace;
            font-size: 11px;
            padding: 6px;
            border-radius: 6px;
            overflow-y: auto;
            box-sizing: border-box;
            white-space: pre-wrap;
        }
        .history-btn-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        .history-btn-container button {
            height: 100%;
            margin-top: 0;
            padding: 0 10px;
            font-size: 12px;
            background-color: #6c5ce7;
        }
        .history-btn-container button:hover { background-color: #5b4bc4; }

        /* 全履歴表示モーダル */
        #history-modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
        }
        .modal-content {
            background: #fff;
            width: 90%;
            max-width: 400px;
            height: 70vh;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            padding: 12px;
            box-sizing: border-box;
        }
        .modal-header {
            font-weight: bold;
            font-size: 14px;
            margin-bottom: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-body {
            flex: 1;
            background: #111;
            color: #00ff66;
            font-family: monospace;
            font-size: 12px;
            padding: 8px;
            overflow-y: auto;
            border-radius: 4px;
            white-space: pre-wrap;
            margin-bottom: 8px;
        }

        .chat-input-row {
            display: flex;
            gap: 6px;
            width: 100%;
            max-width: 450px;
            margin-top: 4px;
        }
        .chat-input-row input { flex: 1; max-width: none; padding: 6px; font-size: 12px; }
        .chat-input-row button { padding: 6px 12px; margin-top: 0; font-size: 12px; }

        .room-info { font-size: 12px; color: #666; margin-bottom: 6px; }
        .error-msg { color: #e74c3c; font-size: 12px; font-weight: bold; margin-top: 4px; text-align: center; }
    </style>
</head>
<body>

    <h1>Labyrinth</h1>

    <!-- タップで消せる全画面オーバーレイ -->
    <div id="fullscreen-overlay" onclick="handleOverlayClick()">
        <div id="feedback-symbol-box" class="feedback-symbol"></div>
    </div>

    <!-- 全履歴モーダル -->
    <div id="history-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span>📜 全行動・チャット履歴</span>
                <button class="secondary" style="margin-top:0; padding:2px 8px; font-size:11px;" onclick="closeHistoryModal()">閉じる</button>
            </div>
            <div class="modal-body" id="modal-history-box"></div>
        </div>
    </div>
    <!-- 1. ルーム入室画面 -->
    <div id="screen-lobby" class="screen active">
        <h2>ルーム入室</h2>
        <div class="form-group">
            <label>プレイヤー名:</label>
            <input type="text" id="input-name" placeholder="名前を入力">
        </div>
        <div class="form-group">
            <label>ルームID:</label>
            <input type="text" id="input-room" value="room123">
        </div>
        <button onclick="enterLobby()">ルームに入る</button>
    </div>

    <!-- 2. 待機ロビー -->
    <div id="screen-room-lobby" class="screen">
        <h2>待機ロビー</h2>
        <div class="room-info" id="lobby-room-info"></div>
        
        <div class="form-group">
            <label>プレイモード:</label>
            <select id="select-game-mode">
                <option value="pvp">プレイヤー対戦 (Online)</option>
                <option value="cpu">コンピュータ対戦 (CPU vs Player)</option>
            </select>
        </div>

        <div class="form-group">
            <label>参加役割:</label>
            <select id="select-role">
                <option value="player">対戦プレイヤー</option>
                <option value="spectator">観戦者</option>
            </select>
        </div>

        <div id="host-settings-area" style="width: 100%; border-top: 1px dashed #ccc; margin-top: 8px; padding-top: 8px;">
            <h3 style="font-size: 13px; color: #2c3e50; margin: 0 0 6px 0;">⚙️ 管理者設定</h3>
            <div class="form-group">
                <label>壁の数 (5〜15個):</label>
                <input type="number" id="input-wall-count" min="5" max="15" value="5">
            </div>
            <div class="form-group">
                <label>観戦者に双方の壁の位置を見せる:</label>
                <select id="select-spectator-wall">
                    <option value="yes">見せる</option>
                    <option value="no" selected>見せない</option>
                </select>
            </div>
        </div>

        <button onclick="proceedFromLobby()">配置フェーズへ進む</button>
    </div>

    <!-- 3. スタート・ゴール・壁配置画面（バリデーション付き） -->
    <div id="screen-board-setup" class="screen">
        <h2 id="setup-title" style="font-size: 16px;">スタート・ゴール・壁の配置</h2>
        <p style="font-size: 11px; color: #555; text-align: center; margin: 4px 0;">
            S、Gを配置後、境界線の線（<span style="color:#2ecc71; font-weight:bold;">緑</span>）をクリックして壁を配置（<span id="max-wall-label">5</span>個）
        </p>
        <div class="board-container" id="setup-board-container" style="margin: 6px 0;"></div>
        <div id="setup-error-box" class="error-msg"></div>
        <button id="btn-complete-setup" class="secondary" onclick="completeSetup()" disabled>配置完了・ゲーム開始</button>
    </div>

    <!-- 4. ゲームプレイ画面（壁にぶつかるまで進むコントローラー対応） -->
    <div id="screen-game" class="screen" style="max-width: 900px;">
        <h2 id="game-turn-header" style="margin: 0 0 4px 0; font-size: 16px;">ゲーム進行中</h2>
        
        <div class="game-layout">
            <div class="boards-wrapper">
                <!-- 自分が解く盤面 -->
                <div class="board-pane">
                    <h3 id="pane-title-solve">自分が解く盤面</h3>
                    <div class="board-container" id="solve-board-container"></div>
                </div>
                <!-- 自分が作った盤面（相手の位置を表示） -->
                <div class="board-pane">
                    <h3>自分が作った盤面 (相手の位置)</h3>
                    <div class="board-container" id="creator-board-container"></div>
                </div>
            </div>

            <!-- 方向選択パネル（壁にぶつかるまで一気に進む1ターン操作） -->
            <div class="dir-controls" id="player-dir-controls">
                <button class="dir-btn dir-up" onclick="slideMove('up')">▲</button>
                <button class="dir-btn dir-left" onclick="slideMove('left')">◀</button>
                <button class="dir-btn dir-right" onclick="slideMove('right')">▶</button>
                <button class="dir-btn dir-down" onclick="slideMove('down')">▼</button>
            </div>

            <!-- ログとチャット統合エリア ＋ 横の全履歴ボタン -->
            <div class="log-chat-wrapper">
                <div class="log-box" id="game-log-box"></div>
                <div class="history-btn-container">
                    <button onclick="openHistoryModal()">全履歴</button>
                </div>
            </div>

            <!-- チャット入力（観戦者用） -->
            <div class="chat-input-row" id="game-chat-input-area" style="display: none;">
                <input type="text" id="game-chat-input" placeholder="観戦チャットを入力...">
                <button onclick="sendChat()" style="margin-top:0;">送信</button>
            </div>
        </div>

        <button class="secondary" style="margin-top: 8px;" onclick="returnToLobby()">ロビーに戻る</button>
    </div>

    <script>
        let state = {
            name: '',
            roomId: '',
            gameMode: 'pvp',
            role: 'player',
            wallCount: 5,
            spectatorCanSeeWalls: false,
            gridSize: 6,
            
            mySolveStart: {r: 0, c: 0},
            mySolveGoal: {r: 5, c: 5},
            mySolveWalls: [],
            currentPos: {r: 0, c: 0},
            
            opponentPos: {r: 0, c: 0},
            opponentStart: {r: 0, c: 0},
            opponentGoal: {r: 5, c: 5},

            myCreatorStart: null,
            myCreatorGoal: null,
            myCreatorWalls: [],
            
            isMyTurn: true,
            suddenDeath: false,
            suddenDeathPlayer: null,
            gameOver: false,
            hitWalls: [],
            logs: [],
            waitingForOverlayTap: false
        };

        const svgPlayerIcon = `<svg class="player-icon" viewBox="0 0 24 24"><path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/></svg>`;
        const svgOpponentIcon = `<svg class="opponent-icon" viewBox="0 0 24 24"><path d="M12 2c1.1 0 2 .9 2 2s-.9 2-2 2-2-.9-2-2 .9-2 2-2zm9 7h-6v13h-2v-6h-2v6H9V9H3V7h18v2z"/></svg>`;

        function switchScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function enterLobby() {
            const name = document.getElementById('input-name').value.trim();
            const roomId = document.getElementById('input-room').value.trim();
            if (!name) { alert('プレイヤー名を入力してください。'); return; }
            state.name = name;
            state.roomId = roomId;
            document.getElementById('lobby-room-info').innerText = `ルームID: ${roomId} | プレイヤー: ${name}`;
            switchScreen('screen-room-lobby');
        }

        function proceedFromLobby() {
            state.gameMode = document.getElementById('select-game-mode').value;
            state.role = document.getElementById('select-role').value;
            const wc = parseInt(document.getElementById('input-wall-count').value);
            if (!isNaN(wc) && wc >= 5 && wc <= 15) state.wallCount = wc;
            state.spectatorCanSeeWalls = document.getElementById('select-spectator-wall').value === 'yes';
            initBoardSetup();
        }

        function returnToLobby() { enterLobby(); }

        let setupStep = 'start';
        let tempStart = null;
        let tempGoal = null;
        let tempWalls = [];

        function initBoardSetup() {
            switchScreen('screen-board-setup');
            document.getElementById('max-wall-label').innerText = state.wallCount;
            setupStep = 'start';
            tempStart = null;
            tempGoal = null;
            tempWalls = [];
            document.getElementById('setup-title').innerText = 'スタート(S)の位置を選択';
            document.getElementById('setup-error-box').innerText = '';
            document.getElementById('btn-complete-setup').disabled = true;
            document.getElementById('btn-complete-setup').className = 'secondary';
            renderSetupBoard();
        }

        function renderSetupBoard() {
            const container = document.getElementById('setup-board-container');
            container.innerHTML = '';
            const board = document.createElement('div');
            board.className = 'board';

            board.appendChild(createLabel(''));
            for (let c = 0; c < state.gridSize; c++) board.appendChild(createLabel(c + 1));

            const cols = ['A', 'B', 'C', 'D', 'E', 'F'];
            for (let r = 0; r < state.gridSize; r++) {
                board.appendChild(createLabel(cols[r]));
                for (let c = 0; c < state.gridSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (tempStart && tempStart.r === r && tempStart.c === c) {
                        cell.classList.add('start');
                        cell.innerHTML = '<span class="cell-tag-large">S</span>';
                    } else if (tempGoal && tempGoal.r === r && tempGoal.c === c) {
                        cell.classList.add('goal');
                        cell.innerHTML = '<span class="cell-tag-large">G</span>';
                    }
                    cell.onclick = () => handleSetupCellClick(r, c);
                    board.appendChild(cell);
                }
            }

            const cellSize = 36;
            const labelSize = 20;

            for (let r = 0; r <= state.gridSize; r++) {
                for (let c = 0; c < state.gridSize; c++) {
                    const wallH = document.createElement('div');
                    wallH.className = 'wall-h';
                    wallH.style.opacity = tempWalls.some(w => w.type === 'h' && w.r === r && w.c === c) ? '1' : '0.3';
                    wallH.style.top = `${labelSize + r * cellSize}px`;
                    wallH.style.left = `${labelSize + c * cellSize}px`;
                    wallH.style.width = `${cellSize}px`;
                    wallH.onclick = (e) => { e.stopPropagation(); handleSetupWallClick('h', r, c); };
                    board.appendChild(wallH);
                }
            }

            for (let r = 0; r < state.gridSize; r++) {
                for (let c = 0; c <= state.gridSize; c++) {
                    const wallV = document.createElement('div');
                    wallV.className = 'wall-v';
                    wallV.style.opacity = tempWalls.some(w => w.type === 'v' && w.r === r && w.c === c) ? '1' : '0.3';
                    wallV.style.top = `${labelSize + r * cellSize}px`;
                    wallV.style.left = `${labelSize + c * cellSize}px`;
                    wallV.style.height = `${cellSize}px`;
                    wallV.onclick = (e) => { e.stopPropagation(); handleSetupWallClick('v', r, c); };
                    board.appendChild(wallV);
                }
            }
            container.appendChild(board);
            validateCurrentSetup();
        }

        function createLabel(text) {
            const div = document.createElement('div');
            div.className = 'axis-label';
            div.innerText = text;
            return div;
        }

        function handleSetupCellClick(r, c) {
            if (setupStep === 'start') {
                tempStart = {r, c};
                setupStep = 'goal';
                document.getElementById('setup-title').innerText = 'ゴール(G)の位置を選択';
                renderSetupBoard();
            } else if (setupStep === 'goal') {
                if (tempStart.r === r && tempStart.c === c) return;
                tempGoal = {r, c};
                setupStep = 'walls';
                document.getElementById('setup-title').innerText = `壁を配置 (${0}/${state.wallCount})`;
                renderSetupBoard();
            }
        }

        function handleSetupWallClick(type, r, c) {
            if (setupStep !== 'walls') return;
            const index = tempWalls.findIndex(w => w.type === type && w.r === r && w.c === c);
            if (index > -1) {
                tempWalls.splice(index, 1);
            } else {
                if (tempWalls.length >= state.wallCount) return;
                tempWalls.push({type, r, c});
            }
            document.getElementById('setup-title').innerText = `壁を配置 (${tempWalls.length}/${state.wallCount})`;
            renderSetupBoard();
        }

        // ゴール到達可能か（ソルバビリティ）を判定するBFSバリデーション
        function isMazeSolvable(start, goal, walls, size) {
            const queue = [start];
            const visited = Array.from({length: size}, () => Array(size).fill(false));
            visited[start.r][start.c] = true;

            while (queue.length > 0) {
                const curr = queue.shift();
                if (curr.r === goal.r && curr.c === goal.c) return true;

                const dirs = [
                    {r: -1, c: 0, type: 'h', wallR: curr.r, wallC: curr.c}, // 上
                    {r: 1, c: 0, type: 'h', wallR: curr.r + 1, wallC: curr.c}, // 下
                    {r: 0, c: -1, type: 'v', wallR: curr.r, wallC: curr.c}, // 左
                    {r: 0, c: 1, type: 'v', wallR: curr.r, wallC: curr.c + 1} // 右
                ];

                for (const d of dirs) {
                    const nextR = curr.r + d.r;
                    const nextC = curr.c + d.c;
                    if (nextR >= 0 && nextR < size && nextC >= 0 && nextC < size && !visited[nextR][nextC]) {
                        const hasWall = walls.some(w => w.type === d.type && w.r === d.wallR && w.c === d.wallC);
                        if (!hasWall) {
                            visited[nextR][nextC] = true;
                            queue.push({r: nextR, c: nextC});
                        }
                    }
                }
            }
            return false;
        }

        function validateCurrentSetup() {
            const errorBox = document.getElementById('setup-error-box');
            const btn = document.getElementById('btn-complete-setup');

            if (tempWalls.length < state.wallCount || !tempStart || !tempGoal) {
                errorBox.innerText = '';
                btn.disabled = true;
                btn.className = 'secondary';
                return;
            }

            const solvable = isMazeSolvable(tempStart, tempGoal, tempWalls, state.gridSize);
            if (!solvable) {
                errorBox.innerText = '⚠️ 警告: この配置ではゴールにたどり着けません！壁や配置を変更してください。';
                btn.disabled = true;
                btn.className = 'secondary';
            } else {
                errorBox.innerText = '✅ ゴール到達可能です！';
                btn.disabled = false;
                btn.className = '';
            }
        }
        function completeSetup() {
            state.myCreatorStart = tempStart;
            state.myCreatorGoal = tempGoal;
            state.myCreatorWalls = tempWalls;

            state.mySolveStart = {r: 0, c: 0};
            state.mySolveGoal = {r: 5, c: 5};
            generateRandomSolveWalls();

            state.currentPos = { ...state.mySolveStart };
            state.opponentStart = { ...state.myCreatorStart };
            state.opponentGoal = { ...state.myCreatorGoal };
            state.opponentPos = { ...state.opponentStart };

            state.hitWalls = [];
            state.suddenDeath = false;
            state.suddenDeathPlayer = null;
            state.gameOver = false;
            state.waitingForOverlayTap = false;

            state.isMyTurn = Math.random() < 0.5;
            state.logs = [`[システム] ゲーム開始！壁の数は ${state.wallCount} 個です。`];
            if (state.isMyTurn) {
                state.logs.push(`[システム] 抽選の結果、**${state.name}（あなた）の先攻** です！`);
            } else {
                state.logs.push(`[システム] 抽選の結果、**相手の先攻** です！`);
            }

            if (state.role === 'spectator') {
                document.getElementById('game-chat-input-area').style.display = 'flex';
                state.logs.push(`[システム] ${state.name} が観戦者として参加しました。`);
            } else {
                document.getElementById('game-chat-input-area').style.display = 'none';
            }

            initGameScreen();

            if (!state.isMyTurn && state.gameMode === 'cpu') {
                setTimeout(() => triggerCpuTurn(), 1000);
            }
        }

        // ゴール可能なCPU用のランダム壁生成
        function generateRandomSolveWalls() {
            while (true) {
                const walls = [];
                while (walls.length < state.wallCount) {
                    const type = Math.random() < 0.5 ? 'h' : 'v';
                    let r, c;
                    if (type === 'h') {
                        r = Math.floor(Math.random() * 5) + 1;
                        c = Math.floor(Math.random() * 6);
                    } else {
                        r = Math.floor(Math.random() * 6);
                        c = Math.floor(Math.random() * 5) + 1;
                    }
                    if (!walls.some(w => w.type === type && w.r === r && w.c === c)) {
                        walls.push({type, r, c});
                    }
                }
                if (isMazeSolvable(state.mySolveStart, state.mySolveGoal, walls, state.gridSize)) {
                    state.mySolveWalls = walls;
                    break;
                }
            }
        }

        function initGameScreen() {
            switchScreen('screen-game');
            document.getElementById('pane-title-solve').innerText = `${state.name} の解く盤面`;
            updateGameUI();
        }

        function updateGameUI() {
            const header = document.getElementById('game-turn-header');
            const controls = document.getElementById('player-dir-controls');

            if (state.gameOver) {
                header.innerText = 'ゲーム終了 (感想戦中)';
                controls.style.display = 'none';
            } else if (state.isMyTurn) {
                header.innerText = state.suddenDeath ? 'サドンデス中 (あなたのターン)' : 'ゲーム進行中 (あなたのターン)';
                header.style.color = '#27ae60';
                controls.style.display = 'grid';
            } else {
                header.innerText = state.suddenDeath ? 'サドンデス中 (相手のターン)' : 'ゲーム進行中 (相手のターン)';
                header.style.color = '#e74c3c';
                controls.style.display = 'none';
            }
            renderDualBoards();
            updateLogDisplay();
        }

        function renderDualBoards() {
            renderSolveBoard();
            renderCreatorBoard();
        }

        // 1. 自分が解く盤面
        function renderSolveBoard() {
            const container = document.getElementById('solve-board-container');
            container.innerHTML = '';
            const board = document.createElement('div');
            board.className = 'board';

            board.appendChild(createLabel(''));
            for (let c = 0; c < state.gridSize; c++) board.appendChild(createLabel(c + 1));

            const cols = ['A', 'B', 'C', 'D', 'E', 'F'];
            for (let r = 0; r < state.gridSize; r++) {
                board.appendChild(createLabel(cols[r]));
                for (let c = 0; c < state.gridSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    
                    if (state.mySolveStart.r === r && state.mySolveStart.c === c && !state.gameOver) {
                        cell.classList.add('start');
                        cell.innerHTML = '<span class="cell-tag-large">S</span>';
                    }
                    if (state.mySolveGoal.r === r && state.mySolveGoal.c === c) {
                        cell.classList.add('goal');
                        cell.innerHTML = '<span class="cell-tag-large">G</span>';
                    }
                    if (state.currentPos.r === r && state.currentPos.c === c) {
                        cell.innerHTML += svgPlayerIcon;
                    }
                    board.appendChild(cell);
                }
            }

            const cellSize = 36;
            const labelSize = 20;

            state.mySolveWalls.forEach(w => {
                const isHit = state.hitWalls.some(hw => hw.type === w.type && hw.r === w.r && hw.c === w.c);
                if (isHit || state.gameOver) {
                    const wallDiv = document.createElement('div');
                    wallDiv.className = `wall-${w.type} wall-hit`;
                    if (w.type === 'h') {
                        wallDiv.style.top = `${labelSize + w.r * cellSize}px`;
                        wallDiv.style.left = `${labelSize + w.c * cellSize}px`;
                        wallDiv.style.width = `${cellSize}px`;
                    } else {
                        wallDiv.style.top = `${labelSize + w.r * cellSize}px`;
                        wallDiv.style.left = `${labelSize + w.c * cellSize}px`;
                        wallDiv.style.height = `${cellSize}px`;
                    }
                    board.appendChild(wallDiv);
                }
            });

            container.appendChild(board);
        }

        // 2. 自分が作った盤面（相手の位置を表示）
        function renderCreatorBoard() {
            const container = document.getElementById('creator-board-container');
            container.innerHTML = '';
            const board = document.createElement('div');
            board.className = 'board';

            board.appendChild(createLabel(''));
            for (let c = 0; c < state.gridSize; c++) board.appendChild(createLabel(c + 1));

            const cols = ['A', 'B', 'C', 'D', 'E', 'F'];
            for (let r = 0; r < state.gridSize; r++) {
                board.appendChild(createLabel(cols[r]));
                for (let c = 0; c < state.gridSize; c++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell';
                    if (state.myCreatorStart && state.myCreatorStart.r === r && state.myCreatorStart.c === c) {
                        cell.classList.add('start');
                        cell.innerHTML = '<span class="cell-tag-large">S</span>';
                    }
                    if (state.myCreatorGoal && state.myCreatorGoal.r === r && state.myCreatorGoal.c === c) {
                        cell.classList.add('goal');
                        cell.innerHTML = '<span class="cell-tag-large">G</span>';
                    }
                    if (state.opponentPos.r === r && state.opponentPos.c === c) {
                        cell.innerHTML += svgOpponentIcon;
                    }
                    board.appendChild(cell);
                }
            }

            const cellSize = 36;
            const labelSize = 20;

            state.myCreatorWalls.forEach(w => {
                const wallDiv = document.createElement('div');
                wallDiv.className = `wall-${w.type} wall-hit`;
                if (w.type === 'h') {
                    wallDiv.style.top = `${labelSize + w.r * cellSize}px`;
                    wallDiv.style.left = `${labelSize + w.c * cellSize}px`;
                    wallDiv.style.width = `${cellSize}px`;
                } else {
                    wallDiv.style.top = `${labelSize + w.r * cellSize}px`;
                    wallDiv.style.left = `${labelSize + w.c * cellSize}px`;
                    wallDiv.style.height = `${cellSize}px`;
                }
                board.appendChild(wallDiv);
            });

            container.appendChild(board);
        }

        // 壁にぶつかるまで連続で一気に進むメインロジック
        function slideMove(direction) {
            if (state.gameOver || !state.isMyTurn) return;

            let r = state.currentPos.r;
            let c = state.currentPos.c;
            let hitWallObj = null;
            let lastValidCell = {r, c};

            const cols = ['A', 'B', 'C', 'D', 'E', 'F'];

            while (true) {
                let nextR = r;
                let nextC = c;
                if (direction === 'up') nextR--;
                else if (direction === 'down') nextR++;
                else if (direction === 'left') nextC--;
                else if (direction === 'right') nextC++;

                // 盤面の外壁（外枠）に当たった場合
                if (nextR < 0 || nextR >= state.gridSize || nextC < 0 || nextC >= state.gridSize) {
                    break;
                }

                // 内部の壁に当たっているかチェック
                let wallBlocked = false;
                let candidateHit = null;

                if (nextR < r) {
                    wallBlocked = state.mySolveWalls.some(w => w.type === 'h' && w.r === r && w.c === c);
                    candidateHit = { type: 'h', r: r, c: c };
                } else if (nextR > r) {
                    wallBlocked = state.mySolveWalls.some(w => w.type === 'h' && w.r === r + 1 && w.c === c);
                    candidateHit = { type: 'h', r: r + 1, c: c };
                } else if (nextC < c) {
                    wallBlocked = state.mySolveWalls.some(w => w.type === 'v' && w.r === r && w.c === c);
                    candidateHit = { type: 'v', r: r, c: c };
                } else if (nextC > c) {
                    wallBlocked = state.mySolveWalls.some(w => w.type === 'v' && w.r === r && w.c === c + 1);
                    candidateHit = { type: 'v', r: r, c: c + 1 };
                }

                if (wallBlocked) {
                    hitWallObj = candidateHit;
                    break;
                }

                r = nextR;
                c = nextC;
                lastValidCell = {r, c};

                // 途中でゴールに到達した場合
                if (r === state.mySolveGoal.r && c === state.mySolveGoal.c) {
                    break;
                }
            }

            // 移動先の更新
            state.currentPos = lastValidCell;
            const targetCoord = `${cols[state.currentPos.r]}${state.currentPos.c + 1}`;

            if (hitWallObj) {
                showFullscreenSymbol('cross');
                if (!state.hitWalls.some(hw => hw.type === hitWallObj.type && hw.r === hitWallObj.r && hw.c === hitWallObj.c)) {
                    state.hitWalls.push(hitWallObj);
                }

                if (state.suddenDeath && state.suddenDeathPlayer === 'opponent') {
                    state.gameOver = true;
                    state.logs.push(`[システム] ${state.name} がサドンデスで壁に衝突！ 相手の勝ち！`);
                    updateGameUI();
                    showWinOverlay('相手の勝ち！');
                    return;
                }

                state.logs.push(`[ログ] 壁に衝突 (${targetCoord}付近)！ターン交代`);
                state.isMyTurn = false;
                updateGameUI();

                if (state.gameMode === 'cpu' && !state.gameOver) {
                    setTimeout(() => triggerCpuTurn(), 1200);
                }
            } else {
                showFullscreenSymbol('circle');
                state.logs.push(`[ログ] ${targetCoord} まで連続移動成功！`);

                if (state.currentPos.r === state.mySolveGoal.r && state.currentPos.c === state.mySolveGoal.c) {
                    if (!state.suddenDeath) {
                        state.suddenDeath = true;
                        state.suddenDeathPlayer = 'my';
                        showSuddenDeathOverlay();
                        state.logs.push(`[システム] ${state.name} がゴール！後攻（相手）に最後の一手のチャンス（サドンデス）！`);

                        if (state.gameMode === 'cpu') {
                            state.isMyTurn = false;
                            updateGameUI();
                            setTimeout(() => triggerCpuSuddenDeathTurn(), 1600);
                            return;
                        }
                    } else {
                        state.gameOver = true;
                        state.logs.push('[システム] サドンデス成功！引き分け！');
                        updateGameUI();
                        showWinOverlay('引き分け！');
                        return;
                    }
                }

                if (!state.gameOver) {
                    state.isMyTurn = false;
                    updateGameUI();
                    if (state.gameMode === 'cpu') {
                        setTimeout(() => triggerCpuTurn(), 1200);
                    }
                }
            }
        }

        // コンピューター側の連続スライド移動処理
        function triggerCpuTurn() {
            if (state.gameOver) return;
            state.logs.push('[CPU] 迷路を探索中...');
            updateGameUI();

            setTimeout(() => {
                if (state.gameOver) return;

                const dirs = ['up', 'down', 'left', 'right'];
                const chosenDir = dirs[Math.floor(Math.random() * dirs.length)];

                let r = state.opponentPos.r;
                let c = state.opponentPos.c;
                let hitWall = false;
                let lastValid = {r, c};

                while (true) {
                    let nextR = r;
                    let nextC = c;
                    if (chosenDir === 'up') nextR--;
                    else if (chosenDir === 'down') nextR++;
                    else if (chosenDir === 'left') nextC--;
                    else if (chosenDir === 'right') nextC++;

                    if (nextR < 0 || nextR >= state.gridSize || nextC < 0 || nextC >= state.gridSize) {
                        hitWall = true;
                        break;
                    }

                    let wallBlocked = false;
                    if (nextR < r) wallBlocked = state.myCreatorWalls.some(w => w.type === 'h' && w.r === r && w.c === c);
                    else if (nextR > r) wallBlocked = state.myCreatorWalls.some(w => w.type === 'h' && w.r === r + 1 && w.c === c);
                    else if (nextC < c) wallBlocked = state.myCreatorWalls.some(w => w.type === 'v' && w.r === r && w.c === c);
                    else if (nextC > c) wallBlocked = state.myCreatorWalls.some(w => w.type === 'v' && w.r === r && w.c === c + 1);

                    if (wallBlocked) {
                        hitWall = true;
                        break;
                    }

                    r = nextR;
                    c = nextC;
                    lastValid = {r, c};

                    if (r === state.opponentGoal.r && c === state.opponentGoal.c) {
                        break;
                    }
                }

                state.opponentPos = lastValid;

                if (hitWall) {
                    showFullscreenSymbol('cross');
                    state.logs.push('[CPU] 自分が作った盤面で壁に衝突しました！');

                    if (state.suddenDeath && state.suddenDeathPlayer === 'my') {
                        state.gameOver = true;
                        state.logs.push(`[システム] CPUがサドンデスで壁に衝突！ **${state.name} の勝ち！**`);
                        updateGameUI();
                        showWinOverlay(`${state.name} の勝ち！`);
                        return;
                    }

                    state.isMyTurn = true;
                    updateGameUI();
                } else {
                    showFullscreenSymbol('circle');
                    state.logs.push('[CPU] 連続移動成功！');

                    if (state.opponentPos.r === state.opponentGoal.r && state.opponentPos.c === state.opponentGoal.c) {
                        if (!state.suddenDeath) {
                            state.suddenDeath = true;
                            state.suddenDeathPlayer = 'opponent';
                            showSuddenDeathOverlay();
                            state.logs.push('[システム] 相手（CPU）が先にゴール！あなたに最後の一手のチャンス（サドンデス）！');
                            state.isMyTurn = true;
                            updateGameUI();
                            return;
                        } else {
                            state.gameOver = true;
                            state.logs.push('[システム] サドンデス成立！引き分け！');
                            updateGameUI();
                            showWinOverlay('引き分け！');
                            return;
                        }
                    }

                    state.isMyTurn = true;
                    updateGameUI();
                }
            }, 1500);
        }

        // サドンデス時のCPU最後の一手
        function triggerCpuSuddenDeathTurn() {
            if (state.gameOver) return;
            state.logs.push('[CPU] サドンデス：最後の一手を思考中...');
            updateGameUI();

            setTimeout(() => {
                if (state.gameOver) return;
                const hit = Math.random() < 0.5;
                if (hit) {
                    showFullscreenSymbol('cross');
                    state.gameOver = true;
                    state.logs.push(`[システム] サドンデスでCPUが壁に衝突！ **${state.name} の勝ち！**`);
                    updateGameUI();
                    showWinOverlay(`${state.name} の勝ち！`);
                } else {
                    showFullscreenSymbol('circle');
                    state.gameOver = true;
                    state.logs.push('[システム] サドンデスでCPUがゴール成功！ 相手の勝ち！');
                    updateGameUI();
                    showWinOverlay('相手の勝ち！');
                }
            }, 1500);
        }

        // サドンデス演出
        function showSuddenDeathOverlay() {
            const overlay = document.getElementById('fullscreen-overlay');
            const box = document.getElementById('feedback-symbol-box');
            overlay.style.display = 'flex';
            box.className = 'feedback-symbol fb-sudden';
            box.innerHTML = 'サドンデス！';
            state.waitingForOverlayTap = true;
        }

        // 勝利演出（タップ待ち）
        function showWinOverlay(winnerText) {
            const overlay = document.getElementById('fullscreen-overlay');
            const box = document.getElementById('feedback-symbol-box');
            overlay.style.display = 'flex';
            box.className = 'feedback-symbol fb-win';
            box.innerHTML = winnerText;
            state.waitingForOverlayTap = true;
        }

        // オーバーレイがタップされたときの処理（演出を消して感想戦へ）
        function handleOverlayClick() {
            if (state.waitingForOverlayTap) {
                document.getElementById('fullscreen-overlay').style.display = 'none';
                state.waitingForOverlayTap = false;
            }
        }

        // 巨大シンボル（〇 と 赤字の☓）
        function showFullscreenSymbol(type) {
            const overlay = document.getElementById('fullscreen-overlay');
            const box = document.getElementById('feedback-symbol-box');
            
            overlay.style.display = 'flex';
            state.waitingForOverlayTap = false;

            if (type === 'circle') {
                box.className = 'feedback-symbol fb-circle';
                box.innerHTML = '〇';
            } else {
                box.className = 'feedback-symbol fb-cross';
                box.innerHTML = '☓'; // 鮮やかな赤字
            }

            setTimeout(() => {
                if (!state.waitingForOverlayTap && document.getElementById('fullscreen-overlay').style.display === 'flex') {
                    overlay.style.display = 'none';
                }
            }, 550);
        }

        function updateLogDisplay() {
            const lastLogs = state.logs.slice(-5).join('\n');
            const box = document.getElementById('game-log-box');
            if (box) {
                box.innerText = lastLogs;
                box.scrollTop = box.scrollHeight;
            }
        }

        function sendChat() {
            const input = document.getElementById('game-chat-input');
            const text = input.value.trim();
            if (!text) return;
            state.logs.push(`[チャット] ${state.name}(観戦): ${text}`);
            input.value = '';
            updateLogDisplay();
        }

        function openHistoryModal() {
            const modal = document.getElementById('history-modal');
            const historyBox = document.getElementById('modal-history-box');
            historyBox.innerText = state.logs.join('\n');
            modal.style.display = 'flex';
            historyBox.scrollTop = historyBox.scrollHeight;
        }

        function closeHistoryModal() {
            document.getElementById('history-modal').style.display = 'none';
        }
    </script>
</body>
